                - paragraph [ref=f17e178]:
                  - text: The okapi (
                  - link /oʊˈkɑːpi/ [ref=f17e181] [cursor=pointer]:
                    - /url: ./Help:IPA/English
                    - text: /
                    - generic [ref=f17e182]: oʊˈkɑːpi
                    - text: /
                  - text: ;
                  - generic [ref=f17e183]: Okapia johnstoni
                  - text: ), also known as the forest giraffe,
                  - superscript [ref=f17e184]:
                    - link "[2]" [ref=f17e185] [cursor=pointer]:
                      - /url: ./Okapi#cite_note-2
                      - generic [ref=f17e186]: "[2]"
                  - text: and zebra giraffe, is an
                  - link "artiodactyl" [ref=f17e187] [cursor=pointer]:
                    - /url: ./Artiodactyl
                  - link "mammal" [ref=f17e188] [cursor=pointer]:
                    - /url: ./Mammal
                  - text: that is
                  - link "endemic" [ref=f17e189] [cursor=pointer]:
                    - /url: ./Endemic
                  - text: to the northeast
                  - link "Democratic Republic of the Congo" [ref=f17e190] [cursor=pointer]:
                    - /url: ./Democratic_Republic_of_the_Congo
                  - text: in central Africa. However, non-invasive genetic identification has suggested that a population has occurred south-west of the Congo River as well.
                  - superscript [ref=f17e191]:
                    - link "[3]" [ref=f17e192] [cursor=pointer]:
                      - /url: ./Okapi#cite_note-3
                      - generic [ref=f17e193]: "[3]"
                  - text: It is the
                  - link "only species" [ref=f17e194] [cursor=pointer]:
                    - /url: ./Monotypic_taxon
                  - text: in the
                  - link "genus" [ref=f17e195] [cursor=pointer]:
                    - /url: ./Genus
                  - generic [ref=f17e196]: Okapia
                  - text: . Although the okapi has striped markings reminiscent of
                  - link "zebras" [ref=f17e197] [cursor=pointer]:
                    - /url: ./Zebra
                  - text: ", it is most closely related to the"
                  - link "giraffe" [ref=f17e198] [cursor=pointer]:
                    - /url: ./Giraffe
                  - text: . The okapi and the giraffe are the only living members of the family
                  - link "Giraffidae" [ref=f17e199] [cursor=pointer]:
                    - /url: ./Giraffidae
                  - text: .
                - paragraph [ref=f17e200]:
                  - text: The okapi stands about 1.5 m (4 ft 11 in) tall at the shoulder and has a typical body length around 2.5 m (8 ft 2 in). Its weight ranges from 200 to 350 kg (440 to 770 lb). It has a long neck, and large, flexible ears. Its coat is a chocolate to reddish brown, much in contrast with the white horizontal stripes and rings on the legs, and white ankles. Male okapis have short, distinct horn-like protuberances on their heads called
                  - link "ossicones" [ref=f17e201] [cursor=pointer]:
                    - /url: ./Ossicone
                  - text: ", less than 15 cm (5.9 in) in length. Females possess"
                  - link "hair whorls" [ref=f17e202] [cursor=pointer]:
                    - /url: ./Hair_whorl
                  - text: ", and ossicones are absent."
                - paragraph [ref=f17e203]:
                  - text: Okapis are primarily
                  - link "diurnal" [ref=f17e204] [cursor=pointer]:
                    - /url: ./Diurnality
                  - text: ", but may be active for a few hours in darkness. They are essentially solitary, coming together only to breed."
                  - superscript [ref=f17e205]:
                    - link "[4]" [ref=f17e206] [cursor=pointer]:
                      - /url: ./Okapi#cite_note-4
                      - generic [ref=f17e207]: "[4]"
                  - text: Okapis are
                  - link "herbivores" [ref=f17e208] [cursor=pointer]:
                    - /url: ./Herbivore
                  - text: ", feeding on tree leaves and buds, grasses, ferns, fruits, and"
                  - link "fungi" [ref=f17e209] [cursor=pointer]:
                    - /url: ./Fungus
                  - text: . Rut in males and estrus in females does not depend on the season. In captivity, estrus cycles recur every 15 days. The
                  - link "gestational period" [ref=f17e210] [cursor=pointer]:
                    - /url: ./Gestational_period
                  - text: is around 440 to 450 days long, following which usually a single calf is born. The juveniles are kept in hiding, and nursing takes place infrequently. Juveniles start taking solid food from three months, and weaning takes place at six months.
                - paragraph [ref=f17e211]:
                  - text: Okapis inhabit
                  - link "canopy" [ref=f17e212] [cursor=pointer]:
                    - /url: ./Canopy_(biology)
                  - text: forests at altitudes of 500–1,500 m (1,600–4,900 ft). The
                  - link "International Union for the Conservation of Nature and Natural Resources" [ref=f17e213] [cursor=pointer]:
                    - /url: ./International_Union_for_the_Conservation_of_Nature_and_Natural_Resources
                  - text: classifies the okapi as
                  - link "endangered" [ref=f17e214] [cursor=pointer]:
                    - /url: ./Endangered
                  - text: . Major threats include habitat loss due to
                  - link "logging" [ref=f17e215] [cursor=pointer]:
                    - /url: ./Logging
                  - text: and human settlement.
                  - link "Illegal mining" [ref=f17e216] [cursor=pointer]:
                    - /url: ./Illegal_mining
                  - text: and extensive hunting for
                  - link "bushmeat" [ref=f17e217] [cursor=pointer]:
                    - /url: ./Bushmeat
                  - text: and skin have also led to a decline in populations. The
                  - link "Okapi Conservation Project" [ref=f17e218] [cursor=pointer]:
                    - /url: ./Okapi_Conservation_Project
                  - text: was established in 1987 to protect okapi populations.
              - generic [ref=f17e219]:
                - heading "Etymology and taxonomy" [level=2] [ref=f17e220]
                - paragraph [ref=f17e221]:
                  - text: Although the okapi was unknown to the Western world until the 20th century, it may have been depicted since the early fifth century BCE on the
                  - link "façade" [ref=f17e222] [cursor=pointer]:
                    - /url: ./Façade
                  - text: of the
                  - link "Apadana" [ref=f17e223] [cursor=pointer]:
                    - /url: ./Apadana
                  - text: at
                  - link "Persepolis" [ref=f17e224] [cursor=pointer]:
                    - /url: ./Persepolis
                  - text: ", a gift from the Ethiopian procession to the"
                  - link "Achaemenid" [ref=f17e225] [cursor=pointer]:
                    - /url: ./Achaemenid
                  - text: kingdom.
                  - superscript [ref=f17e226]:
                    - link "[5]" [ref=f17e227] [cursor=pointer]:
                      - /url: ./Okapi#cite_note-5
                      - generic [ref=f17e228]: "[5]"
                  - superscript [ref=f17e229]:
                    - link "[6]" [ref=f17e230] [cursor=pointer]:
                      - /url: ./Okapi#cite_note-6
                      - generic [ref=f17e231]: "[6]"
                - paragraph [ref=f17e232]:
                  - text: For years, Europeans in Africa had heard of an animal that they came to call the African
                  - link "unicorn" [ref=f17e233] [cursor=pointer]:
                    - /url: ./Unicorn
                  - text: .
                  - superscript [ref=f17e234]:
                    - link "[7]" [ref=f17e235] [cursor=pointer]:
                      - /url: ./Okapi#cite_note-7
                      - generic [ref=f17e236]: "[7]"
                  - superscript [ref=f17e237]:
                    - link "[8]" [ref=f17e238] [cursor=pointer]:
                      - /url: ./Okapi#cite_note-8
                      - generic [ref=f17e239]: "[8]"
                  - text: It was brought to prominent European attention by speculation on its existence found in press reports covering
                  - link "Henry Morton Stanley" [ref=f17e240] [cursor=pointer]:
                    - /url: ./Henry_Morton_Stanley
                  - text: "'s journeys in 1887. In his travelogue of exploring the Congo, Stanley mentioned a kind of"
                  - link "donkey" [ref=f17e241] [cursor=pointer]:
                    - /url: ./Donkey
                  - text: that the natives called the atti, which scholars later identified as the okapi.
                  - superscript [ref=f17e242]:
                    - link "[9]" [ref=f17e243] [cursor=pointer]:
                      - /url: ./Okapi#cite_note-9
                      - generic [ref=f17e244]: "[9]"
                - paragraph [ref=f17e245]:
                  - text: When the British special commissioner in Uganda,
                  - link "Sir Harry Johnston" [ref=f17e246] [cursor=pointer]:
                    - /url: ./Harry_Johnston
                  - text: ", discovered some"
                  - link "Pygmy" [ref=f17e247] [cursor=pointer]:
                    - /url: ./African_Pygmies
                  - text: inhabitants of the Congo being abducted by a showman for exhibition, he rescued them and promised to return them to their homes. The Pygmies fed Johnston's curiosity about the animal mentioned in Stanley's book. Johnston was puzzled by the okapi tracks the natives showed him; while he had expected to be on the trail of some sort of forest-dwelling horse, the tracks were of a cloven-hoofed beast.
                  - superscript [ref=f17e248]:
                    - link "[10]" [ref=f17e249] [cursor=pointer]:
                      - /url: ./Okapi#cite_note-10
                      - generic [ref=f17e250]: "[10]"
                - figure "Illustration from an original painting by Sir Harry Johnston, based on preserved skins (1901)" [ref=f17e251]:
                  - link [ref=f17e252] [cursor=pointer]:
                    - /url: ./File:Okapi_1901.jpg
                    - img [ref=f17e253]
                  - generic [ref=f17e254]: Illustration from an original painting by Sir Harry Johnston, based on preserved skins (1901)
                - paragraph [ref=f17e255]:
                  - text: Though Johnston did not see an okapi himself, he did manage to obtain pieces of striped skin and eventually a skull. From this skull, the okapi was correctly classified as a relative of the giraffe; in 1901, the species was formally recognized as Okapia johnstoni.
                  - superscript [ref=f17e256]:
                    - link "[11]" [ref=f17e257] [cursor=pointer]:
                      - /url: ./Okapi#cite_note-auto-11
                      - generic [ref=f17e258]: "[11]"
                - paragraph [ref=f17e259]:
                  - text: Okapia johnstoni was first described as Equus johnstoni by English zoologist
                  - link "Philip Lutley Sclater" [ref=f17e260] [cursor=pointer]:
                    - /url: ./Philip_Sclater
                  - text: in 1901.
                  - superscript [ref=f17e261]:
                    - link "[12]" [ref=f17e262] [cursor=pointer]:
                      - /url: ./Okapi#cite_note-12
                      - generic [ref=f17e263]: "[12]"
                  - text: The
                  - link "generic name" [ref=f17e264] [cursor=pointer]:
                    - /url: ./Genus
                  - text: Okapia derives either from the
                  - link "Mbuba" [ref=f17e265] [cursor=pointer]:
                    - /url: ./Mvuba_language
                  - text: name
                  - generic "Mvuba-language text" [ref=f17e266]: okapi
                  - superscript [ref=f17e267]:
                    - link "[13]" [ref=f17e268] [cursor=pointer]:
                      - /url: ./Okapi#cite_note-OED-13
                      - generic [ref=f17e269]: "[13]"
                  - text: or the related
                  - link "Lese" [ref=f17e270] [cursor=pointer]:
                    - /url: ./Lese_language
                  - link "Karo" [ref=f17e271] [cursor=pointer]:
                    - /url: ./Bari_language
                  - text: name
                  - generic "Lese-language text" [ref=f17e272]: o'api
                  - text: ", while the"
                  - link "specific name" [ref=f17e273] [cursor=pointer]:
                    - /url: ./Specific_name_(zoology)
                  - text: (johnstoni) is in recognition of Johnston, who first acquired an okapi specimen for science from the
                  - link "Ituri Forest" [ref=f17e274] [cursor=pointer]:
                    - /url: ./Ituri_Forest
                  - text: .
                  - superscript [ref=f17e275]:
                    - link "[11]" [ref=f17e276] [cursor=pointer]:
                      - /url: ./Okapi#cite_note-auto-11
                      - generic [ref=f17e277]: "[11]"
                  - superscript [ref=f17e278]:
                    - link "[14]" [ref=f17e279] [cursor=pointer]:
                      - /url: ./Okapi#cite_note-14
                      - generic [ref=f17e280]: "[14]"
                - paragraph [ref=f17e281]:
                  - text: In 1901, Sclater presented a painting of the okapi before the
                  - link "Zoological Society of London" [ref=f17e282] [cursor=pointer]:
                    - /url: ./Zoological_Society_of_London
                  - text: that depicted its physical features with some clarity. Much confusion arose regarding the taxonomical status of this newly discovered animal. Sir Harry Johnston himself called it a
                  - link "Helladotherium" [ref=f17e284] [cursor=pointer]:
                    - /url: ./Helladotherium
                  - text: ", or a relative of other extinct giraffids."
                  - superscript [ref=f17e285]:
                    - link "[15]" [ref=f17e286] [cursor=pointer]:
                      - /url: ./Okapi#cite_note-15
                      - generic [ref=f17e287]: "[15]"
                  - text: Based on the description of the okapi by Pygmies, who referred to it as a "horse", Sclater named the species
                  - generic [ref=f17e288]:
                    - link "Equus" [ref=f17e289] [cursor=pointer]:
                      - /url: ./Equus_(genus)
                    - text: johnstoni
                  - text: .
                  - superscript [ref=f17e290]:
                    - link "[16]" [ref=f17e291] [cursor=pointer]:
                      - /url: ./Okapi#cite_note-kingdon1979-16
                      - generic [ref=f17e292]: "[16]"
                  - text: Subsequently, zoologist
                  - link "Ray Lankester" [ref=f17e293] [cursor=pointer]:
                    - /url: ./Ray_Lankester
                  - text: declared that the okapi represented an unknown genus of the
                  - link "Giraffidae" [ref=f17e294] [cursor=pointer]:
                    - /url: ./Giraffidae
                  - text: ", which he placed in its own genus, Okapia, and assigned the name Okapia johnstoni to the species."
                  - superscript [ref=f17e295]:
                    - link "[17]" [ref=f17e296] [cursor=pointer]:
                      - /url: ./Okapi#cite_note-prothero-17
                      - generic [ref=f17e297]: "[17]"
                - paragraph [ref=f17e298]:
                  - text: In 1902, Swiss zoologist
                  - link "Charles Immanuel Forsyth Major" [ref=f17e299] [cursor=pointer]:
                    - /url: ./Charles_Immanuel_Forsyth_Major
                  - text: suggested the inclusion of O. johnstoni in the extinct giraffid subfamily
                  - link "Palaeotraginae" [ref=f17e300] [cursor=pointer]:
                    - /url: ./Palaeotragus
                  - text: . However, the species was placed in its own subfamily Okapiinae, by Swedish
                  - link "palaeontologist" [ref=f17e301] [cursor=pointer]:
                    - /url: ./Palaeontologist
                  - link "Birger Bohlin" [ref=f17e302] [cursor=pointer]:
                    - /url: ./Birger_Bohlin
                  - text: in 1926,
                  - superscript [ref=f17e303]:
                    - link "[18]" [ref=f17e304] [cursor=pointer]:
                      - /url: ./Okapi#cite_note-18
                      - generic [ref=f17e305]: "[18]"
                  - text: mainly due to the lack of a
                  - link "cingulum" [ref=f17e306] [cursor=pointer]:
                    - /url: ./Cingulum_(tooth)
                  - text: ", a major feature of the palaeotragids."
                  - superscript [ref=f17e307]:
                    - link "[19]" [ref=f17e308] [cursor=pointer]:
                      - /url: ./Okapi#cite_note-colbert-19
                      - generic [ref=f17e309]: "[19]"
                  - text: In 1986, Okapia was finally established as a sister genus of
                  - link "Giraffa" [ref=f17e311] [cursor=pointer]:
                    - /url: ./Giraffa
                  - text: on the basis of
                  - link "cladistic" [ref=f17e312] [cursor=pointer]:
                    - /url: ./Cladistics
                  - text: analysis. The two genera together with
                  - link "Palaeotragus" [ref=f17e314] [cursor=pointer]:
                    - /url: ./Palaeotragus
                  - text: constitute the tribe Giraffini.
                  - superscript [ref=f17e315]:
                    - link "[20]" [ref=f17e316] [cursor=pointer]:
                      - /url: ./Okapi#cite_note-geraads-20
                      - generic [ref=f17e317]: "[20]"
                - generic [ref=f17e318]:
                  - heading "Evolution" [level=3] [ref=f17e319]
                  - figure "Despite the vast difference in neck length, the okapi (left) and the giraffe (right) both have seven cervical vertebrae (as do all mammals except for manatees and sloths)." [ref=f17e320]:
                    - link [ref=f17e321] [cursor=pointer]:
                      - /url: ./File:Okapi_Giraffe_Neck.png
                      - img [ref=f17e322]
                    - generic [ref=f17e323]:
                      - text: Despite the vast difference in neck length, the okapi (left) and the giraffe (right) both have seven
                      - link "cervical vertebrae" [ref=f17e324] [cursor=pointer]:
                        - /url: ./Cervical_vertebrae
                      - text: (as do all mammals except for manatees and sloths).
                  - paragraph [ref=f17e325]:
                    - text: The earliest members of the Giraffidae first appeared in the early
                    - link "Miocene" [ref=f17e326] [cursor=pointer]:
                      - /url: ./Miocene
                    - text: in Africa, having diverged from the superficially deer-like
                    - link "climacoceratids" [ref=f17e327] [cursor=pointer]:
                      - /url: ./Climacoceratidae
                    - text: . Giraffids spread into Europe and Asia by the middle Miocene in a first
                    - link "radiation" [ref=f17e328] [cursor=pointer]:
                      - /url: ./Radiation_(biology)
                    - text: . Another radiation began in the
                    - link "Pliocene" [ref=f17e329] [cursor=pointer]:
                      - /url: ./Pliocene
                    - text: ", but was terminated by a decline in diversity in the"
                    - link "Pleistocene" [ref=f17e330] [cursor=pointer]:
                      - /url: ./Pleistocene
                    - text: .
                    - superscript [ref=f17e331]:
                      - link "[21]" [ref=f17e332] [cursor=pointer]:
                        - /url: ./Okapi#cite_note-finlayson-21
                        - generic [ref=f17e333]: "[21]"
                    - text: Several important primitive giraffids existed more or less contemporaneously in the Miocene (23–10 million years ago), including
                    - link "Canthumeryx" [ref=f17e335] [cursor=pointer]:
                      - /url: ./Canthumeryx
                    - text: ","
                    - link "Giraffokeryx" [ref=f17e337] [cursor=pointer]:
                      - /url: ./Giraffokeryx
                    - text: ","
                    - link "Palaeotragus" [ref=f17e339] [cursor=pointer]:
                      - /url: ./Palaeotragus
                    - text: ", and"
                    - link "Samotherium" [ref=f17e341] [cursor=pointer]:
                      - /url: ./Samotherium
                    - text: . According to palaeontologist and author Kathleen Hunt, Samotherium split into Okapia (18 million years ago) and Giraffa (12 million years ago).
                    - superscript [ref=f17e342]:
                      - link "[22]" [ref=f17e343] [cursor=pointer]:
                        - /url: ./Okapi#cite_note-22
                        - generic [ref=f17e344]: "[22]"
                    - text: However, J. D. Skinner argued that Canthumeryx gave rise to the okapi and giraffe through the latter three genera and that the okapi is the extant form of Palaeotragus.
                    - superscript [ref=f17e345]:
                      - link "[23]" [ref=f17e346] [cursor=pointer]:
                        - /url: ./Okapi#cite_note-23
                        - generic [ref=f17e347]: "[23]"
                    - text: The okapi is sometimes referred to as a
                    - link "living fossil" [ref=f17e348] [cursor=pointer]:
                      - /url: ./Living_fossil
                    - text: ", as it has existed as a species over a long geological time period, and morphologically resembles more primitive forms (e.g. Samotherium)."
                    - superscript [ref=f17e349]:
                      - link "[17]" [ref=f17e350] [cursor=pointer]:
                        - /url: ./Okapi#cite_note-prothero-17
                        - generic [ref=f17e351]: "[17]"
                    - superscript [ref=f17e352]:
                      - link "[24]" [ref=f17e353] [cursor=pointer]:
                        - /url: ./Okapi#cite_note-auto1-24
                        - generic [ref=f17e354]: "[24]"
                  - paragraph [ref=f17e355]:
                    - text: In 2016, a genetic study found that the common ancestor of giraffe and okapi lived about 11.5 million years ago.
                    - superscript [ref=f17e356]:
                      - link "[25]" [ref=f17e357] [cursor=pointer]:
                        - /url: ./Okapi#cite_note-25
                        - generic [ref=f17e358]: "[25]"
              - generic [ref=f17e359]:
                - heading "Description" [level=2] [ref=f17e360]
                - figure "Male okapi displaying his striking horizontal stripes" [ref=f17e361]:
                  - link [ref=f17e362] [cursor=pointer]:
                    - /url: ./File:Okapi_(Okapia_johnstoni)_2009-04-04_04.jpg
                    - img [ref=f17e363]
                  - generic [ref=f17e364]: Male okapi displaying his striking horizontal stripes
                - paragraph [ref=f17e365]:
                  - text: The okapi is a medium-sized giraffid, standing 1.5 m (4 ft 11 in) tall at the shoulder. Its average body length is about 2.5 m (8 ft 2 in) and its weight ranges from 200 to 350 kg (440 to 770 lb).
                  - superscript [ref=f17e366]:
                    - link "[26]" [ref=f17e367] [cursor=pointer]:
                      - /url: ./Okapi#cite_note-Burnie-26
                      - generic [ref=f17e368]: "[26]"
                  - text: It has a long neck, and large and flexible ears. In sharp contrast to the white horizontal stripes on the legs and white ankles, the okapi's coat is a chocolate to reddish brown. The distinctive stripes resemble those of a zebra.
                  - superscript [ref=f17e369]:
                    - link "[27]" [ref=f17e370] [cursor=pointer]:
                      - /url: ./Okapi#cite_note-adw-27
                      - generic [ref=f17e371]: "[27]"
                  - text: These features serve as an effective camouflage amidst dense vegetation. The face, throat, and chest are greyish white.
                  - link "Interdigital glands" [ref=f17e372] [cursor=pointer]:
                    - /url: ./Interdigital_gland
                  - text: are present on all four feet, and are slightly larger on the front feet.
                  - superscript [ref=f17e373]:
                    - link "[28]" [ref=f17e374] [cursor=pointer]:
                      - /url: ./Okapi#cite_note-bodmer-28
                      - generic [ref=f17e375]: "[28]"
                  - text: Male okapis have short, hair-covered horn-like structures called
                  - link "ossicones" [ref=f17e376] [cursor=pointer]:
                    - /url: ./Ossicone
                  - text: ", less than 15 cm (5.9 in) in length, which are similar in form and function to the ossicones of a"
                  - link "giraffe" [ref=f17e377] [cursor=pointer]:
                    - /url: ./Giraffe
                  - text: .
                  - superscript [ref=f17e378]:
                    - link "[29]" [ref=f17e379] [cursor=pointer]:
                      - /url: ./Okapi#cite_note-29
                      - generic [ref=f17e380]: "[29]"
                  - text: The okapi exhibits
                  - link "sexual dimorphism" [ref=f17e381] [cursor=pointer]:
                    - /url: ./Sexual_dimorphism
                  - text: ", with females 4.2 cm (1.7 in) taller on average, slightly redder, and lacking prominent ossicones, instead possessing"
                  - link "hair whorls" [ref=f17e382] [cursor=pointer]:
                    - /url: ./Hair_whorl
                  - text: .
                  - superscript [ref=f17e383]:
                    - link "[30]" [ref=f17e384] [cursor=pointer]:
                      - /url: ./Okapi#cite_note-grzimek-30
                      - generic [ref=f17e385]: "[30]"
                  - superscript [ref=f17e386]:
                    - link "[31]" [ref=f17e387] [cursor=pointer]:
                      - /url: ./Okapi#cite_note-jstor-31
                      - generic [ref=f17e388]: "[31]"
                - paragraph [ref=f17e389]:
                  - text: The okapi shows several adaptations to its tropical habitat. The large number of
                  - link "rod cells" [ref=f17e390] [cursor=pointer]:
                    - /url: ./Rod_cell
                  - text: in the retina facilitate
                  - link "night vision" [ref=f17e391] [cursor=pointer]:
                    - /url: ./Night_vision
                  - text: ", and an efficient"
                  - link "olfactory system" [ref=f17e392] [cursor=pointer]:
                    - /url: ./Olfactory_system
                  - text: is present. The large
                  - link "auditory bullae" [ref=f17e393] [cursor=pointer]:
                    - /url: ./Auditory_bullae
                  - text: of the temporal bone allow a strong sense of hearing. The
                  - link "dental formula" [ref=f17e394] [cursor=pointer]:
                    - /url: ./Dental_formula
                  - text: of the okapi is
                  - generic [ref=f17e396]:
                    - 'generic "upper dentition: Incisors.Canines.Premolars.Molars" [ref=f17e397]': 0.0.3.3
                    - 'generic "lower dentition: Incisors.Canines.Premolars.Molars" [ref=f17e398]': 3.1.3.3
                  - text: .
                  - superscript [ref=f17e399]:
                    - link "[28]" [ref=f17e400] [cursor=pointer]:
                      - /url: ./Okapi#cite_note-bodmer-28
                      - generic [ref=f17e401]: "[28]"
                  - text: Teeth are low-
                  - link "crowned" [ref=f17e402] [cursor=pointer]:
                    - /url: ./Crown_(dentistry)
                  - text: and finely
                  - link "cusped" [ref=f17e403] [cursor=pointer]:
                    - /url: ./Cusp_(anatomy)
                  - text: ", and efficiently cut tender foliage. The large"
                  - link "cecum and colon" [ref=f17e404] [cursor=pointer]:
                    - /url: ./Large_intestine
                  - text: help in microbial digestion, and a quick rate of food passage allows for lower cell wall digestion than in other
                  - link "ruminants" [ref=f17e405] [cursor=pointer]:
                    - /url: ./Ruminant
                  - text: .
                  - superscript [ref=f17e406]:
                    - link "[32]" [ref=f17e407] [cursor=pointer]:
                      - /url: ./Okapi#cite_note-kingdon-32
                      - generic [ref=f17e408]: "[32]"
                - figure "Head of a male okapi with damaged ossicones" [ref=f17e409]:
                  - link [ref=f17e410] [cursor=pointer]:
                    - /url: ./File:Ybokp_7b_(16224361745).jpg
                    - img [ref=f17e411]
                  - generic [ref=f17e412]:
                    - text: Head of a male okapi with damaged
                    - link "ossicones" [ref=f17e413] [cursor=pointer]:
                      - /url: ./Ossicone
                - paragraph [ref=f17e414]:
                  - text: The okapi is easily distinguished from its nearest extant relative, the giraffe. It is much smaller than the giraffe and shares more external similarities with
                  - link "bovids" [ref=f17e415] [cursor=pointer]:
                    - /url: ./Bovidae
                  - text: and
                  - link "cervids" [ref=f17e416] [cursor=pointer]:
                    - /url: ./Cervidae
                  - text: . Ossicones are present only in the male okapi, while both sexes of giraffe possess this feature. The okapi has large palatine sinuses (hollow cavities in the
                  - link "palate" [ref=f17e417] [cursor=pointer]:
                    - /url: ./Palate
                  - text: ), unique among the giraffids.
                  - link "Morphological" [ref=f17e418] [cursor=pointer]:
                    - /url: ./Morphology_(biology)
                  - text: features shared between the giraffe and the okapi include a similar gait – both use a
                  - link "pacing" [ref=f17e419] [cursor=pointer]:
                    - /url: ./Horse_gait#Pace
                  - text: gait, stepping simultaneously with the front and the hind leg on the same side of the body, unlike other
                  - link "ungulates" [ref=f17e420] [cursor=pointer]:
                    - /url: ./Ungulate
                  - text: that walk by moving alternate legs on either side of the body
                  - superscript [ref=f17e421]:
                    - link "[33]" [ref=f17e422] [cursor=pointer]:
                      - /url: ./Okapi#cite_note-dagg-33
                      - generic [ref=f17e423]: "[33]"
                  - text: – and a long, black tongue (longer in the okapi) useful for plucking buds and leaves, as well as for grooming.
                  - superscript [ref=f17e424]:
                    - link "[32]" [ref=f17e425] [cursor=pointer]:
                      - /url: ./Okapi#cite_note-kingdon-32
                      - generic [ref=f17e426]: "[32]"
              - generic [ref=f17e427]:
                - heading "Ecology and behaviour" [level=2] [ref=f17e428]
                - paragraph [ref=f17e429]:
                  - text: Okapis are primarily
                  - link "diurnal" [ref=f17e430] [cursor=pointer]:
                    - /url: ./Diurnal_animal
                  - text: ", but may be active for a few hours in darkness."
                  - superscript [ref=f17e431]:
                    - link "[34]" [ref=f17e432] [cursor=pointer]:
                      - /url: ./Okapi#cite_note-34
                      - generic [ref=f17e433]: "[34]"
                  - text: They are essentially solitary, coming together only to breed. They have overlapping home ranges and typically occur at densities around 0.6 animals per square kilometre.
                  - superscript [ref=f17e434]:
                    - link "[27]" [ref=f17e435] [cursor=pointer]:
                      - /url: ./Okapi#cite_note-adw-27
                      - generic [ref=f17e436]: "[27]"
                  - text: Male home ranges average 13 km
                  - superscript [ref=f17e437]: "2"
                  - text: (5.0 sq mi), while female home ranges average 3–5 km
                  - superscript [ref=f17e438]: "2"
                  - text: (1.2–1.9 sq mi). Males migrate continuously, while females are sedentary.
                  - superscript [ref=f17e439]:
                    - link "[35]" [ref=f17e440] [cursor=pointer]:
                      - /url: ./Okapi#cite_note-hart-35
                      - generic [ref=f17e441]: "[35]"
                  - text: Males often mark territories and bushes with their urine, while females use common defecation sites. Grooming is a common practice, focused at the earlobes and the neck. Okapis often rub their necks against trees, leaving a brown
                  - link "exudate" [ref=f17e442] [cursor=pointer]:
                    - /url: ./Exudate
                  - text: .
                  - superscript [ref=f17e443]:
                    - link "[28]" [ref=f17e444] [cursor=pointer]:
                      - /url: ./Okapi#cite_note-bodmer-28
                      - generic [ref=f17e445]: "[28]"
                - paragraph [ref=f17e446]:
                  - text: The male is protective of his territory, but allows females to pass through the domain to forage. Males visit female home ranges at breeding time.
                  - superscript [ref=f17e447]:
                    - link "[32]" [ref=f17e448] [cursor=pointer]:
                      - /url: ./Okapi#cite_note-kingdon-32
                      - generic [ref=f17e449]: "[32]"
                  - text: Although generally tranquil, the okapi can kick and butt with its head to show aggression. As the
                  - link "vocal cords" [ref=f17e450] [cursor=pointer]:
                    - /url: ./Vocal_cord
                  - text: are poorly developed, vocal communication is mainly restricted to three sounds — "chuff" (contact calls used by both sexes), "moan" (by females during courtship) and "bleat" (by infants under stress). Individuals may engage in
                  - link "Flehmen response" [ref=f17e451] [cursor=pointer]:
                    - /url: ./Flehmen_response
                  - text: ", a visual expression in which the animal curls back its upper lips, displays the teeth, and inhales through the mouth for a few seconds. The"
                  - link "leopard" [ref=f17e452] [cursor=pointer]:
                    - /url: ./Leopard
                  - text: is the main natural predator of the okapi.
                  - superscript [ref=f17e453]:
                    - link "[28]" [ref=f17e454] [cursor=pointer]:
                      - /url: ./Okapi#cite_note-bodmer-28
                      - generic [ref=f17e455]: "[28]"
                - generic [ref=f17e456]:
                  - heading "Diet" [level=3] [ref=f17e457]
                  - figure "The long tongue of the okapi" [ref=f17e458]:
                    - link [ref=f17e459] [cursor=pointer]:
                      - /url: ./File:Okapi_tongue.jpg
                      - img [ref=f17e460]
                    - generic [ref=f17e461]: The long tongue of the okapi
                  - paragraph [ref=f17e462]:
                    - text: Okapis are
                    - link "herbivores" [ref=f17e463] [cursor=pointer]:
                      - /url: ./Herbivore
                    - text: ", feeding on tree leaves and buds,"
                    - link "branches" [ref=f17e464] [cursor=pointer]:
                      - /url: ./Branch
                    - text: ","
                    - link "grasses" [ref=f17e465] [cursor=pointer]:
                      - /url: ./Poaceae
                    - text: ","
                    - link "ferns" [ref=f17e466] [cursor=pointer]:
                      - /url: ./Fern
                    - text: ", fruits, and"
                    - link "fungi" [ref=f17e467] [cursor=pointer]:
                      - /url: ./Fungus
                    - text: .
                    - superscript [ref=f17e468]:
                      - link "[36]" [ref=f17e469] [cursor=pointer]:
                        - /url: ./Okapi#cite_note-36
                        - generic [ref=f17e470]: "[36]"
                    - text: They are unique in the Ituri Forest as they are the only known mammal that feeds solely on understory vegetation, where they use their 18-inch-long (46 cm) tongues to selectively browse for suitable plants. The tongue is also used to groom their ears and eyes.
                    - superscript [ref=f17e471]:
                      - link "[37]" [ref=f17e472] [cursor=pointer]:
                        - /url: ./Okapi#cite_note-37
                        - generic [ref=f17e473]: "[37]"
                    - text: They prefer to feed in
                    - link "treefall gaps" [ref=f17e474] [cursor=pointer]:
                      - /url: ./Treefall_gap
                    - text: . The okapi has been known to feed on over 100 species of plants, some of which are known to be poisonous to humans and other animals. Fecal analysis shows that none of those 100 species dominates the diet of the okapi. Staple foods comprise
                    - link "shrubs" [ref=f17e475] [cursor=pointer]:
                      - /url: ./Shrub
                    - text: and
                    - link "lianas" [ref=f17e476] [cursor=pointer]:
                      - /url: ./Liana
                    - text: . The main constituents of the diet are woody,
                    - link "dicotyledonous" [ref=f17e477] [cursor=pointer]:
                      - /url: ./Dicot
                    - text: species;
                    - link "monocotyledonous" [ref=f17e478] [cursor=pointer]:
                      - /url: ./Monocot
                    - text: plants are not eaten regularly. In the Ituri forest, the okapi feeds mainly upon the plant families
                    - link "Acanthaceae" [ref=f17e479] [cursor=pointer]:
                      - /url: ./Acanthaceae
                    - text: ","
                    - link "Ebenaceae" [ref=f17e480] [cursor=pointer]:
                      - /url: ./Ebenaceae
                    - text: ","
                    - link "Euphorbiaceae" [ref=f17e481] [cursor=pointer]:
                      - /url: ./Euphorbiaceae
                    - text: ","
                    - link "Flacourtiaceae" [ref=f17e482] [cursor=pointer]:
                      - /url: ./Flacourtiaceae
                    - text: ","
                    - link "Loganiaceae" [ref=f17e483] [cursor=pointer]:
                      - /url: ./Loganiaceae
                    - text: ","
                    - link "Rubiaceae" [ref=f17e484] [cursor=pointer]:
                      - /url: ./Rubiaceae
                    - text: ", and"
                    - link "Violaceae" [ref=f17e485] [cursor=pointer]:
                      - /url: ./Violaceae
                    - text: .
                    - superscript [ref=f17e486]:
                      - link "[28]" [ref=f17e487] [cursor=pointer]:
                        - /url: ./Okapi#cite_note-bodmer-28
                        - generic [ref=f17e488]: "[28]"
                    - superscript [ref=f17e489]:
                      - link "[35]" [ref=f17e490] [cursor=pointer]:
                        - /url: ./Okapi#cite_note-hart-35
                        - generic [ref=f17e491]: "[35]"
                - generic [ref=f17e492]:
                  - heading "Reproduction" [level=3] [ref=f17e493]
                  - figure "A female okapi with her calf at White Oak Conservation" [ref=f17e494]:
                    - link [ref=f17e495] [cursor=pointer]:
                      - /url: ./File:Okapi_and_calf_at_White_Oak.jpg
                      - img [ref=f17e496]
                    - generic [ref=f17e497]: A female okapi with her calf at White Oak Conservation
                  - paragraph [ref=f17e498]:
                    - text: Female okapis become
                    - link "sexually mature" [ref=f17e499] [cursor=pointer]:
                      - /url: ./Sexual_maturity
                    - text: at about one-and-a-half years old, while males reach maturity after two years.
                    - link "Rut" [ref=f17e500] [cursor=pointer]:
                      - /url: ./Rut_(mammalian_reproduction)
                    - text: in males and
                    - link "estrus" [ref=f17e501] [cursor=pointer]:
                      - /url: ./Estrus
                    - text: in females does not depend on the season. In captivity, estrous cycles recur every 15 days.
                    - superscript [ref=f17e502]:
                      - link "[32]" [ref=f17e503] [cursor=pointer]:
                        - /url: ./Okapi#cite_note-kingdon-32
                        - generic [ref=f17e504]: "[32]"
                    - superscript [ref=f17e505]:
                      - link "[38]" [ref=f17e506] [cursor=pointer]:
                        - /url: ./Okapi#cite_note-reproduction-38
                        - generic [ref=f17e507]: "[38]"
                    - text: The male and the female begin
                    - link "courtship" [ref=f17e508] [cursor=pointer]:
                      - /url: ./Courtship_display
                    - text: by circling, smelling, and licking each other. The male shows his interest by extending his neck, tossing his head, and protruding one leg forward. This is followed by mounting and
                    - link "copulation" [ref=f17e509] [cursor=pointer]:
                      - /url: ./Copulation_(zoology)
                    - text: .
                    - superscript [ref=f17e510]:
                      - link "[30]" [ref=f17e511] [cursor=pointer]:
                        - /url: ./Okapi#cite_note-grzimek-30
                        - generic [ref=f17e512]: "[30]"
                  - paragraph [ref=f17e513]:
                    - text: The
                    - link "gestational period" [ref=f17e514] [cursor=pointer]:
                      - /url: ./Gestational_period
                    - text: is around 440 to 450 days long, following which usually a single calf is born, weighing 14–30 kg (31–66 lb). The
                    - link "udder" [ref=f17e515] [cursor=pointer]:
                      - /url: ./Udder
                    - text: of the pregnant female starts swelling 2 months before
                    - link "parturition" [ref=f17e516] [cursor=pointer]:
                      - /url: ./Parturition
                    - text: ", and"
                    - link "vulval" [ref=f17e517] [cursor=pointer]:
                      - /url: ./Vulva
                    - text: discharges may occur. Parturition takes 3–4 hours, and the female stands throughout this period, though she may rest during brief intervals. The mother consumes the afterbirth and extensively grooms the infant. Her milk is very rich in proteins and low in fat.
                    - superscript [ref=f17e518]:
                      - link "[32]" [ref=f17e519] [cursor=pointer]:
                        - /url: ./Okapi#cite_note-kingdon-32
                        - generic [ref=f17e520]: "[32]"
                  - paragraph [ref=f17e521]:
                    - text: As in other ruminants, the infant can stand within 30 minutes of birth. Although generally similar to adults, newborn calves have long hairs around the eye (resembling false eyelashes), a long dorsal
                    - link "mane" [ref=f17e522] [cursor=pointer]:
                      - /url: ./Mane_(horse)
                    - text: ", and long white hairs in the stripes."
                    - superscript [ref=f17e523]:
                      - link "[39]" [ref=f17e524] [cursor=pointer]:
                        - /url: ./Okapi#cite_note-39
                        - generic [ref=f17e525]: "[39]"
                    - text: These features gradually disappear and give way to the general appearance within a year. The juveniles are kept in hiding, and nursing takes place infrequently. Calves are known not to defecate for the first month or two of life, which is hypothesized to help avoid predator detection in their most vulnerable phase of life.
                    - superscript [ref=f17e526]:
                      - link "[40]" [ref=f17e527] [cursor=pointer]:
                        - /url: ./Okapi#cite_note-40
                        - generic [ref=f17e528]: "[40]"
                    - text: The growth rate of calves is appreciably high in the first few months of life, after which it gradually declines. Juveniles start taking solid food from 3 months, and weaning takes place at 6 months. Ossicone development in males takes 1 year after birth. The okapi's typical lifespan is 20–30 years.
                    - superscript [ref=f17e529]:
                      - link "[28]" [ref=f17e530] [cursor=pointer]:
                        - /url: ./Okapi#cite_note-bodmer-28
                        - generic [ref=f17e531]: "[28]"
              - generic [ref=f17e532]:
                - heading "Distribution and habitat" [level=2] [ref=f17e533]
                - paragraph [ref=f17e534]:
                  - text: The okapi is
                  - link "endemic" [ref=f17e535] [cursor=pointer]:
                    - /url: ./Endemic
                  - text: to the Democratic Republic of the Congo, where it occurs north and east of the
                  - link "Congo River" [ref=f17e536] [cursor=pointer]:
                    - /url: ./Congo_River
                  - text: . It ranges from the
                  - link "Maiko National Park" [ref=f17e537] [cursor=pointer]:
                    - /url: ./Maiko_National_Park
                  - text: northward to the
                  - link "Ituri rainforest" [ref=f17e538] [cursor=pointer]:
                    - /url: ./Ituri_rainforest
                  - text: ", then through the river basins of the Rubi,"
                  - link "Lake Tele" [ref=f17e539] [cursor=pointer]:
                    - /url: ./Lake_Tele
                  - text: ", and"
                  - link "Ebola" [ref=f17e540] [cursor=pointer]:
                    - /url: ./Ebola_River
                  - text: to the west and the
                  - link "Ubangi River" [ref=f17e541] [cursor=pointer]:
                    - /url: ./Ubangi_River
                  - text: further north. Smaller populations exist west and south of the Congo River. It is also common in the
                  - link "Wamba" [ref=f17e542] [cursor=pointer]:
                    - /url: ./Wamba,_Luo_Reserve
                  - text: and Epulu areas. It is extinct in
                  - link "Uganda" [ref=f17e543] [cursor=pointer]:
                    - /url: ./Uganda
                  - text: .
                  - superscript [ref=f17e544]:
                    - link "[1]" [ref=f17e545] [cursor=pointer]:
                      - /url: ./Okapi#cite_note-iucn_status_19_November_2021-1
                      - generic [ref=f17e546]: "[1]"
                - paragraph [ref=f17e547]:
                  - text: The okapi inhabits
                  - link "canopy" [ref=f17e548] [cursor=pointer]:
                    - /url: ./Canopy_(biology)
                  - text: forests at elevations of 500–1,500 m (1,600–4,900 ft). It occasionally uses seasonally inundated areas, but does not occur in
                  - link "gallery forests" [ref=f17e549] [cursor=pointer]:
                    - /url: ./Gallery_forest
                  - text: ","
                  - link "swamp forests" [ref=f17e550] [cursor=pointer]:
                    - /url: ./Swamp_forest
                  - text: ", and habitats disturbed by"
                  - link "human settlements" [ref=f17e551] [cursor=pointer]:
                    - /url: ./Human_settlement
                  - text: . In the wet season, it visits rocky
                  - link "inselbergs" [ref=f17e552] [cursor=pointer]:
                    - /url: ./Inselbergs
                  - text: that offer forage uncommon elsewhere. Results of research conducted in the late 1980s in a mixed
                  - link "Cynometra" [ref=f17e554] [cursor=pointer]:
                    - /url: ./Cynometra
                  - text: forest indicated that the okapi population density averaged 0.53 animals per square kilometre.
                  - superscript [ref=f17e555]:
                    - link "[35]" [ref=f17e556] [cursor=pointer]:
                      - /url: ./Okapi#cite_note-hart-35
                      - generic [ref=f17e557]: "[35]"
                  - text: In 2008, it was recorded in
                  - link "Virunga National Park" [ref=f17e558] [cursor=pointer]:
                    - /url: ./Virunga_National_Park
                  - text: .
                  - superscript [ref=f17e559]:
                    - link "[41]" [ref=f17e560] [cursor=pointer]:
                      - /url: ./Okapi#cite_note-41
                      - generic [ref=f17e561]: "[41]"
                  - text: There is also evidence that okapis were also observed in the
                  - link "Semuliki Valley" [ref=f17e562] [cursor=pointer]:
                    - /url: ./Semuliki_National_Park
                  - text: in
                  - link "Uganda" [ref=f17e563] [cursor=pointer]:
                    - /url: ./Uganda
                  - text: by Europeans, but later became extinct in the late 1970s.
                  - superscript [ref=f17e564]:
                    - link "[42]" [ref=f17e565] [cursor=pointer]:
                      - /url: ./Okapi#cite_note-42
                      - generic [ref=f17e566]: "[42]"
                  - text: The Semuliki Valley provides a similar habitat to the
                  - link "Congo Basin" [ref=f17e567] [cursor=pointer]:
                    - /url: ./Congo_Basin
                  - text: .
              - generic [ref=f17e568]:
                - heading "Status" [level=2] [ref=f17e569]
                - generic [ref=f17e570]:
                  - heading "Threats and conservation" [level=3] [ref=f17e571]
                  - figure "Okapi at Disney's Animal Kingdom" [ref=f17e572]:
                    - link [ref=f17e573] [cursor=pointer]:
                      - /url: ./File:Okapi2.jpg
                      - img [ref=f17e574]
                    - generic [ref=f17e575]:
                      - text: Okapi at
                      - link "Disney's Animal Kingdom" [ref=f17e576] [cursor=pointer]:
                        - /url: ./Disney's_Animal_Kingdom
                  - paragraph [ref=f17e577]:
                    - text: The IUCN classifies the okapi as endangered.
                    - superscript [ref=f17e578]:
                      - link "[43]" [ref=f17e579] [cursor=pointer]:
                        - /url: ./Okapi#cite_note-OCP-43
                        - generic [ref=f17e580]: "[43]"
                    - text: It is fully protected under Congolese law. The
                    - link "Okapi Wildlife Reserve" [ref=f17e581] [cursor=pointer]:
                      - /url: ./Okapi_Wildlife_Reserve
                    - text: and
                    - link "Maiko National Park" [ref=f17e582] [cursor=pointer]:
                      - /url: ./Maiko_National_Park
                    - text: support significant populations of the okapi, though a steady decline in numbers has occurred due to several threats. Other areas of occurrence are the
                    - link "Rubi Tele Hunting Reserve" [ref=f17e583] [cursor=pointer]:
                      - /url: ./Rubi_Tele_Hunting_Reserve
                    - text: ", the Abumombanzi Reserve, the"
                    - link "Sankuru Nature Reserve" [ref=f17e584] [cursor=pointer]:
                      - /url: ./Sankuru_Nature_Reserve
                    - text: ", the"
                    - link "Lomami National Park" [ref=f17e585] [cursor=pointer]:
                      - /url: ./Lomami_National_Park
                    - text: . Major threats include habitat loss due to
                    - link "logging" [ref=f17e586] [cursor=pointer]:
                      - /url: ./Logging
                    - text: and human settlement. Extensive hunting for
                    - link "bushmeat" [ref=f17e587] [cursor=pointer]:
                      - /url: ./Bushmeat
                    - text: and skin and illegal mining have also led to population declines. A threat that has emerged quite recently is the presence of illegal armed groups around protected areas, inhibiting conservation and monitoring actions. A small population occurs north of the
                    - link "Virunga National Park" [ref=f17e588] [cursor=pointer]:
                      - /url: ./Virunga_National_Park
                    - text: ", but lacks protection due to the presence of armed groups in the vicinity."
                    - superscript [ref=f17e589]:
                      - link "[1]" [ref=f17e590] [cursor=pointer]:
                        - /url: ./Okapi#cite_note-iucn_status_19_November_2021-1
                        - generic [ref=f17e591]: "[1]"
                    - text: In June 2012, a gang of poachers attacked the headquarters of the
                    - link "Okapi Wildlife Reserve" [ref=f17e592] [cursor=pointer]:
                      - /url: ./Okapi_Wildlife_Reserve
                    - text: ", killing six guards and other staff"
                    - superscript [ref=f17e593]:
                      - link "[44]" [ref=f17e594] [cursor=pointer]:
                        - /url: ./Okapi#cite_note-44
                        - generic [ref=f17e595]: "[44]"
                    - text: as well as all 14 okapis at their breeding center.
                    - superscript [ref=f17e596]:
                      - link "[45]" [ref=f17e597] [cursor=pointer]:
                        - /url: ./Okapi#cite_note-45
                        - generic [ref=f17e598]: "[45]"
                  - paragraph [ref=f17e599]:
                    - text: The
                    - link "Okapi Conservation Project" [ref=f17e600] [cursor=pointer]:
                      - /url: ./Okapi_Conservation_Project
                    - text: ", established in 1987, works towards the conservation of the okapi, as well as the growth of the indigenous"
                    - link "Mbuti people" [ref=f17e601] [cursor=pointer]:
                      - /url: ./Mbuti_people
                    - text: .
                    - superscript [ref=f17e602]:
                      - link "[1]" [ref=f17e603] [cursor=pointer]:
                        - /url: ./Okapi#cite_note-iucn_status_19_November_2021-1
                        - generic [ref=f17e604]: "[1]"
                    - text: In November 2011, the
                    - link "White Oak Conservation" [ref=f17e605] [cursor=pointer]:
                      - /url: ./White_Oak_Conservation
                    - text: center and
                    - link "Jacksonville Zoo and Gardens" [ref=f17e606] [cursor=pointer]:
                      - /url: ./Jacksonville_Zoo_and_Gardens
                    - text: hosted an international meeting of the Okapi
                    - link "Species Survival Plan" [ref=f17e607] [cursor=pointer]:
                      - /url: ./Species_Survival_Plan
                    - text: and the Okapi
                    - link "European Endangered Species Programme" [ref=f17e608] [cursor=pointer]:
                      - /url: ./European_Endangered_Species_Programme
                    - text: at
                    - link "Jacksonville" [ref=f17e609] [cursor=pointer]:
                      - /url: ./Jacksonville
                    - text: ", which was attended by representatives from zoos from the US, Europe, and Japan. The aim was to discuss the management of captive okapis and arrange support for okapi conservation. Many zoos in North America and Europe currently have okapis in captivity."
                    - superscript [ref=f17e610]:
                      - link "[46]" [ref=f17e611] [cursor=pointer]:
                        - /url: ./Okapi#cite_note-meet-46
                        - generic [ref=f17e612]: "[46]"
                - generic [ref=f17e613]:
                  - heading "Okapis in zoos" [level=3] [ref=f17e614]
                  - figure "1960 Dutch newsreel about okapis in Diergaarde Blijdorp" [ref=f17e615]:
                    - generic [ref=f17e616]:
                      - text: 1960 Dutch newsreel about okapis in
                      - link "Diergaarde Blijdorp" [ref=f17e617] [cursor=pointer]:
                        - /url: ./Diergaarde_Blijdorp
                  - paragraph [ref=f17e618]:
                    - text: Around 100 okapis are in accredited
                    - link "Association of Zoos and Aquariums" [ref=f17e619] [cursor=pointer]:
                      - /url: ./Association_of_Zoos_and_Aquariums
                    - text: (AZA) zoos. The okapi population is managed in America by the AZA's Species Survival Plan, a breeding program that works to ensure genetic diversity in the captive population of endangered animals, while the
                    - link "EEP" [ref=f17e620] [cursor=pointer]:
                      - /url: ./European_Endangered_Species_Programme
                    - text: (European studbook) and ISB (Global studbook) are managed by
                    - link "Antwerp Zoo" [ref=f17e621] [cursor=pointer]:
                      - /url: ./Antwerp_Zoo
                    - text: in Belgium, which was the first zoo to have an Okapi on display (in 1919), as well as one of the most successful in breeding them.
                    - superscript [ref=f17e622]:
                      - link "[47]" [ref=f17e623] [cursor=pointer]:
                        - /url: ./Okapi#cite_note-47
                        - generic [ref=f17e624]: "[47]"
                    - superscript [ref=f17e625]:
                      - link "[48]" [ref=f17e626] [cursor=pointer]:
                        - /url: ./Okapi#cite_note-48
                        - generic [ref=f17e627]: "[48]"
                  - paragraph [ref=f17e628]:
                    - text: In 1937, the
                    - link "Bronx Zoo" [ref=f17e629] [cursor=pointer]:
                      - /url: ./Bronx_Zoo
                    - text: became the first in North America to acquire an okapi.
                    - superscript [ref=f17e630]:
                      - link "[49]" [ref=f17e631] [cursor=pointer]:
                        - /url: ./Okapi#cite_note-49
                        - generic [ref=f17e632]: "[49]"
                    - text: With one of the most successful breeding programs, 13 calves have been born there between 1991 and 2011.
                    - superscript [ref=f17e633]:
                      - link "[50]" [ref=f17e634] [cursor=pointer]:
                        - /url: ./Okapi#cite_note-50
                        - generic [ref=f17e635]: "[50]"
                    - text: The
                    - link "San Diego Zoo" [ref=f17e636] [cursor=pointer]:
                      - /url: ./San_Diego_Zoo
                    - text: has exhibited okapis since 1956, and their first okapi calf was born in 1962.
                    - superscript [ref=f17e637]:
                      - link "[51]" [ref=f17e638] [cursor=pointer]:
                        - /url: ./Okapi#cite_note-SDZ-51
                        - generic [ref=f17e639]: "[51]"
                    - text: Since then, there have been more than 60 okapis born at the zoo and the nearby
                    - link "San Diego Zoo Safari Park" [ref=f17e640] [cursor=pointer]:
                      - /url: ./San_Diego_Zoo_Safari_Park
                    - text: ", the most recent being Mosi, a male calf born on 21 July 2017 at the zoo."
                    - superscript [ref=f17e641]:
                      - link "[52]" [ref=f17e642] [cursor=pointer]:
                        - /url: ./Okapi#cite_note-52
                        - generic [ref=f17e643]: "[52]"
                    - text: The
                    - link "Brookfield Zoo" [ref=f17e644] [cursor=pointer]:
                      - /url: ./Brookfield_Zoo
                    - text: in
                    - link "Chicago" [ref=f17e645] [cursor=pointer]:
                      - /url: ./Chicago
                    - text: has also greatly contributed to the captive population of okapis in accredited zoos. The zoo has had 28 okapi births since 1959.
                    - superscript [ref=f17e646]:
                      - link "[53]" [ref=f17e647] [cursor=pointer]:
                        - /url: ./Okapi#cite_note-53
                        - generic [ref=f17e648]: "[53]"
