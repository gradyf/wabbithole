                - paragraph [ref=e17365]:
                  - text: St. Paraskeva Church (
                  - link "Lithuanian" [ref=e17366] [cursor=pointer]:
                    - /url: ./Lithuanian_language
                  - text: ": Vilniaus Šv. kankinės Paraskevės cerkvė;"
                  - link "Russian" [ref=e17367] [cursor=pointer]:
                    - /url: ./Russian_language
                  - text: ": Пятницкая церковь,"
                  - generic [ref=e17368]:
                    - link "romanized" [ref=e17369] [cursor=pointer]:
                      - /url: ./Romanization_of_Russian
                    - text: ":"
                  - generic "Russian-language romanization" [ref=e17370]: Pyatnitskaya tserkov'
                  - text: ) is the oldest
                  - link "Eastern Orthodox" [ref=e17371] [cursor=pointer]:
                    - /url: ./Eastern_Orthodoxy
                  - text: church in
                  - link "Lithuania" [ref=e17372] [cursor=pointer]:
                    - /url: ./Lithuania
                  - text: ", located in the capital"
                  - link "Vilnius" [ref=e17373] [cursor=pointer]:
                    - /url: ./Vilnius
                  - text: ", belonging to the"
                  - link "Russian Orthodox Diocese of Lithuania" [ref=e17374] [cursor=pointer]:
                    - /url: ./Russian_Orthodox_Diocese_of_Lithuania
                  - text: .
                - paragraph [ref=e17375]:
                  - text: The first Orthodox church of St. Paraskeva was constructed at the request of Grand Duke
                  - link "Algirdas" [ref=e17376] [cursor=pointer]:
                    - /url: ./Algirdas
                  - text: "'s first wife,"
                  - link "Maria Yaroslavna of Vitebsk" [ref=e17377] [cursor=pointer]:
                    - /url: ./Maria_of_Vitebsk
                  - text: ", who was subsequently buried there in 1346. According to tradition, the church was built on the site of a temple to the pagan god, Ragutis"
                  - superscript [ref=e17378]:
                    - text: "["
                    - link "citation needed" [ref=e17380] [cursor=pointer]:
                      - /url: ./Wikipedia:Citation_needed
                    - text: "]"
                  - text: . This church was completely destroyed by fire in 1557 and rebuilt three years later, but burned down again in 1611. Although ruined, it was given to the local
                  - link "Eastern Catholics" [ref=e17381] [cursor=pointer]:
                    - /url: ./Union_of_Brest
                  - text: . In 1655, it was given back to the Orthodox Church by the occupying Muscovite troops and renovated.
                - paragraph [ref=e17382]:
                  - text: During the
                  - link "Great Northern War" [ref=e17383] [cursor=pointer]:
                    - /url: ./Great_Northern_War
                  - text: ", in 1705, with Vilnius invaded and pillaged by the Muscovite army, the church was visited by the Russian tsar"
                  - link "Peter I of Russia" [ref=e17384] [cursor=pointer]:
                    - /url: ./Peter_I_of_Russia
                  - text: ", who prayed there for the military victory. During the same service,"
                  - link "Abram Petrovich Gannibal" [ref=e17385] [cursor=pointer]:
                    - /url: ./Abram_Petrovich_Gannibal
                  - text: was baptised, with the tsar serving as the
                  - link "godfather" [ref=e17386] [cursor=pointer]:
                    - /url: ./Godparent
                  - text: . Three years later, the victorious tsar decided to grant some of the conquered Swedish flags to St. Paraskeva's church.
                - list [ref=e17387]:
                  - listitem [ref=e17388]: Before 1870
                  - listitem [ref=e17389]:
                    - link "1807" [ref=e17392] [cursor=pointer]:
                      - /url: ./File:Vilnia,_Vialikaja,_Piatnickaja._Вільня,_Вялікая,_Пятніцкая_(I._Trutnev,_1807).jpg
                      - img "1807" [ref=e17393]
