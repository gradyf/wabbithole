                      - img "1864" [ref=e17411]
                    - generic [ref=e17412]: "1864"
                - figure "Church in 1870. Painting by Ivan Trutnev." [ref=e17413]:
                  - link [ref=e17414] [cursor=pointer]:
                    - /url: ./File:Vilnia,_Vialikaja,_Piatnickaja._Вільня,_Вялікая,_Пятніцкая_(I._Trutnev,_1870).jpg
                    - img [ref=e17415]
                  - generic [ref=e17416]:
                    - text: Church in 1870. Painting by
                    - link "Ivan Trutnev" [ref=e17417] [cursor=pointer]:
                      - /url: ./Ivan_Trutnev
                    - text: .
                - paragraph [ref=e17418]:
                  - text: In 1748, the building was again destroyed by fire and rebuilt in 1795. However, it stood closed during the following forty years, slowly falling into decline. In 1864, on the orders of the Russian local government, it was rebuilt and enlarged in
                  - link "Neo-Byzantine style" [ref=e17419] [cursor=pointer]:
                    - /url: ./Neo-Byzantine_style
                  - text: by
                  - link "Nikolay Chagin" [ref=e17420] [cursor=pointer]:
                    - /url: ./Nikolay_Chagin
                  - text: .
                - paragraph [ref=e17421]:
                  - text: The church was devastated during the World War II. Although it was renovated again, the Stalinist government didn't allow the
                  - link "Russian Orthodox Church" [ref=e17422] [cursor=pointer]:
                    - /url: ./Russian_Orthodox_Church
                  - text: to start holding its services there. At first, a Museum of Atheism was to be opened there, but in the end the church was turned into a gallery of Lithuanian folk art. The church was given back to the Orthodox Church only in 1990 and reconsecrated by Metropolitan Chrysostom the following year. Since then it has been an auxiliary church of the
                  - link "Cathedral of the Theotokos" [ref=e17423] [cursor=pointer]:
                    - /url: ./Cathedral_of_the_Theotokos,_Vilnius
                  - text: .
