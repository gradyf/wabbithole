                - paragraph [ref=f26e1538]:
                  - text: Giraffes (genus
                  - generic [ref=f26e1539]: Giraffa
                  - text: ) are large African
                  - link "hoofed mammals" [ref=f26e1540] [cursor=pointer]:
                    - /url: ./Even-toed_ungulate
                  - text: . They are the
                  - link "tallest" [ref=f26e1541] [cursor=pointer]:
                    - /url: ./Largest_mammals#Even-toed_Ungulates_(Artiodactyla)
                  - text: living
                  - link "terrestrial animals" [ref=f26e1542] [cursor=pointer]:
                    - /url: ./Terrestrial_animal
                  - text: and the largest
                  - link "ruminants" [ref=f26e1543] [cursor=pointer]:
                    - /url: ./Ruminant
                  - text: "on"
                  - link "Earth" [ref=f26e1544] [cursor=pointer]:
                    - /url: ./Earth
                  - text: . They are classified under the
                  - link "family" [ref=f26e1545] [cursor=pointer]:
                    - /url: ./Family_(taxonomy)
                  - link "Giraffidae" [ref=f26e1546] [cursor=pointer]:
                    - /url: ./Giraffidae
                  - text: ", along with their closest extant relative, the"
                  - link "okapi" [ref=f26e1547] [cursor=pointer]:
                    - /url: ./Okapi
                  - text: . Traditionally, giraffes have been thought of as one
                  - link "species" [ref=f26e1548] [cursor=pointer]:
                    - /url: ./Species
                  - text: ","
                  - link "Giraffa camelopardalis" [ref=f26e1550] [cursor=pointer]:
                    - /url: ./Giraffa_camelopardalis
                  - text: ", with nine"
                  - link "subspecies" [ref=f26e1551] [cursor=pointer]:
                    - /url: ./Subspecies
                  - text: . Most recently, researchers proposed dividing them into four
                  - link "extant" [ref=f26e1552] [cursor=pointer]:
                    - /url: ./Neontology#Extant_taxa_versus_extinct_taxa
                  - text: species, with seven subspecies, which can be distinguished morphologically by their fur
                  - link "coat" [ref=f26e1553] [cursor=pointer]:
                    - /url: ./Animal_coat
                  - text: patterns. Six valid
                  - link "extinct species" [ref=f26e1554] [cursor=pointer]:
                    - /url: ./Lists_of_extinct_species
                  - text: of Giraffa are known from the
                  - link "fossil" [ref=f26e1555] [cursor=pointer]:
                    - /url: ./Fossil
                  - text: record.
                - paragraph [ref=f26e1556]:
                  - text: The distinguishing characteristics of giraffes are their extremely long neck and legs, horn-like
                  - link "ossicones" [ref=f26e1557] [cursor=pointer]:
                    - /url: ./Ossicone
                  - text: ", and spotted coat patterns. Their scattered range extends from"
                  - link "Chad" [ref=f26e1558] [cursor=pointer]:
                    - /url: ./Chad
                  - text: in the north to
                  - link "South Africa" [ref=f26e1559] [cursor=pointer]:
                    - /url: ./South_Africa
                  - text: in the south and from
                  - link "Niger" [ref=f26e1560] [cursor=pointer]:
                    - /url: ./Niger
                  - text: in the west to
                  - link "Somalia" [ref=f26e1561] [cursor=pointer]:
                    - /url: ./Somalia
                  - text: in the east. Giraffes usually inhabit
                  - link "savannahs" [ref=f26e1562] [cursor=pointer]:
                    - /url: ./Savannah
                  - text: and
                  - link "woodlands" [ref=f26e1563] [cursor=pointer]:
                    - /url: ./Woodland
                  - text: . Their food source is leaves, fruits, and flowers of woody plants, primarily
                  - link "acacia" [ref=f26e1564] [cursor=pointer]:
                    - /url: ./Acacieae
                  - text: species, which they browse at heights most other ground-based
                  - link "herbivores" [ref=f26e1565] [cursor=pointer]:
                    - /url: ./Herbivore
                  - text: cannot reach.
                  - link "Lions" [ref=f26e1566] [cursor=pointer]:
                    - /url: ./Lion
                  - text: ","
                  - link "leopards" [ref=f26e1567] [cursor=pointer]:
                    - /url: ./Leopard
                  - text: ","
                  - link "spotted hyenas" [ref=f26e1568] [cursor=pointer]:
                    - /url: ./Spotted_hyena
                  - text: ", and"
                  - link "African wild dogs" [ref=f26e1569] [cursor=pointer]:
                    - /url: ./African_wild_dog
                  - text: may
                  - link "prey" [ref=f26e1570] [cursor=pointer]:
                    - /url: ./Prey
                  - text: upon giraffes. Giraffes live in herds of related females and their offspring or bachelor herds of unrelated adult males but are
                  - link "gregarious" [ref=f26e1571] [cursor=pointer]:
                    - /url: ./Gregarious
                  - text: and may gather in large groups. Males establish social hierarchies through "necking", combat bouts in which they use the neck as a weapon.
                  - link "Dominant" [ref=f26e1572] [cursor=pointer]:
                    - /url: ./Dominance_(ethology)
                  - text: males gain mating access to females, which bear sole responsibility for rearing the young.
                - paragraph [ref=f26e1573]:
                  - text: Giraffes have intrigued various ancient and modern cultures for their peculiar appearance and have often been featured in paintings, books, and cartoons. They have been
                  - link "extirpated" [ref=f26e1574] [cursor=pointer]:
                    - /url: ./Local_extinction
                  - text: from many parts of their former range. Giraffes are still found in many
                  - link "national parks" [ref=f26e1575] [cursor=pointer]:
                    - /url: ./National_park
                  - text: and
                  - link "game reserves" [ref=f26e1576] [cursor=pointer]:
                    - /url: ./Game_reserve
                  - text: ", and estimates as of 2016 indicate there are approximately 97,500 members of Giraffa in the wild. More than 1,600 were kept in zoos in 2010."
              - generic [ref=f26e1577]:
                - heading "Etymology" [level=2] [ref=f26e1578]
                - paragraph [ref=f26e1579]:
                  - text: The name "giraffe" has its earliest known origins in the
                  - link "Arabic" [ref=f26e1580] [cursor=pointer]:
