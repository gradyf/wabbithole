                  - generic "Arabic-language romanization" [ref=f26e1581]: zirāfah
                  - text: (
                  - generic "Arabic-language text" [ref=f26e1582]: زِرَافَةْ
                  - text: ), of an ultimately unclear
                  - link "Sub-Saharan African language" [ref=f26e1583] [cursor=pointer]:
                    - /url: ./Languages_of_Africa
                  - text: origin.
                  - superscript [ref=f26e1584]:
                    - link "[2]" [ref=f26e1585] [cursor=pointer]:
                      - /url: ./Giraffe#cite_note-OED-2
                      - generic [ref=f26e1586]: "[2]"
