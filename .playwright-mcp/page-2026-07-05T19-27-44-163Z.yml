                      - row [ref=f26e1749]:
                        - cell [ref=f26e1750]
                  - paragraph [ref=f26e1751]:
                    - text: The family Giraffidae was once much more extensive, with over 10 fossil
                    - link "genera" [ref=f26e1752] [cursor=pointer]:
                      - /url: ./Genus
                    - text: described.
                    - superscript [ref=f26e1753]:
                      - link "[6]" [ref=f26e1754] [cursor=pointer]:
                        - /url: ./Giraffe#cite_note-Mitchell20003-6
                        - generic [ref=f26e1755]: "[6]"
                    - text: The elongation of the neck appears to have started early in the giraffe
                    - link "lineage" [ref=f26e1756] [cursor=pointer]:
                      - /url: ./Lineage_(evolution)
                    - text: . Comparisons between giraffes and their ancient relatives suggest vertebrae close to the skull lengthened earlier, followed by lengthening of vertebrae further down.
                    - superscript [ref=f26e1757]:
                      - link "[8]" [ref=f26e1758] [cursor=pointer]:
                        - /url: ./Giraffe#cite_note-Danowitz2015-8
                        - generic [ref=f26e1759]: "[8]"
                    - text: One early giraffid ancestor was
                    - link "Canthumeryx" [ref=f26e1761] [cursor=pointer]:
                      - /url: ./Canthumeryx
                    - text: ", which has been dated variously to have lived"
                    - generic [ref=f26e1762]:
                      - link "25 to 20 ↗" [ref=f26e1763] [cursor=pointer]:
                        - /url: https://geoltime.github.io/?Ma=25–20
                      - text: million years ago
                    - text: ", 17–15 mya or 18–14.3 mya and whose deposits have been found in Libya. This animal resembled an"
                    - link "antelope" [ref=f26e1764] [cursor=pointer]:
                      - /url: ./Antelope
                    - text: and had a medium-sized, lightly built body.
                    - link "Giraffokeryx" [ref=f26e1766] [cursor=pointer]:
                      - /url: ./Giraffokeryx
                    - text: appeared 15–12 mya on the
                    - link "Indian subcontinent" [ref=f26e1767] [cursor=pointer]:
                      - /url: ./Indian_subcontinent
                    - text: and resembled an okapi or a small giraffe, and had a longer neck and similar
                    - link "ossicones" [ref=f26e1768] [cursor=pointer]:
                      - /url: ./Ossicone
                    - text: .
                    - superscript [ref=f26e1769]:
                      - link "[6]" [ref=f26e1770] [cursor=pointer]:
                        - /url: ./Giraffe#cite_note-Mitchell20003-6
                        - generic [ref=f26e1771]: "[6]"
                    - text: Giraffokeryx may have shared a clade with more massively built giraffids like
                    - link "Sivatherium" [ref=f26e1773] [cursor=pointer]:
                      - /url: ./Sivatherium
                    - text: and
                    - link "Bramatherium" [ref=f26e1775] [cursor=pointer]:
                      - /url: ./Bramatherium
                    - text: .
                    - superscript [ref=f26e1776]:
                      - link "[8]" [ref=f26e1777] [cursor=pointer]:
                        - /url: ./Giraffe#cite_note-Danowitz2015-8
                        - generic [ref=f26e1778]: "[8]"
                  - figure "The extinct giraffid Samotherium (middle) in comparison with the okapi (below) and giraffe. The anatomy of Samotherium appears to have shown a transition to a giraffe-like neck.[9]" [ref=f26e1779]:
                    - link [ref=f26e1780] [cursor=pointer]:
                      - /url: ./File:Giraffidcomparison.jpg
                      - img [ref=f26e1781]
                    - generic [ref=f26e1782]:
                      - text: The extinct giraffid
                      - link "Samotherium" [ref=f26e1784] [cursor=pointer]:
                        - /url: ./Samotherium
                      - text: (middle) in comparison with the
                      - link "okapi" [ref=f26e1785] [cursor=pointer]:
                        - /url: ./Okapi
                      - text: (below) and giraffe. The anatomy of Samotherium appears to have shown a transition to a giraffe-like neck.
                      - superscript [ref=f26e1786]:
                        - link "[9]" [ref=f26e1787] [cursor=pointer]:
                          - /url: ./Giraffe#cite_note-Danowitz-9
                          - generic [ref=f26e1788]: "[9]"
                  - paragraph [ref=f26e1789]:
                    - text: Giraffids like
                    - link "Palaeotragus" [ref=f26e1791] [cursor=pointer]:
                      - /url: ./Palaeotragus
                    - text: ","
                    - link "Shansitherium" [ref=f26e1793] [cursor=pointer]:
                      - /url: ./Shansitherium
                    - text: and
                    - link "Samotherium" [ref=f26e1795] [cursor=pointer]:
                      - /url: ./Samotherium
                    - text: appeared 14 mya and lived throughout Africa and Eurasia. These animals had broader skulls with reduced frontal cavities.
                    - superscript [ref=f26e1796]:
                      - link "[6]" [ref=f26e1797] [cursor=pointer]:
                        - /url: ./Giraffe#cite_note-Mitchell20003-6
                        - generic [ref=f26e1798]: "[6]"
                    - superscript [ref=f26e1799]:
                      - link "[8]" [ref=f26e1800] [cursor=pointer]:
                        - /url: ./Giraffe#cite_note-Danowitz2015-8
                        - generic [ref=f26e1801]: "[8]"
                    - text: Paleotragus resembled the okapi and may have been its ancestor.
                    - superscript [ref=f26e1802]:
                      - link "[6]" [ref=f26e1803] [cursor=pointer]:
                        - /url: ./Giraffe#cite_note-Mitchell20003-6
                        - generic [ref=f26e1804]: "[6]"
                    - text: Others find that the okapi lineage diverged earlier, before Giraffokeryx.
                    - superscript [ref=f26e1805]:
                      - link "[8]" [ref=f26e1806] [cursor=pointer]:
                        - /url: ./Giraffe#cite_note-Danowitz2015-8
                        - generic [ref=f26e1807]: "[8]"
                    - text: Samotherium was a particularly important
                    - link "transitional fossil" [ref=f26e1808] [cursor=pointer]:
                      - /url: ./Transitional_fossil
                    - text: in the giraffe lineage, as the length and structure of its
                    - link "cervical vertebrae" [ref=f26e1809] [cursor=pointer]:
                      - /url: ./Cervical_vertebrae
                    - text: were between those of a modern giraffe and an okapi, and its neck posture was likely similar to the former's.
                    - superscript [ref=f26e1810]:
                      - link "[9]" [ref=f26e1811] [cursor=pointer]:
                        - /url: ./Giraffe#cite_note-Danowitz-9
                        - generic [ref=f26e1812]: "[9]"
                    - link "Bohlinia" [ref=f26e1814] [cursor=pointer]:
                      - /url: ./Bohlinia
                    - text: ", which first appeared in southeastern Europe and lived 9–7 mya, was likely a direct ancestor of Giraffa. Bohlinia closely resembled modern giraffes, having a long neck and legs and similar ossicones and dentition."
                    - superscript [ref=f26e1815]:
                      - link "[6]" [ref=f26e1816] [cursor=pointer]:
                        - /url: ./Giraffe#cite_note-Mitchell20003-6
                        - generic [ref=f26e1817]: "[6]"
                  - paragraph [ref=f26e1818]:
                    - text: Bohlinia colonised China and northern India and produced the Giraffa, which, around
                    - generic [ref=f26e1819]:
                      - link "7 ↗" [ref=f26e1820] [cursor=pointer]:
                        - /url: https://geoltime.github.io/?Ma=7
                      - text: million years ago
                    - text: ", reached Africa."
                    - link "Climate changes" [ref=f26e1821] [cursor=pointer]:
                      - /url: ./Climate_change
                    - text: led to the extinction of the Asian giraffes, while the African giraffes survived and radiated into new species. Living giraffes appear to have arisen around
                    - generic [ref=f26e1822]:
                      - link "1 ↗" [ref=f26e1823] [cursor=pointer]:
                        - /url: https://geoltime.github.io/?Ma=1
                      - text: million years ago
                    - text: in eastern Africa during the
                    - link "Pleistocene" [ref=f26e1824] [cursor=pointer]:
                      - /url: ./Pleistocene
                    - text: .
                    - superscript [ref=f26e1825]:
                      - link "[6]" [ref=f26e1826] [cursor=pointer]:
                        - /url: ./Giraffe#cite_note-Mitchell20003-6
                        - generic [ref=f26e1827]: "[6]"
                    - text: Some biologists suggest the modern giraffes descended from
                    - link "G. jumae" [ref=f26e1829] [cursor=pointer]:
                      - /url: ./Giraffa_jumae
                    - text: ;
                    - superscript [ref=f26e1830]:
                      - link "[10]" [ref=f26e1831] [cursor=pointer]:
                        - /url: ./Giraffe#cite_note-sim1996-10
                        - generic [ref=f26e1832]: "[10]"
                    - text: others find
                    - link "G. gracilis" [ref=f26e1834]:
                      - /url: ./Giraffa_gracilis?action=edit&redlink=1
                    - text: a more likely candidate. G. jumae was larger and more robust, while G. gracilis was smaller and more slender.
                    - superscript [ref=f26e1835]:
                      - link "[6]" [ref=f26e1836] [cursor=pointer]:
                        - /url: ./Giraffe#cite_note-Mitchell20003-6
                        - generic [ref=f26e1837]: "[6]"
                  - paragraph [ref=f26e1838]:
                    - text: The changes from extensive forests to more open
                    - link "habitats" [ref=f26e1839] [cursor=pointer]:
                      - /url: ./Habitat
                    - text: ", which began 8 mya, are believed to be the main driver for the evolution of giraffes."
                    - superscript [ref=f26e1840]:
                      - link "[6]" [ref=f26e1841] [cursor=pointer]:
                        - /url: ./Giraffe#cite_note-Mitchell20003-6
                        - generic [ref=f26e1842]: "[6]"
                    - text: During this time, tropical plants disappeared and were replaced by arid
                    - link "C4 plants" [ref=f26e1843] [cursor=pointer]:
                      - /url: ./C4_plant
                    - text: ", and a dry"
                    - link "savannah" [ref=f26e1844] [cursor=pointer]:
                      - /url: ./Savannah
                    - text: emerged across eastern and northern Africa and western India.
                    - superscript [ref=f26e1845]:
                      - link "[11]" [ref=f26e1846] [cursor=pointer]:
                        - /url: ./Giraffe#cite_note-11
                        - generic [ref=f26e1847]: "[11]"
                    - superscript [ref=f26e1848]:
                      - link "[12]" [ref=f26e1849] [cursor=pointer]:
                        - /url: ./Giraffe#cite_note-12
                        - generic [ref=f26e1850]: "[12]"
                    - text: Some researchers have hypothesised that this new habitat, coupled with a different diet, including acacia species, may have exposed giraffe ancestors to toxins that caused higher mutation rates and a higher rate of evolution.
                    - superscript [ref=f26e1851]:
                      - link "[13]" [ref=f26e1852] [cursor=pointer]:
                        - /url: ./Giraffe#cite_note-bada-13
                        - generic [ref=f26e1853]: "[13]"
                    - text: The coat patterns of modern giraffes may also have coincided with these habitat changes. Asian giraffes are hypothesised to have had more okapi-like colourations.
                    - superscript [ref=f26e1854]:
                      - link "[6]" [ref=f26e1855] [cursor=pointer]:
                        - /url: ./Giraffe#cite_note-Mitchell20003-6
                        - generic [ref=f26e1856]: "[6]"
                  - paragraph [ref=f26e1857]:
                    - text: The Masai giraffe genome is around 2.9 billion
                    - link "base pairs" [ref=f26e1858] [cursor=pointer]:
                      - /url: ./Base_pair
                    - text: in length, compared to the 3.3 billion base pairs of the okapi. Of the proteins in giraffe and okapi genes, 19.4% are identical. The
                    - link "divergence" [ref=f26e1859] [cursor=pointer]:
                      - /url: ./Divergent_evolution
                    - text: of giraffe and okapi lineages dates to around 11.5 mya. A small group of
                    - link "regulatory genes" [ref=f26e1860] [cursor=pointer]:
                      - /url: ./Regulatory_gene
                    - text: in the giraffe appears responsible for the animal's height and associated circulatory adaptations.
                    - superscript [ref=f26e1861]:
                      - link "[14]" [ref=f26e1862] [cursor=pointer]:
                        - /url: ./Giraffe#cite_note-Holmes-14
                        - generic [ref=f26e1863]: "[14]"
                    - superscript [ref=f26e1864]:
                      - link "[15]" [ref=f26e1865] [cursor=pointer]:
                        - /url: ./Giraffe#cite_note-Genome-15
                        - generic [ref=f26e1866]: "[15]"
                - generic [ref=f26e1867]:
                  - heading "Species and subspecies" [level=3] [ref=f26e1868]
                  - figure "Map showing \"Approximate geographic ranges, fur patterns, and phylogenetic relationships between some giraffe subspecies based on mitochondrial DNA sequences. Coloured dots on the map represent sampling localities. The phylogenetic tree is a maximum-likelihood phylogram based on samples from 266 giraffes. Asterisks along branches correspond to node values of more than 90% bootstrap support. Stars at branch tips identify paraphyletic haplotypes found in Maasai and reticulated giraffes\".[16]" [ref=f26e1869]:
                    - link "Approximate geographic ranges, fur patterns, and phylogenetic relationships between some giraffe subspecies" [ref=f26e1870] [cursor=pointer]:
                      - /url: ./File:Genetic_subdivision_in_the_giraffe_based_on_mitochondrial_DNA_sequences.png
                      - img "Approximate geographic ranges, fur patterns, and phylogenetic relationships between some giraffe subspecies" [ref=f26e1871]
                    - generic [ref=f26e1872]:
                      - text: Map showing "Approximate geographic ranges, fur patterns, and
                      - link "phylogenetic" [ref=f26e1873] [cursor=pointer]:
                        - /url: ./Phylogenetics
                      - text: relationships between some giraffe subspecies based on
                      - link "mitochondrial DNA" [ref=f26e1874] [cursor=pointer]:
                        - /url: ./Mitochondrial_DNA
                      - text: sequences. Coloured dots on the map represent sampling localities. The phylogenetic tree is a
                      - link "maximum-likelihood" [ref=f26e1875] [cursor=pointer]:
                        - /url: ./Maximum_likelihood_phylogenetic_tree
                      - link "phylogram" [ref=f26e1876] [cursor=pointer]:
                        - /url: ./Phylogenetic_tree#Special_tree_types
                      - text: based on samples from 266 giraffes. Asterisks along branches correspond to
                      - link "node" [ref=f26e1877] [cursor=pointer]:
                        - /url: ./Clade#Definitions
                      - text: values of more than 90%
                      - link "bootstrap" [ref=f26e1878] [cursor=pointer]:
                        - /url: ./Resampling_(statistics)
                      - text: support. Stars at branch tips identify
                      - link "paraphyletic" [ref=f26e1879] [cursor=pointer]:
                        - /url: ./Paraphyletic
                      - link "haplotypes" [ref=f26e1880] [cursor=pointer]:
                        - /url: ./Haplotype
                      - text: found in Maasai and reticulated giraffes".
                      - superscript [ref=f26e1881]:
                        - link "[16]" [ref=f26e1882] [cursor=pointer]:
                          - /url: ./Giraffe#cite_note-GeneticStructure-16
                          - generic [ref=f26e1883]: "[16]"
                  - paragraph [ref=f26e1884]:
                    - link "Carl Linnaeus" [ref=f26e1885] [cursor=pointer]:
                      - /url: ./Carl_Linnaeus
                    - text: originally classified living giraffes as one species in 1758. He gave it the
                    - link "binomial" [ref=f26e1886] [cursor=pointer]:
                      - /url: ./Binomial_nomenclature
                    - text: name
                    - generic [ref=f26e1887]:
                      - link "Cervus" [ref=f26e1888] [cursor=pointer]:
                        - /url: ./Cervus
                      - text: camelopardalis
                    - text: .
                    - link "Mathurin Jacques Brisson" [ref=f26e1889] [cursor=pointer]:
                      - /url: ./Mathurin_Jacques_Brisson
                    - text: coined the generic name Giraffa in 1762.
                    - superscript [ref=f26e1890]:
                      - link "[17]" [ref=f26e1891] [cursor=pointer]:
                        - /url: ./Giraffe#cite_note-Dagg1971-17
                        - generic [ref=f26e1892]: "[17]"
                    - text: During the 1900s, various taxonomies with two or three species were proposed.
                    - superscript [ref=f26e1893]:
                      - link "[18]" [ref=f26e1894] [cursor=pointer]:
                        - /url: ./Giraffe#cite_note-18
                        - generic [ref=f26e1895]: "[18]"
                    - text: A 2007 study on the genetics of giraffes using mitochondrial DNA suggested at least six lineages could be recognised as species.
                    - superscript [ref=f26e1896]:
                      - link "[16]" [ref=f26e1897] [cursor=pointer]:
                        - /url: ./Giraffe#cite_note-GeneticStructure-16
                        - generic [ref=f26e1898]: "[16]"
                    - text: A 2011 study using detailed analyses of the morphology of giraffes, and application of the
                    - link "phylogenetic species concept" [ref=f26e1899] [cursor=pointer]:
                      - /url: ./Species
                    - text: ", described eight species of living giraffes."
                    - superscript [ref=f26e1900]:
                      - link "[19]" [ref=f26e1901] [cursor=pointer]:
                        - /url: ./Giraffe#cite_note-:2-19
                        - generic [ref=f26e1902]: "[19]"
                    - text: A 2016 study also concluded that living giraffes consist of multiple species. The researchers suggested the existence of four species, which have not exchanged genetic information between each other for one to two million years.
                    - superscript [ref=f26e1903]:
                      - link "[20]" [ref=f26e1904] [cursor=pointer]:
                        - /url: ./Giraffe#cite_note-cur.biol_2016-20
                        - generic [ref=f26e1905]: "[20]"
                  - paragraph [ref=f26e1906]:
                    - text: A 2020 study showed that, depending on the method chosen, different taxonomic hypotheses recognizing from two to six species can be considered for the genus Giraffa. That study also found that multi-species coalescent methods can lead to taxonomic over-splitting, as those methods delimit geographic structures rather than species. The three-species hypothesis, which recognises G. camelopardalis, G. giraffa, and G. tippelskirchi, is highly supported by
                    - link "phylogenetic" [ref=f26e1907] [cursor=pointer]:
                      - /url: ./Phylogenetics
                    - text: analyses and also corroborated by most population genetic and multi-species coalescent analyses.
                    - superscript [ref=f26e1908]:
                      - link "[21]" [ref=f26e1909] [cursor=pointer]:
                        - /url: ./Giraffe#cite_note-:6-21
                        - generic [ref=f26e1910]: "[21]"
                    - text: A 2021
                    - link "whole genome sequencing" [ref=f26e1911] [cursor=pointer]:
                      - /url: ./Whole_genome_sequencing
                    - text: study suggests the existence of four distinct species and seven subspecies,
                    - superscript [ref=f26e1912]:
                      - link "[22]" [ref=f26e1913] [cursor=pointer]:
                        - /url: ./Giraffe#cite_note-Coimbra2021-22
                        - generic [ref=f26e1914]: "[22]"
                    - text: which was supported by a 2024 study of cranial morphology.
                    - superscript [ref=f26e1915]:
                      - link "[23]" [ref=f26e1916] [cursor=pointer]:
                        - /url: ./Giraffe#cite_note-23
                        - generic [ref=f26e1917]: "[23]"
                    - text: A 2024 study found a higher amount of ancient
                    - link "gene flow" [ref=f26e1918] [cursor=pointer]:
                      - /url: ./Gene_flow
                    - text: than expected between populations.
                    - superscript [ref=f26e1919]:
                      - link "[24]" [ref=f26e1920] [cursor=pointer]:
                        - /url: ./Giraffe#cite_note-Bertola-24
                        - generic [ref=f26e1921]: "[24]"
                  - paragraph [ref=f26e1922]:
                    - text: The
                    - link "cladogram" [ref=f26e1923] [cursor=pointer]:
                      - /url: ./Cladogram
                    - text: below shows the phylogenetic relationship between the four species and seven subspecies based on a 2021 genome analysis.
                    - superscript [ref=f26e1924]:
                      - link "[22]" [ref=f26e1925] [cursor=pointer]:
                        - /url: ./Giraffe#cite_note-Coimbra2021-22
                        - generic [ref=f26e1926]: "[22]"
                    - text: The eight lineages correspond to eight traditional subspecies in the one-species hypothesis. The Rothschild giraffe is subsumed into G. camelopardalis camelopardalis.
