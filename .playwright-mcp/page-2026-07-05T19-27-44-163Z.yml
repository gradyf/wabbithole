                  - paragraph [ref=f26e1626]:
                    - text: Giraffes, along with the okapi, are the only living members of family Giraffidae in the order
                    - link "Artiodactyla" [ref=f26e1627] [cursor=pointer]:
                      - /url: ./Artiodactyla
                    - text: .
                    - superscript [ref=f26e1628]:
                      - link "[6]" [ref=f26e1629] [cursor=pointer]:
                        - /url: ./Giraffe#cite_note-Mitchell20003-6
                        - generic [ref=f26e1630]: "[6]"
                    - text: They are
                    - link "ruminants" [ref=f26e1631] [cursor=pointer]:
                      - /url: ./Ruminant
                    - text: of the clade
                    - link "Pecora" [ref=f26e1632] [cursor=pointer]:
                      - /url: ./Pecora
                    - text: ", along with"
                    - link "Antilocapridae" [ref=f26e1633] [cursor=pointer]:
