                      - row [ref=f26e2100]:
                        - 'cell "The Kordofan giraffe (G. c. antiquorum) has a distribution which includes southern Chad, the Central African Republic, northern Cameroon, and the northeastern Democratic Republic of the Congo.[1] Populations in Cameroon were formerly included in G. c. peralta, but this was incorrect.[26] Compared to the Nubian giraffe, this subspecies has smaller and more irregular spotting patterns. Its spots are present on insides of the legs, sometimes below the hocks. A median lump is present in males.[27]: 51–52 Some 2,000 are believed to remain in the wild.[1] Considerable confusion has existed over the status of this subspecies and G. c. peralta in zoos. In 2007, all alleged G. c. peralta in European zoos were shown to be, in fact, G. c. antiquorum.[26] With this correction, about 65 are living in zoos.[28]" [ref=f26e2101]':
