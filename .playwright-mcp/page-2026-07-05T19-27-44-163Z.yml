                      - 'row "Thornicroft''s giraffe (G. c. thornicrofti) is restricted to the Luangwa Valley in eastern Zambia.[1] It has notched and somewhat star-shaped patches which and may or may not extend across the legs. The median lump of males is modestly sized.[27]: 54 No more than 550 remain in the wild,[1] with none in zoos.[28] It was named after Harry Scott Thornicroft.[36] Thornicroft''s giraffe (\"G. thornicrofti\") Also known as Luangwa giraffe or Rhodesian giraffe" [ref=f26e2462]':
