                      - 'row "The Masai giraffe (G. c. tippelskirchi) can be found in central and southern Kenya and in Tanzania.[1] Its coat patterns are highly diverse, with spots ranging from mostly rounded and smooth-edged to oval-shaped and incised or loped-edged.[42] A median lump is usually present in males.[27]: 54 [43] A total of 32,550 are thought to remain in the wild,[1] and about 100 are living in zoos.[28] Masai giraffe (G. tippelskirchi)[36] Also known as Kilimanjaro giraffe Masai giraffe (G. tippelskirchi) Two subspecies: G. t. tippelskirchi G. t. thornicrofti" [ref=f26e2414]':
