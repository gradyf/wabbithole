                    - text: ),
                    - link "Cervidae" [ref=f26e1635] [cursor=pointer]:
                      - /url: ./Cervidae
                    - text: (deer),
                    - link "Bovidae" [ref=f26e1636] [cursor=pointer]:
                      - /url: ./Bovidae
                    - text: (cattle, antelope, goats and sheep) and
                    - link "Moschidae" [ref=f26e1637] [cursor=pointer]:
                      - /url: ./Moschidae
                    - text: (musk deer). A 2019
                    - link "genome" [ref=f26e1638] [cursor=pointer]:
