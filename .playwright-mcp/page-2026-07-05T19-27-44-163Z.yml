                      - 'row "The reticulated giraffe (G. c. reticulata) is native to northeastern Kenya, southern Ethiopia, and Somalia.[1] Its distinctive coat pattern consists of sharp-edged, reddish-brown polygonal patches surrounded by thin white lines. Spots may or may not extend under the hocks, and a median lump is present in males.[27]: 53 An estimated 8,660 individuals remain in the wild,[1] and based on International Species Information System records, more than 450 are living in zoos.[28] A 2024 study found that the reticulated giraffe is the result of hybridisation between northern and southern giraffe lineages.[24] Reticulated giraffe (G. reticulata),[35] Also known as Somali giraffe" [ref=f26e2282]':
