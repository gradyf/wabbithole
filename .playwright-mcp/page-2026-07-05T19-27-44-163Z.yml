                      - 'row "Rothschild''s giraffe (G. c. rothschildi) may be an ecotype of G. camelopardalis. Its range includes parts of Uganda and Kenya.[1] Its presence in South Sudan is uncertain.[32] This giraffe has large dark patches with normally well-defined edges but sometimes split. The dark spots may also have swirls of pale colour within them. Spotting rarely reaches below the hocks and rarely to the hooves. This ecotype may also develop five \"horns\".[27]: 53 Around 1,500 individuals are believed to remain in the wild,[1] and more than 450 are living in zoos.[28] According to genetic analysis circa September 2016, it is conspecific with the Nubian giraffe (G. c. camelopardalis).[20]" [ref=f26e2207]':
