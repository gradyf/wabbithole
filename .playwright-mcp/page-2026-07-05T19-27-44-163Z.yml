                      - 'row "The Nubian giraffe (G. c. camelopardalis), is found in eastern South Sudan and southwestern Ethiopia, in addition to Kenya and Uganda.[1] It has sharp-edged chestnut-coloured spots surrounded by mostly white lines, while undersides lack spotting. A lump is prominent in the middle of the male''s head.[27]: 51 Around 2,150 are thought to remain in the wild, with another 1,500 individuals belonging to the Rothschild''s ecotype.[1] With the addition of Rothschild''s giraffe to the Nubian subspecies, the Nubian giraffe is very common in captivity, although the original phenotype is rare — a group is kept at Al Ain Zoo in the United Arab Emirates.[30] In 2003, this group numbered 14.[31] Nubian giraffe (G. camelopardalis)[25] Also known as Baringo giraffe or Ugandan giraffe Two subspecies: G. c. camelopardalis G. c. rothschildi (Rothschild''s giraffe)" [ref=f26e2155]':
