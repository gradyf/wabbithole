                          - text: Giraffes in Cameroon were formerly believed to belong to this species, but are actually G. c. antiquorum. This error resulted in some confusion over its status in zoos, but in 2007 it was established that all "G. c. peralta" kept in European zoos are actually G. c. antiquorum. The same 2007 study found that the West African giraffe was more closely related to Rothschild's giraffe than the Kordofan, and its ancestor may have migrated from eastern to northern Africa and then west as the
                          - link "Sahara" [ref=f26e2260] [cursor=pointer]:
                            - /url: ./Sahara
                          - text: Desert spread. At its largest,
                          - link "Lake Chad" [ref=f26e2261] [cursor=pointer]:
                            - /url: ./Lake_Chad
                          - text: may have acted as a boundary between the West African and Kordofan giraffes during the
