                      - 'row "The Angolan giraffe (G. c. angolensis)[36] occurs in northern Namibia, southwestern Zambia, central Botswana, western Zimbabwe, southern Zimbabwe and, since mid-2023, again in Angola.[37][1][38][39] A 2009 genetic study on this subspecies suggested the northern Namib Desert and Etosha National Park populations form a separate subspecies.[40] This subspecies is white with large brown blotches with pointed or cut edges. The spotting pattern extends throughout the legs but not the upper part of the face. The neck and rump patches tend to be fairly small. The subspecies also has a white ear mark.[27]: 51 About 13,000 animals are estimated to remain in the wild,[1] and about 20 are living in zoos.[28] Angolan giraffe (G. angolensis) Also known as Namibian giraffe Southern giraffe (G. giraffa) Two subspecies: G. g. angolensis G. g. giraffa" [ref=f26e2319]':
