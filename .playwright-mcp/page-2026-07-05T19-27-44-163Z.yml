                  - paragraph [ref=f26e2494]:
                    - text: The first extinct species to be described was
                    - link "Giraffa sivalensis" [ref=f26e2496] [cursor=pointer]:
                      - /url: ./Giraffa_sivalensis
                    - text: from India, the holotype of which was reevaluated as a vertebra of separate species within the genus that was initially described as a fossil of the living giraffe.
                    - superscript [ref=f26e2497]:
                      - link "[44]" [ref=f26e2498] [cursor=pointer]:
                        - /url: ./Giraffe#cite_note-Sittert2015-44
                        - generic [ref=f26e2499]: "[44]"
                    - text: Another extinct species Giraffa punjabiensis is known from Pakistan.
                    - superscript [ref=f26e2500]:
                      - link "[45]" [ref=f26e2501] [cursor=pointer]:
                        - /url: ./Giraffe#cite_note-45
                        - generic [ref=f26e2502]: "[45]"
                    - text: Four other valid extinct species of Giraffa known from Africa are Giraffa gracilis,
                    - link "Giraffa jumae" [ref=f26e2504] [cursor=pointer]:
                      - /url: ./Giraffa_jumae
                    - text: ","
                    - link "Giraffa pygmaea" [ref=f26e2506] [cursor=pointer]:
                      - /url: ./Giraffa_pygmaea
                    - text: and
                    - link "Giraffa stillei" [ref=f26e2508] [cursor=pointer]:
                      - /url: ./Giraffa_stillei
                    - text: .
                    - superscript [ref=f26e2509]:
                      - link "[8]" [ref=f26e2510] [cursor=pointer]:
                        - /url: ./Giraffe#cite_note-Danowitz2015-8
                        - generic [ref=f26e2511]: "[8]"
                    - text: "\"G.\" pomeli from Algeria and Tunisia is not a species of Giraffinae, but a species of Palaeotraginae related to Mitilanotherium."
                    - superscript [ref=f26e2512]:
                      - link "[46]" [ref=f26e2513] [cursor=pointer]:
                        - /url: ./Giraffe#cite_note-46
                        - generic [ref=f26e2514]: "[46]"
              - generic [ref=f26e2515]:
                - heading "Anatomy" [level=2] [ref=f26e2516]
                - figure "Giraffe skeleton on display at the Museum of Osteology, Oklahoma City" [ref=f26e2517]:
                  - link "Photograph of a Giraffe skeleton" [ref=f26e2518] [cursor=pointer]:
                    - /url: ./File:Giraffe_skeleton.jpg
                    - img "Photograph of a Giraffe skeleton" [ref=f26e2519]
                  - generic [ref=f26e2520]:
                    - text: Giraffe skeleton on display at the
                    - link "Museum of Osteology" [ref=f26e2521] [cursor=pointer]:
                      - /url: ./Museum_of_Osteology
                    - text: ","
                    - link "Oklahoma City" [ref=f26e2522] [cursor=pointer]:
                      - /url: ./Oklahoma_City
                - paragraph [ref=f26e2523]:
                  - text: Fully grown giraffes stand 4.3–5.7 m (14–19 ft) tall, with
                  - link "males taller" [ref=f26e2524] [cursor=pointer]:
                    - /url: ./Sexual_dimorphism
                  - text: than females.
                  - superscript [ref=f26e2525]:
                    - link "[47]" [ref=f26e2526] [cursor=pointer]:
                      - /url: ./Giraffe#cite_note-Nowak1999-47
                      - generic [ref=f26e2527]: "[47]"
                  - text: The average weight is 1,192 kg (2,628 lb) for an adult male and 828 kg (1,825 lb) for an adult female.
                  - superscript [ref=f26e2528]:
                    - link "[48]" [ref=f26e2529] [cursor=pointer]:
                      - /url: ./Giraffe#cite_note-Skinner1990-48
                      - generic [ref=f26e2530]: "[48]"
                  - text: Despite its long neck and legs, its body is relatively short.
                  - superscript [ref=f26e2531]:
                    - link "[49]" [ref=f26e2532] [cursor=pointer]:
                      - /url: ./Giraffe#cite_note-anatomy-49
                      - generic [ref=f26e2533]: "[49]"
                  - superscript [ref=f26e2534]:
                    - 'generic "Page / location: 66" [ref=f26e2535]': ": 66"
                  - text: The skin is mostly gray
                  - superscript [ref=f26e2536]:
                    - link "[48]" [ref=f26e2537] [cursor=pointer]:
                      - /url: ./Giraffe#cite_note-Skinner1990-48
                      - generic [ref=f26e2538]: "[48]"
                  - text: or tan,
                  - superscript [ref=f26e2539]:
                    - link "[50]" [ref=f26e2540] [cursor=pointer]:
                      - /url: ./Giraffe#cite_note-50
                      - generic [ref=f26e2541]: "[50]"
                  - text: and can reach a thickness of 20 mm (0.79 in).
                  - superscript [ref=f26e2542]:
                    - link "[51]" [ref=f26e2543] [cursor=pointer]:
                      - /url: ./Giraffe#cite_note-Dagg2014-51
                      - generic [ref=f26e2544]: "[51]"
                  - superscript [ref=f26e2545]:
                    - 'generic "Page / location: 87" [ref=f26e2546]': ": 87"
                  - text: The 80–100 cm (31–39 in) long
                  - superscript [ref=f26e2547]:
                    - link "[36]" [ref=f26e2548] [cursor=pointer]:
                      - /url: ./Giraffe#cite_note-MacDonald-36
                      - generic [ref=f26e2549]: "[36]"
                  - text: tail ends in a long, dark tuft of hair and is used as a defense against insects.
                  - superscript [ref=f26e2550]:
                    - link "[51]" [ref=f26e2551] [cursor=pointer]:
                      - /url: ./Giraffe#cite_note-Dagg2014-51
                      - generic [ref=f26e2552]: "[51]"
                  - superscript [ref=f26e2553]:
                    - 'generic "Page / location: 94" [ref=f26e2554]': ": 94"
                - paragraph [ref=f26e2555]:
                  - text: The
                  - link "coat" [ref=f26e2556] [cursor=pointer]:
                    - /url: ./Animal_coat
                  - text: has dark blotches or patches, which can be orange,
                  - link "chestnut" [ref=f26e2557] [cursor=pointer]:
                    - /url: ./Chestnut_(color)
                  - text: ", brown, or nearly black, surrounded by light hair, usually white or"
                  - link "cream" [ref=f26e2558] [cursor=pointer]:
                    - /url: ./Cream_(colour)
                  - text: coloured.
                  - superscript [ref=f26e2559]:
                    - link "[52]" [ref=f26e2560] [cursor=pointer]:
                      - /url: ./Giraffe#cite_note-Prothero_2003-52
                      - generic [ref=f26e2561]: "[52]"
                  - text: Male giraffes become darker as they grow old.
                  - superscript [ref=f26e2562]:
                    - link "[43]" [ref=f26e2563] [cursor=pointer]:
                      - /url: ./Giraffe#cite_note-estes-43
                      - generic [ref=f26e2564]: "[43]"
                  - text: The coat pattern
                  - link "has been claimed" [ref=f26e2565] [cursor=pointer]:
                    - /url: ./Disruptive_coloration#A_disputed_case:_the_giraffe
                  - text: to serve as
                  - link "camouflage" [ref=f26e2566] [cursor=pointer]:
                    - /url: ./Camouflage
                  - text: in the light and shade patterns of savannah woodlands.
                  - superscript [ref=f26e2567]:
                    - link "[36]" [ref=f26e2568] [cursor=pointer]:
                      - /url: ./Giraffe#cite_note-MacDonald-36
                      - generic [ref=f26e2569]: "[36]"
                  - text: When standing among trees and bushes, they are hard to see at even a few metres distance. However, adult giraffes move about to gain the best view of an approaching predator, relying on their size and ability to defend themselves rather than on camouflage, which may be more important for calves.
                  - superscript [ref=f26e2570]:
                    - link "[6]" [ref=f26e2571] [cursor=pointer]:
                      - /url: ./Giraffe#cite_note-Mitchell20003-6
                      - generic [ref=f26e2572]: "[6]"
                  - text: Each giraffe has a unique coat pattern.
                  - superscript [ref=f26e2573]:
                    - link "[53]" [ref=f26e2574] [cursor=pointer]:
                      - /url: ./Giraffe#cite_note-53
                      - generic [ref=f26e2575]: "[53]"
                  - superscript [ref=f26e2576]:
                    - link "[54]" [ref=f26e2577] [cursor=pointer]:
                      - /url: ./Giraffe#cite_note-54
                      - generic [ref=f26e2578]: "[54]"
                  - text: Calves inherit some coat pattern traits from their mothers, and variation in some spot traits is correlated with calf survival.
                  - superscript [ref=f26e2579]:
                    - link "[42]" [ref=f26e2580] [cursor=pointer]:
                      - /url: ./Giraffe#cite_note-Lee2018-42
                      - generic [ref=f26e2581]: "[42]"
                  - text: The skin under the blotches may regulate the animal's body temperature, being sites for complex blood vessel systems and large
                  - link "sweat glands" [ref=f26e2582] [cursor=pointer]:
                    - /url: ./Sweat_gland
                  - text: .
                  - superscript [ref=f26e2583]:
                    - link "[55]" [ref=f26e2584] [cursor=pointer]:
                      - /url: ./Giraffe#cite_note-Mitchell2004-55
                      - generic [ref=f26e2585]: "[55]"
                  - text: Spotless or solid-colour giraffes are very rare, but have been observed.
                  - superscript [ref=f26e2586]:
                    - link "[56]" [ref=f26e2587] [cursor=pointer]:
                      - /url: ./Giraffe#cite_note-National_Geographic_12_September_2023-56
                      - generic [ref=f26e2588]: "[56]"
                  - superscript [ref=f26e2589]:
                    - link "[57]" [ref=f26e2590] [cursor=pointer]:
                      - /url: ./Giraffe#cite_note-NPR_6_September_2023-57
                      - generic [ref=f26e2591]: "[57]"
                - paragraph [ref=f26e2592]:
                  - text: The fur may give the animal chemical defense, as its parasite repellents give it a characteristic scent. At least 11 main
                  - link "aromatic" [ref=f26e2593] [cursor=pointer]:
                    - /url: ./Aromaticity
                  - text: chemicals are in the fur, although
                  - link "indole" [ref=f26e2594] [cursor=pointer]:
                    - /url: ./Indole
                  - text: and
                  - link "3-methylindole" [ref=f26e2595] [cursor=pointer]:
                    - /url: ./3-methylindole
                  - text: are responsible for most of the smell. Because males have a stronger odour than females, it may also have a
                  - link "sexual function" [ref=f26e2596] [cursor=pointer]:
                    - /url: ./Animal_sexual_behaviour
                  - text: .
                  - superscript [ref=f26e2597]:
                    - link "[58]" [ref=f26e2598] [cursor=pointer]:
                      - /url: ./Giraffe#cite_note-58
                      - generic [ref=f26e2599]: "[58]"
                - generic [ref=f26e2600]:
                  - heading "Head" [level=3] [ref=f26e2601]
                  - figure "Closeup of the head of a Southern giraffe" [ref=f26e2602]:
                    - link "Closeup photograph of a giraffe head" [ref=f26e2603] [cursor=pointer]:
                      - /url: ./File:South_African_giraffe_(Giraffa_camelopardalis_giraffa)_head_with_oxpecker_Kruger.jpg
                      - img "Closeup photograph of a giraffe head" [ref=f26e2604]
                    - generic [ref=f26e2605]: Closeup of the head of a Southern giraffe
                  - paragraph [ref=f26e2606]:
                    - text: Both sexes have prominent horn-like structures called
                    - link "ossicones" [ref=f26e2607] [cursor=pointer]:
                      - /url: ./Ossicone
                    - text: ", which can reach 13.5 cm (5.3 in). They are formed from"
                    - link "ossified" [ref=f26e2608] [cursor=pointer]:
                      - /url: ./Ossification
                    - link "cartilage" [ref=f26e2609] [cursor=pointer]:
                      - /url: ./Cartilage
                    - text: ", covered in skin, and fused to the"
                    - link "skull" [ref=f26e2610] [cursor=pointer]:
                      - /url: ./Skull
                    - text: at the
                    - link "parietal bones" [ref=f26e2611] [cursor=pointer]:
                      - /url: ./Parietal_bone
                    - text: .
                    - superscript [ref=f26e2612]:
                      - link "[43]" [ref=f26e2613] [cursor=pointer]:
                        - /url: ./Giraffe#cite_note-estes-43
                        - generic [ref=f26e2614]: "[43]"
                    - superscript [ref=f26e2615]:
                      - link "[51]" [ref=f26e2616] [cursor=pointer]:
                        - /url: ./Giraffe#cite_note-Dagg2014-51
                        - generic [ref=f26e2617]: "[51]"
                    - superscript [ref=f26e2618]:
                      - 'generic "Page / location: 95–97" [ref=f26e2619]': ": 95–97"
                    - text: Being
                    - link "vascularised" [ref=f26e2620] [cursor=pointer]:
                      - /url: ./Blood_vessel
                    - text: ", the ossicones may have a role in"
                    - link "thermoregulation" [ref=f26e2621] [cursor=pointer]:
                      - /url: ./Thermoregulation
                    - text: ","
                    - superscript [ref=f26e2622]:
                      - link "[55]" [ref=f26e2623] [cursor=pointer]:
                        - /url: ./Giraffe#cite_note-Mitchell2004-55
                        - generic [ref=f26e2624]: "[55]"
                    - text: and are used in combat between males.
                    - superscript [ref=f26e2625]:
                      - link "[59]" [ref=f26e2626] [cursor=pointer]:
                        - /url: ./Giraffe#cite_note-sim2010-59
                        - generic [ref=f26e2627]: "[59]"
                    - text: "Appearance is a reliable guide to the sex or age of a giraffe: the ossicones of females and young are thin and display tufts of hair on top, whereas those of adult males tend to be bald and knobbed on top."
                    - superscript [ref=f26e2628]:
                      - link "[43]" [ref=f26e2629] [cursor=pointer]:
                        - /url: ./Giraffe#cite_note-estes-43
                        - generic [ref=f26e2630]: "[43]"
                    - text: A lump, which is more prominent in males, emerges in the middle of the skull.
                    - superscript [ref=f26e2631]:
                      - link "[17]" [ref=f26e2632] [cursor=pointer]:
                        - /url: ./Giraffe#cite_note-Dagg1971-17
                        - generic [ref=f26e2633]: "[17]"
                    - text: Males develop
                    - link "calcium" [ref=f26e2634] [cursor=pointer]:
                      - /url: ./Calcium
                    - text: deposits that form bumps on their skulls as they age.
                    - superscript [ref=f26e2635]:
                      - link "[52]" [ref=f26e2636] [cursor=pointer]:
                        - /url: ./Giraffe#cite_note-Prothero_2003-52
                        - generic [ref=f26e2637]: "[52]"
                    - text: Multiple
                    - link "sinuses" [ref=f26e2638] [cursor=pointer]:
                      - /url: ./Sinus_(anatomy)
                    - text: lighten a giraffe's skull.
                    - superscript [ref=f26e2639]:
                      - link "[51]" [ref=f26e2640] [cursor=pointer]:
                        - /url: ./Giraffe#cite_note-Dagg2014-51
                        - generic [ref=f26e2641]: "[51]"
                    - superscript [ref=f26e2642]:
                      - 'generic "Page / location: 103" [ref=f26e2643]': ": 103"
                    - text: However, as males age, their skulls become heavier and more club-like, helping them become more dominant in combat.
                    - superscript [ref=f26e2644]:
                      - link "[43]" [ref=f26e2645] [cursor=pointer]:
                        - /url: ./Giraffe#cite_note-estes-43
                        - generic [ref=f26e2646]: "[43]"
                    - text: The
                    - link "occipital condyles" [ref=f26e2647] [cursor=pointer]:
                      - /url: ./Occipital_condyles
                    - text: at the bottom of the skull allow the animal to tip its head over 90 degrees and grab food on the branches directly above them with the tongue.
                    - superscript [ref=f26e2648]:
                      - link "[51]" [ref=f26e2649] [cursor=pointer]:
                        - /url: ./Giraffe#cite_note-Dagg2014-51
                        - generic [ref=f26e2650]: "[51]"
                    - superscript [ref=f26e2651]:
                      - 'generic "Page / location: 103, 110" [ref=f26e2652]': ": 103, 110"
                    - superscript [ref=f26e2653]:
                      - link "[17]" [ref=f26e2654] [cursor=pointer]:
                        - /url: ./Giraffe#cite_note-Dagg1971-17
                        - generic [ref=f26e2655]: "[17]"
                  - paragraph [ref=f26e2656]:
                    - text: With eyes located on the sides of the head, the giraffe has a broad
                    - link "visual field" [ref=f26e2657] [cursor=pointer]:
                      - /url: ./Field_of_view
                    - text: from its great height.
                    - superscript [ref=f26e2658]:
                      - link "[51]" [ref=f26e2659] [cursor=pointer]:
                        - /url: ./Giraffe#cite_note-Dagg2014-51
                        - generic [ref=f26e2660]: "[51]"
                    - superscript [ref=f26e2661]:
                      - 'generic "Page / location: 85, 102" [ref=f26e2662]': ": 85, 102"
                    - text: Compared to other
                    - link "ungulates" [ref=f26e2663] [cursor=pointer]:
                      - /url: ./Ungulate
                    - text: ", giraffe vision is more"
                    - link "binocular" [ref=f26e2664] [cursor=pointer]:
                      - /url: ./Binocular_vision
                    - text: and the eyes are larger with a greater
                    - link "retinal" [ref=f26e2665] [cursor=pointer]:
                      - /url: ./Retina
                    - text: surface area.
                    - superscript [ref=f26e2666]:
                      - link "[60]" [ref=f26e2667] [cursor=pointer]:
                        - /url: ./Giraffe#cite_note-60
                        - generic [ref=f26e2668]: "[60]"
                    - text: Giraffes may see in colour,
                    - superscript [ref=f26e2669]:
                      - link "[51]" [ref=f26e2670] [cursor=pointer]:
                        - /url: ./Giraffe#cite_note-Dagg2014-51
                        - generic [ref=f26e2671]: "[51]"
                    - superscript [ref=f26e2672]:
                      - 'generic "Page / location: 85" [ref=f26e2673]': ": 85"
                    - text: and their senses of hearing and
                    - link "smell" [ref=f26e2674] [cursor=pointer]:
                      - /url: ./Olfaction
                    - text: are sharp.
                    - superscript [ref=f26e2675]:
                      - link "[52]" [ref=f26e2676] [cursor=pointer]:
                        - /url: ./Giraffe#cite_note-Prothero_2003-52
                        - generic [ref=f26e2677]: "[52]"
                    - text: The ears are movable.
                    - superscript [ref=f26e2678]:
                      - link "[51]" [ref=f26e2679] [cursor=pointer]:
                        - /url: ./Giraffe#cite_note-Dagg2014-51
                        - generic [ref=f26e2680]: "[51]"
                    - superscript [ref=f26e2681]:
                      - 'generic "Page / location: 95" [ref=f26e2682]': ": 95"
                    - text: The nostrils are slit-shaped, possibly to withstand blowing sand.
                    - superscript [ref=f26e2683]:
                      - link "[61]" [ref=f26e2684] [cursor=pointer]:
                        - /url: ./Giraffe#cite_note-61
                        - generic [ref=f26e2685]: "[61]"
                    - text: A giraffe's
                    - link "tongue" [ref=f26e2686] [cursor=pointer]:
                      - /url: ./Tongue
                    - text: is about 45 cm (18 in) long. It is black, perhaps to protect against sunburn, and can
                    - link "grasp" [ref=f26e2687] [cursor=pointer]:
                      - /url: ./Prehensile
                    - text: foliage and delicately pick off leaves.
                    - superscript [ref=f26e2688]:
                      - link "[51]" [ref=f26e2689] [cursor=pointer]:
                        - /url: ./Giraffe#cite_note-Dagg2014-51
                        - generic [ref=f26e2690]: "[51]"
                    - superscript [ref=f26e2691]:
                      - 'generic "Page / location: 109–110" [ref=f26e2692]': ": 109–110"
                    - text: The upper lip is flexible and hairy to protect against sharp prickles.
                    - superscript [ref=f26e2693]:
                      - link "[17]" [ref=f26e2694] [cursor=pointer]:
                        - /url: ./Giraffe#cite_note-Dagg1971-17
                        - generic [ref=f26e2695]: "[17]"
                    - text: The upper jaw has a hard
                    - link "palate" [ref=f26e2696] [cursor=pointer]:
                      - /url: ./Palate
                    - text: instead of front teeth. The
                    - link "molars" [ref=f26e2697] [cursor=pointer]:
                      - /url: ./Molar_(tooth)
                    - text: and
                    - link "premolars" [ref=f26e2698] [cursor=pointer]:
                      - /url: ./Premolar
                    - text: are wide with low
                    - link "crowns" [ref=f26e2699] [cursor=pointer]:
                      - /url: ./Crown_(tooth)
                    - text: on the surface.
                    - superscript [ref=f26e2700]:
                      - link "[51]" [ref=f26e2701] [cursor=pointer]:
                        - /url: ./Giraffe#cite_note-Dagg2014-51
                        - generic [ref=f26e2702]: "[51]"
                    - superscript [ref=f26e2703]:
                      - 'generic "Page / location: 106" [ref=f26e2704]': ": 106"
                - generic [ref=f26e2705]:
                  - heading "Neck" [level=3] [ref=f26e2706]
                  - paragraph [ref=f26e2707]:
                    - text: Giraffes have an extremely elongated neck, which can be up to 2.4 m (7.9 ft) in length.
                    - superscript [ref=f26e2708]:
                      - link "[62]" [ref=f26e2709] [cursor=pointer]:
                        - /url: ./Giraffe#cite_note-Taylor&Wedel2013-62
                        - generic [ref=f26e2710]: "[62]"
                    - text: Along the neck is a mane made of short, erect hairs.
                    - superscript [ref=f26e2711]:
                      - link "[17]" [ref=f26e2712] [cursor=pointer]:
                        - /url: ./Giraffe#cite_note-Dagg1971-17
                        - generic [ref=f26e2713]: "[17]"
                    - text: The neck typically rests at an angle of 50–60 degrees, though juveniles are closer to 70 degrees.
                    - superscript [ref=f26e2714]:
                      - link "[51]" [ref=f26e2715] [cursor=pointer]:
                        - /url: ./Giraffe#cite_note-Dagg2014-51
                        - generic [ref=f26e2716]: "[51]"
                    - superscript [ref=f26e2717]:
                      - 'generic "Page / location: 72–73" [ref=f26e2718]': ": 72–73"
                    - text: The long neck results from a disproportionate lengthening of the
                    - link "cervical vertebrae" [ref=f26e2719] [cursor=pointer]:
                      - /url: ./Cervical_vertebrae
                    - text: ", not from the addition of more vertebrae. Each cervical vertebra is over 28 cm (11 in) long."
                    - superscript [ref=f26e2720]:
                      - link "[49]" [ref=f26e2721] [cursor=pointer]:
                        - /url: ./Giraffe#cite_note-anatomy-49
                        - generic [ref=f26e2722]: "[49]"
                    - superscript [ref=f26e2723]:
                      - 'generic "Page / location: 71" [ref=f26e2724]': ": 71"
                    - text: They comprise 52–54 per cent of the length of the giraffe's
                    - link "vertebral column" [ref=f26e2725] [cursor=pointer]:
                      - /url: ./Vertebral_column
                    - text: ", compared with the 27–33 percent typical of similar large ungulates, including the giraffe's closest living relative, the"
                    - link "okapi" [ref=f26e2726] [cursor=pointer]:
                      - /url: ./Okapi
                    - text: .
                    - superscript [ref=f26e2727]:
                      - link "[13]" [ref=f26e2728] [cursor=pointer]:
                        - /url: ./Giraffe#cite_note-bada-13
                        - generic [ref=f26e2729]: "[13]"
                    - text: This elongation largely takes place after birth, perhaps because giraffe mothers would have a difficult time
                    - link "giving birth" [ref=f26e2730] [cursor=pointer]:
                      - /url: ./Giving_birth
                    - text: to young with the same neck proportions as adults.
                    - superscript [ref=f26e2731]:
                      - link "[63]" [ref=f26e2732] [cursor=pointer]:
                        - /url: ./Giraffe#cite_note-van-63
                        - generic [ref=f26e2733]: "[63]"
                    - text: The giraffe's head and neck are held up by large muscles and a
                    - link "nuchal ligament" [ref=f26e2734] [cursor=pointer]:
                      - /url: ./Nuchal_ligament
                    - text: ", which are anchored by long"
                    - link "thoracic vertebrae" [ref=f26e2735] [cursor=pointer]:
                      - /url: ./Thoracic_vertebrae
                    - text: spines, giving them a hump.
                    - superscript [ref=f26e2736]:
                      - link "[17]" [ref=f26e2737] [cursor=pointer]:
                        - /url: ./Giraffe#cite_note-Dagg1971-17
                        - generic [ref=f26e2738]: "[17]"
                    - superscript [ref=f26e2739]:
                      - link "[64]" [ref=f26e2740] [cursor=pointer]:
                        - /url: ./Giraffe#cite_note-Solounias1999-64
                        - generic [ref=f26e2741]: "[64]"
                    - superscript [ref=f26e2742]:
                      - link "[36]" [ref=f26e2743] [cursor=pointer]:
                        - /url: ./Giraffe#cite_note-MacDonald-36
                        - generic [ref=f26e2744]: "[36]"
                  - figure "Adult male reticulated giraffe feeding high on an acacia, in Kenya" [ref=f26e2745]:
                    - link "Photograph of an adult male giraffe with its next fully extended feeding on an acacia" [ref=f26e2746] [cursor=pointer]:
                      - /url: ./File:Flickr_-_Rainbirder_-_High-rise_living.jpg
                      - img "Photograph of an adult male giraffe with its next fully extended feeding on an acacia" [ref=f26e2747]
                    - generic [ref=f26e2748]:
                      - text: Adult male
                      - link "reticulated giraffe" [ref=f26e2749] [cursor=pointer]:
                        - /url: ./Reticulated_giraffe
                      - text: feeding high on an acacia, in Kenya
                  - paragraph [ref=f26e2750]:
                    - text: The giraffe's neck vertebrae have
                    - link "ball and socket joints" [ref=f26e2751] [cursor=pointer]:
                      - /url: ./Ball_and_socket_joint
                    - text: .
                    - superscript [ref=f26e2752]:
                      - link "[49]" [ref=f26e2753] [cursor=pointer]:
                        - /url: ./Giraffe#cite_note-anatomy-49
                        - generic [ref=f26e2754]: "[49]"
                    - superscript [ref=f26e2755]:
                      - 'generic "Page / location: 71" [ref=f26e2756]': ": 71"
                    - text: The point of articulation between the cervical and thoracic vertebrae of giraffes is shifted to lie between the first and second thoracic vertebrae (T1 and T2), unlike in most other ruminants, where the articulation is between the seventh cervical vertebra (C7) and T1.
                    - superscript [ref=f26e2757]:
                      - link "[13]" [ref=f26e2758] [cursor=pointer]:
                        - /url: ./Giraffe#cite_note-bada-13
                        - generic [ref=f26e2759]: "[13]"
                    - superscript [ref=f26e2760]:
                      - link "[63]" [ref=f26e2761] [cursor=pointer]:
                        - /url: ./Giraffe#cite_note-van-63
                        - generic [ref=f26e2762]: "[63]"
                    - text: This allows C7 to contribute directly to increased neck length and has given rise to the suggestion that T1 is actually C8, and that giraffes have added an extra cervical vertebra.
                    - superscript [ref=f26e2763]:
                      - link "[64]" [ref=f26e2764] [cursor=pointer]:
                        - /url: ./Giraffe#cite_note-Solounias1999-64
                        - generic [ref=f26e2765]: "[64]"
                    - text: However, this proposition is not generally accepted, as T1 has other
                    - link "morphological" [ref=f26e2766] [cursor=pointer]:
                      - /url: ./Morphology_(biology)
                    - text: features, such as an articulating
                    - link "rib" [ref=f26e2767] [cursor=pointer]:
                      - /url: ./Rib
                    - text: ", deemed diagnostic of thoracic vertebrae, and because exceptions to the mammalian limit of seven cervical vertebrae are generally characterised by increased"
                    - link "neurological anomalies" [ref=f26e2768] [cursor=pointer]:
                      - /url: ./Neurological_disorder
                    - text: and maladies.
                    - superscript [ref=f26e2769]:
                      - link "[13]" [ref=f26e2770] [cursor=pointer]:
                        - /url: ./Giraffe#cite_note-bada-13
                        - generic [ref=f26e2771]: "[13]"
                  - paragraph [ref=f26e2772]:
                    - text: There are several hypotheses regarding the evolutionary origin and maintenance of elongation in giraffe necks.
                    - superscript [ref=f26e2773]:
                      - link "[59]" [ref=f26e2774] [cursor=pointer]:
                        - /url: ./Giraffe#cite_note-sim2010-59
                        - generic [ref=f26e2775]: "[59]"
                    - link "Charles Darwin" [ref=f26e2776] [cursor=pointer]:
                      - /url: ./Charles_Darwin
                    - text: originally suggested the "competing
                    - link "browsers" [ref=f26e2777] [cursor=pointer]:
                      - /url: ./Browsing_(predation)
                    - text: hypothesis", which has been challenged only recently. It suggests that competitive pressure from smaller browsers, like
                    - link "kudu" [ref=f26e2778] [cursor=pointer]:
                      - /url: ./Kudu
                    - text: ","
                    - link "steenbok" [ref=f26e2779] [cursor=pointer]:
                      - /url: ./Steenbok
                    - text: and
                    - link "impala" [ref=f26e2780] [cursor=pointer]:
                      - /url: ./Impala
                    - text: ", encouraged the elongation of the neck, as it enabled giraffes to reach food that competitors could not. This advantage is real, as giraffes can and do feed up to 4.5 m (15 ft) high, while even quite large competitors, such as kudu, can feed up to only about 2 m (6 ft 7 in) high."
                    - superscript [ref=f26e2781]:
                      - link "[65]" [ref=f26e2782] [cursor=pointer]:
                        - /url: ./Giraffe#cite_note-dt1990-65
                        - generic [ref=f26e2783]: "[65]"
                    - text: There is also research suggesting that browsing competition is intense at lower levels, and giraffes feed more efficiently (gaining more leaf biomass with each mouthful) high in the canopy.
                    - superscript [ref=f26e2784]:
                      - link "[66]" [ref=f26e2785] [cursor=pointer]:
                        - /url: ./Giraffe#cite_note-66
                        - generic [ref=f26e2786]: "[66]"
                    - superscript [ref=f26e2787]:
                      - link "[67]" [ref=f26e2788] [cursor=pointer]:
                        - /url: ./Giraffe#cite_note-67
                        - generic [ref=f26e2789]: "[67]"
                    - text: However, scientists disagree about just how much time giraffes spend feeding at levels beyond the reach of other browsers,
                    - superscript [ref=f26e2790]:
                      - link "[10]" [ref=f26e2791] [cursor=pointer]:
                        - /url: ./Giraffe#cite_note-sim1996-10
                        - generic [ref=f26e2792]: "[10]"
                    - superscript [ref=f26e2793]:
                      - link "[59]" [ref=f26e2794] [cursor=pointer]:
                        - /url: ./Giraffe#cite_note-sim2010-59
                        - generic [ref=f26e2795]: "[59]"
                    - superscript [ref=f26e2796]:
                      - link "[65]" [ref=f26e2797] [cursor=pointer]:
                        - /url: ./Giraffe#cite_note-dt1990-65
                        - generic [ref=f26e2798]: "[65]"
                    - superscript [ref=f26e2799]:
                      - link "[68]" [ref=f26e2800] [cursor=pointer]:
                        - /url: ./Giraffe#cite_note-sexdiff-68
                        - generic [ref=f26e2801]: "[68]"
                    - text: and a 2010 study found that adult giraffes with longer necks actually suffered higher mortality rates under drought conditions than their shorter-necked counterparts. This study suggests that maintaining a longer neck requires more nutrients, which puts longer-necked giraffes at risk during a food shortage.
                    - superscript [ref=f26e2802]:
                      - link "[69]" [ref=f26e2803] [cursor=pointer]:
                        - /url: ./Giraffe#cite_note-demography-69
                        - generic [ref=f26e2804]: "[69]"
                  - paragraph [ref=f26e2805]:
                    - text: Another theory, the
                    - link "sexual selection" [ref=f26e2806] [cursor=pointer]:
                      - /url: ./Sexual_selection
                    - text: hypothesis, proposes that long necks evolved as a secondary
                    - link "sexual characteristic" [ref=f26e2807] [cursor=pointer]:
                      - /url: ./Sexual_dimorphism
                    - text: ", giving males an advantage in \"necking\" contests to establish dominance and obtain access to sexually receptive females."
                    - superscript [ref=f26e2808]:
                      - link "[10]" [ref=f26e2809] [cursor=pointer]:
                        - /url: ./Giraffe#cite_note-sim1996-10
                        - generic [ref=f26e2810]: "[10]"
                    - text: In support of this theory, some studies have stated that necks are longer and heavier for males than females of the same age,
                    - superscript [ref=f26e2811]:
                      - link "[10]" [ref=f26e2812] [cursor=pointer]:
                        - /url: ./Giraffe#cite_note-sim1996-10
                        - generic [ref=f26e2813]: "[10]"
                    - superscript [ref=f26e2814]:
                      - link "[59]" [ref=f26e2815] [cursor=pointer]:
                        - /url: ./Giraffe#cite_note-sim2010-59
                        - generic [ref=f26e2816]: "[59]"
                    - text: and that males do not employ other forms of combat.
                    - superscript [ref=f26e2817]:
                      - link "[10]" [ref=f26e2818] [cursor=pointer]:
                        - /url: ./Giraffe#cite_note-sim1996-10
                        - generic [ref=f26e2819]: "[10]"
                    - text: However, a 2024 study found that, while males have thicker necks, females actually have proportionally longer ones, which is likely because of their greater need to find more food to sustain themselves and their dependent young.
                    - superscript [ref=f26e2820]:
                      - link "[70]" [ref=f26e2821] [cursor=pointer]:
                        - /url: ./Giraffe#cite_note-Cavener2024-70
                        - generic [ref=f26e2822]: "[70]"
                    - text: It has also been proposed that the neck serves to give the animal greater vigilance.
                    - superscript [ref=f26e2823]:
                      - link "[71]" [ref=f26e2824] [cursor=pointer]:
                        - /url: ./Giraffe#cite_note-71
                        - generic [ref=f26e2825]: "[71]"
                    - superscript [ref=f26e2826]:
                      - link "[72]" [ref=f26e2827] [cursor=pointer]:
                        - /url: ./Giraffe#cite_note-72
                        - generic [ref=f26e2828]: "[72]"
                - generic [ref=f26e2829]:
                  - heading "Legs, locomotion and posture" [level=3] [ref=f26e2830]: Legs, locomotion and posture
                  - figure "Right hind leg of a Masai giraffe at the San Diego Zoo" [ref=f26e2831]:
                    - link "Photograph of giraffe's hind leg" [ref=f26e2832] [cursor=pointer]:
                      - /url: ./File:Masai_Giraffe_right-rear_foot.jpg
                      - img "Photograph of giraffe's hind leg" [ref=f26e2833]
                    - generic [ref=f26e2834]:
                      - text: Right hind leg of a Masai giraffe at the
                      - link "San Diego Zoo" [ref=f26e2835] [cursor=pointer]:
                        - /url: ./San_Diego_Zoo
                  - paragraph [ref=f26e2836]:
                    - text: The front legs tend to be longer than the hind legs,
                    - superscript [ref=f26e2837]:
                      - link "[51]" [ref=f26e2838] [cursor=pointer]:
                        - /url: ./Giraffe#cite_note-Dagg2014-51
                        - generic [ref=f26e2839]: "[51]"
                    - superscript [ref=f26e2840]:
                      - 'generic "Page / location: 109" [ref=f26e2841]': ": 109"
                    - text: and males have proportionally longer front legs than females, which gives them better support when swinging their necks during fights.
                    - superscript [ref=f26e2842]:
                      - link "[70]" [ref=f26e2843] [cursor=pointer]:
                        - /url: ./Giraffe#cite_note-Cavener2024-70
                        - generic [ref=f26e2844]: "[70]"
                    - text: The leg bones lack first, second and fifth
                    - link "metapodials" [ref=f26e2845] [cursor=pointer]:
                      - /url: ./Metapodial
                    - text: .
                    - superscript [ref=f26e2846]:
                      - link "[51]" [ref=f26e2847] [cursor=pointer]:
                        - /url: ./Giraffe#cite_note-Dagg2014-51
                        - generic [ref=f26e2848]: "[51]"
                    - superscript [ref=f26e2849]:
                      - 'generic "Page / location: 109" [ref=f26e2850]': ": 109"
                    - text: It appears that a
                    - link "suspensory ligament" [ref=f26e2851] [cursor=pointer]:
                      - /url: ./Suspensory_ligament
                    - text: allows the lanky legs to support the animal's great weight.
                    - superscript [ref=f26e2852]:
                      - link "[73]" [ref=f26e2853] [cursor=pointer]:
                        - /url: ./Giraffe#cite_note-73
                        - generic [ref=f26e2854]: "[73]"
                    - text: The
                    - link "hooves" [ref=f26e2855] [cursor=pointer]:
                      - /url: ./Hoof
                    - text: of large male giraffes reach 31 cm × 23 cm (12.2 in × 9.1 in) in diameter.
                    - superscript [ref=f26e2856]:
                      - link "[51]" [ref=f26e2857] [cursor=pointer]:
                        - /url: ./Giraffe#cite_note-Dagg2014-51
                        - generic [ref=f26e2858]: "[51]"
                    - superscript [ref=f26e2859]:
                      - 'generic "Page / location: 98" [ref=f26e2860]': ": 98"
                    - text: The
                    - link "fetlock" [ref=f26e2861] [cursor=pointer]:
                      - /url: ./Fetlock
                    - text: of the leg is low to the ground, allowing the hoof to better support the animal's weight. Giraffes lack
                    - link "dewclaws" [ref=f26e2862] [cursor=pointer]:
                      - /url: ./Dewclaw
                    - text: and interdigital glands. While the pelvis is relatively short, the
                    - link "ilium" [ref=f26e2863] [cursor=pointer]:
                      - /url: ./Ilium_(bone)
                    - text: has stretched-out crests.
                    - superscript [ref=f26e2864]:
                      - link "[17]" [ref=f26e2865] [cursor=pointer]:
                        - /url: ./Giraffe#cite_note-Dagg1971-17
                        - generic [ref=f26e2866]: "[17]"
                  - paragraph [ref=f26e2867]:
                    - text: A giraffe has only two
                    - link "gaits" [ref=f26e2868] [cursor=pointer]:
                      - /url: ./Gait
                    - text: ": walking and galloping. Walking is done by moving the legs on one side of the body, then doing the same on the other side."
                    - superscript [ref=f26e2869]:
                      - link "[43]" [ref=f26e2870] [cursor=pointer]:
                        - /url: ./Giraffe#cite_note-estes-43
                        - generic [ref=f26e2871]: "[43]"
                    - text: When galloping, the hind legs move around the front legs before the latter move forward,
                    - superscript [ref=f26e2872]:
                      - link "[52]" [ref=f26e2873] [cursor=pointer]:
                        - /url: ./Giraffe#cite_note-Prothero_2003-52
                        - generic [ref=f26e2874]: "[52]"
                    - text: and the tail will curl up.
                    - superscript [ref=f26e2875]:
                      - link "[43]" [ref=f26e2876] [cursor=pointer]:
                        - /url: ./Giraffe#cite_note-estes-43
                        - generic [ref=f26e2877]: "[43]"
                    - text: The movements of the head and neck provide balance and control momentum while galloping.
                    - superscript [ref=f26e2878]:
                      - link "[33]" [ref=f26e2879] [cursor=pointer]:
                        - /url: ./Giraffe#cite_note-Kingdon1988-33
                        - generic [ref=f26e2880]: "[33]"
                    - superscript [ref=f26e2881]:
                      - 'generic "Page / location: 327–29" [ref=f26e2882]': ": 327–29"
                    - text: A giraffe can reach a sprint speed of up to 60 km/h (37 mph),
                    - superscript [ref=f26e2883]:
                      - link "[74]" [ref=f26e2884] [cursor=pointer]:
                        - /url: ./Giraffe#cite_note-74
                        - generic [ref=f26e2885]: "[74]"
                    - text: and can sustain 50 km/h (31 mph) for several kilometres.
                    - superscript [ref=f26e2886]:
                      - link "[75]" [ref=f26e2887] [cursor=pointer]:
                        - /url: ./Giraffe#cite_note-75
                        - generic [ref=f26e2888]: "[75]"
                    - text: Giraffes would probably not be competent swimmers as their long legs would be highly cumbersome in the water,
                    - superscript [ref=f26e2889]:
                      - link "[76]" [ref=f26e2890] [cursor=pointer]:
                        - /url: ./Giraffe#cite_note-swim-76
                        - generic [ref=f26e2891]: "[76]"
                    - text: although they might be able to float.
                    - superscript [ref=f26e2892]:
                      - link "[77]" [ref=f26e2893] [cursor=pointer]:
                        - /url: ./Giraffe#cite_note-Naish-77
                        - generic [ref=f26e2894]: "[77]"
                    - text: When swimming, the thorax would be weighed down by the front legs, making it difficult for the animal to move its neck and legs in harmony
                    - superscript [ref=f26e2895]:
                      - link "[76]" [ref=f26e2896] [cursor=pointer]:
                        - /url: ./Giraffe#cite_note-swim-76
                        - generic [ref=f26e2897]: "[76]"
                    - superscript [ref=f26e2898]:
                      - link "[77]" [ref=f26e2899] [cursor=pointer]:
                        - /url: ./Giraffe#cite_note-Naish-77
                        - generic [ref=f26e2900]: "[77]"
                    - text: or keep its head above the water's surface.
                    - superscript [ref=f26e2901]:
                      - link "[76]" [ref=f26e2902] [cursor=pointer]:
                        - /url: ./Giraffe#cite_note-swim-76
                        - generic [ref=f26e2903]: "[76]"
                  - figure "A juvenile giraffe walking in Malawi" [ref=f26e2904]:
                    - generic [ref=f26e2905]: A juvenile giraffe walking in Malawi
                  - paragraph [ref=f26e2906]:
                    - text: A giraffe rests by lying with its body on top of its folded legs.
                    - superscript [ref=f26e2907]:
                      - link "[33]" [ref=f26e2908] [cursor=pointer]:
                        - /url: ./Giraffe#cite_note-Kingdon1988-33
                        - generic [ref=f26e2909]: "[33]"
                    - superscript [ref=f26e2910]:
                      - 'generic "Page / location: 329" [ref=f26e2911]': ": 329"
                    - text: To lie down, the animal kneels on its front legs and then lowers the rest of its body. To get back up, it first gets on its front knees and positions its backside on top of its hindlegs. It then pulls the backside upwards, and the front legs stand straight up again. At each stage, the animal swings its head for balance.
                    - superscript [ref=f26e2912]:
                      - link "[51]" [ref=f26e2913] [cursor=pointer]:
                        - /url: ./Giraffe#cite_note-Dagg2014-51
                        - generic [ref=f26e2914]: "[51]"
                    - superscript [ref=f26e2915]:
                      - 'generic "Page / location: 67" [ref=f26e2916]': ": 67"
                    - text: If the giraffe wants to reach down to drink, it either spreads its front legs or bends its knees.
                    - superscript [ref=f26e2917]:
                      - link "[43]" [ref=f26e2918] [cursor=pointer]:
                        - /url: ./Giraffe#cite_note-estes-43
                        - generic [ref=f26e2919]: "[43]"
                    - text: Studies in captivity found that giraffes sleep intermittently around 4.6 hours per day, mostly at night. It usually sleeps lying down; however, standing sleeps have been recorded, particularly in older individuals. Intermittent short "deep sleep" phases while lying are characterised by the giraffe bending its neck backwards and resting its head on the hip or thigh, a position believed to indicate
                    - link "paradoxical sleep" [ref=f26e2920] [cursor=pointer]:
                      - /url: ./Paradoxical_sleep
                    - text: .
                    - superscript [ref=f26e2921]:
                      - link "[78]" [ref=f26e2922] [cursor=pointer]:
                        - /url: ./Giraffe#cite_note-sleep-78
                        - generic [ref=f26e2923]: "[78]"
                - generic [ref=f26e2924]:
                  - heading "Internal systems" [level=3] [ref=f26e2925]
                  - figure "Scheme of path of the recurrent laryngeal nerve in giraffe" [ref=f26e2926]:
                    - link "Sketch of the path of the recurrent laryngeal nerve in giraffe" [ref=f26e2927] [cursor=pointer]:
                      - /url: ./File:GiraffaRecurrEn.svg
                      - img "Sketch of the path of the recurrent laryngeal nerve in giraffe" [ref=f26e2928]
                    - generic [ref=f26e2929]: Scheme of path of the recurrent laryngeal nerve in giraffe
                  - paragraph [ref=f26e2930]:
                    - text: In mammals, the left
                    - link "recurrent laryngeal nerve" [ref=f26e2931] [cursor=pointer]:
                      - /url: ./Recurrent_laryngeal_nerve
                    - text: is longer than the right; in a giraffe, it is over 30 cm (12 in) longer. These nerves are longer in giraffes than in any other living animal;
                    - superscript [ref=f26e2932]:
                      - link "[79]" [ref=f26e2933] [cursor=pointer]:
                        - /url: ./Giraffe#cite_note-Wedel-79
                        - generic [ref=f26e2934]: "[79]"
                    - text: the left nerve is over 2 m (6 ft 7 in) long.
                    - superscript [ref=f26e2935]:
                      - link "[80]" [ref=f26e2936] [cursor=pointer]:
                        - /url: ./Giraffe#cite_note-80
                        - generic [ref=f26e2937]: "[80]"
                    - text: Each nerve cell in this path begins in the
                    - link "brainstem" [ref=f26e2938] [cursor=pointer]:
                      - /url: ./Brainstem
                    - text: and passes down the neck along the
                    - link "vagus nerve" [ref=f26e2939] [cursor=pointer]:
                      - /url: ./Vagus_nerve
                    - text: ", then branches off into the recurrent laryngeal nerve which passes back up the neck to the larynx. Thus, these nerve cells have a length of nearly 5 m (16 ft) in the largest giraffes."
                    - superscript [ref=f26e2940]:
                      - link "[79]" [ref=f26e2941] [cursor=pointer]:
                        - /url: ./Giraffe#cite_note-Wedel-79
                        - generic [ref=f26e2942]: "[79]"
                    - text: Despite its long neck and large skull, the
                    - link "brain" [ref=f26e2943] [cursor=pointer]:
                      - /url: ./Brain
                    - text: of the giraffe is typical for an ungulate.
                    - superscript [ref=f26e2944]:
                      - link "[81]" [ref=f26e2945] [cursor=pointer]:
                        - /url: ./Giraffe#cite_note-81
                        - generic [ref=f26e2946]: "[81]"
                    - text: Evaporative heat loss in the nasal passages keep the giraffe's brain cool.
                    - superscript [ref=f26e2947]:
                      - link "[55]" [ref=f26e2948] [cursor=pointer]:
                        - /url: ./Giraffe#cite_note-Mitchell2004-55
                        - generic [ref=f26e2949]: "[55]"
                    - text: The shape of the skeleton gives the giraffe a small
                    - link "lung" [ref=f26e2950] [cursor=pointer]:
                      - /url: ./Lung
                    - text: volume relative to its mass. Its long neck gives it a large amount of
                    - link "dead space" [ref=f26e2951] [cursor=pointer]:
                      - /url: ./Dead_space_(physiology)
                    - text: ", though this is limited by its narrow windpipe. The giraffe also has a high"
                    - link "tidal volume" [ref=f26e2952] [cursor=pointer]:
                      - /url: ./Tidal_volume
                    - text: ", so the balance of dead space and tidal volume is much the same as other mammals. The animal can still provide enough oxygen for its tissues, and it can increase its"
                    - link "respiratory" [ref=f26e2953] [cursor=pointer]:
                      - /url: ./Breathing
                    - text: rate and oxygen diffusion when running.
                    - superscript [ref=f26e2954]:
                      - link "[82]" [ref=f26e2955] [cursor=pointer]:
                        - /url: ./Giraffe#cite_note-SkinnerJD2011-82
                        - generic [ref=f26e2956]: "[82]"
                  - figure "Reticulated giraffe bending down to drink in Kenya. The circulatory system is adapted to deal with blood flow rushing down its neck." [ref=f26e2957]:
                    - link "Photograph of a giraffe bending down to drink" [ref=f26e2958] [cursor=pointer]:
                      - /url: ./File:Flickr_-_Rainbirder_-_Reticulated_Giraffe_drinking.jpg
                      - img "Photograph of a giraffe bending down to drink" [ref=f26e2959]
                    - generic [ref=f26e2960]:
                      - link "Reticulated giraffe" [ref=f26e2961] [cursor=pointer]:
                        - /url: ./Reticulated_giraffe
                      - text: bending down to drink in Kenya. The circulatory system is adapted to deal with blood flow rushing down its neck.
                  - paragraph [ref=f26e2962]:
                    - text: A giraffe's
                    - link "circulatory system" [ref=f26e2963] [cursor=pointer]:
                      - /url: ./Circulatory_system
                    - text: has several adaptations to compensate for its great height.
                    - superscript [ref=f26e2964]:
                      - link "[14]" [ref=f26e2965] [cursor=pointer]:
                        - /url: ./Giraffe#cite_note-Holmes-14
                        - generic [ref=f26e2966]: "[14]"
                    - text: Its 11 kg (25 lb) and 60 cm (2 ft)
                    - link "heart" [ref=f26e2967] [cursor=pointer]:
                      - /url: ./Heart
                    - text: must generate approximately double the blood pressure required for a human to maintain blood flow to the brain. As such, the wall of the heart can be as thick as 7.5 cm (3.0 in).
                    - superscript [ref=f26e2968]:
                      - link "[52]" [ref=f26e2969] [cursor=pointer]:
                        - /url: ./Giraffe#cite_note-Prothero_2003-52
                        - generic [ref=f26e2970]: "[52]"
                    - text: Giraffes have relatively high heart rates for their size, at 150 beats per minute.
                    - superscript [ref=f26e2971]:
                      - link "[49]" [ref=f26e2972] [cursor=pointer]:
                        - /url: ./Giraffe#cite_note-anatomy-49
                        - generic [ref=f26e2973]: "[49]"
                    - superscript [ref=f26e2974]:
                      - 'generic "Page / location: 76" [ref=f26e2975]': ": 76"
                    - text: When the animal lowers its head, the blood rushes down fairly unopposed and a
                    - link "rete mirabile" [ref=f26e2976] [cursor=pointer]:
                      - /url: ./Rete_mirabile
                    - text: in the upper neck, with its large
                    - link "cross-sectional" [ref=f26e2977] [cursor=pointer]:
                      - /url: ./Cross_section_(geometry)
                    - text: area, prevents excess blood flow to the brain. When it raises again, the blood vessels constrict and push blood into the brain so the animal does not faint.
                    - superscript [ref=f26e2978]:
                      - link "[83]" [ref=f26e2979] [cursor=pointer]:
                        - /url: ./Giraffe#cite_note-83
                        - generic [ref=f26e2980]: "[83]"
                    - text: The
                    - link "jugular veins" [ref=f26e2981] [cursor=pointer]:
                      - /url: ./Jugular_vein
                    - text: contain several (most commonly seven) valves to prevent blood flowing back into the head from the
                    - link "inferior vena cava" [ref=f26e2982] [cursor=pointer]:
                      - /url: ./Inferior_vena_cava
                    - text: and
                    - link "right atrium" [ref=f26e2983] [cursor=pointer]:
                      - /url: ./Right_atrium
                    - text: while the head is lowered.
                    - superscript [ref=f26e2984]:
                      - link "[84]" [ref=f26e2985] [cursor=pointer]:
                        - /url: ./Giraffe#cite_note-84
                        - generic [ref=f26e2986]: "[84]"
                    - text: Conversely, the blood vessels in the lower legs are under great pressure because of the weight of fluid pressing down on them. To solve this problem, the skin of the lower legs is thick and tight, preventing too much blood from pouring into them.
                    - superscript [ref=f26e2987]:
                      - link "[36]" [ref=f26e2988] [cursor=pointer]:
                        - /url: ./Giraffe#cite_note-MacDonald-36
                        - generic [ref=f26e2989]: "[36]"
                  - paragraph [ref=f26e2990]:
                    - text: Giraffes have
                    - link "oesophageal muscles" [ref=f26e2991] [cursor=pointer]:
                      - /url: ./Esophagus
                    - text: that are strong enough to allow regurgitation of food from the stomach up the neck and into the mouth for
                    - link "rumination ↗" [ref=f26e2992] [cursor=pointer]:
                      - /url: https://en.wiktionary.org/wiki/ruminate
                    - text: .
                    - superscript [ref=f26e2993]:
                      - link "[49]" [ref=f26e2994] [cursor=pointer]:
                        - /url: ./Giraffe#cite_note-anatomy-49
                        - generic [ref=f26e2995]: "[49]"
                    - superscript [ref=f26e2996]:
                      - 'generic "Page / location: 78" [ref=f26e2997]': ": 78"
                    - text: They have
                    - link "four-chambered stomachs" [ref=f26e2998] [cursor=pointer]:
                      - /url: ./Ruminant#Digestive_system_of_ruminants
                    - text: ", which are adapted to their specialized diet."
                    - superscript [ref=f26e2999]:
                      - link "[17]" [ref=f26e3000] [cursor=pointer]:
                        - /url: ./Giraffe#cite_note-Dagg1971-17
                        - generic [ref=f26e3001]: "[17]"
                    - text: The
                    - link "intestines" [ref=f26e3002] [cursor=pointer]:
                      - /url: ./Intestine
                    - text: of an adult giraffe measure more than 70 m (230 ft) in length and have a relatively small ratio of
                    - link "small" [ref=f26e3003] [cursor=pointer]:
                      - /url: ./Small_intestine
                    - text: to
                    - link "large intestine" [ref=f26e3004] [cursor=pointer]:
                      - /url: ./Large_intestine
                    - text: .
                    - superscript [ref=f26e3005]:
                      - link "[85]" [ref=f26e3006] [cursor=pointer]:
                        - /url: ./Giraffe#cite_note-PerezEtAl2009-85
                        - generic [ref=f26e3007]: "[85]"
                    - text: Giraffes have a small, compact liver.
                    - superscript [ref=f26e3008]:
                      - link "[49]" [ref=f26e3009] [cursor=pointer]:
                        - /url: ./Giraffe#cite_note-anatomy-49
                        - generic [ref=f26e3010]: "[49]"
                    - superscript [ref=f26e3011]:
                      - 'generic "Page / location: 76" [ref=f26e3012]': ": 76"
                    - text: In fetuses there may be a small
                    - link "gallbladder" [ref=f26e3013] [cursor=pointer]:
                      - /url: ./Gallbladder
                    - text: that vanishes before birth.
                    - superscript [ref=f26e3014]:
                      - link "[17]" [ref=f26e3015] [cursor=pointer]:
                        - /url: ./Giraffe#cite_note-Dagg1971-17
                        - generic [ref=f26e3016]: "[17]"
                    - superscript [ref=f26e3017]:
                      - link "[86]" [ref=f26e3018] [cursor=pointer]:
                        - /url: ./Giraffe#cite_note-86
                        - generic [ref=f26e3019]: "[86]"
                    - superscript [ref=f26e3020]:
                      - link "[87]" [ref=f26e3021] [cursor=pointer]:
                        - /url: ./Giraffe#cite_note-87
                        - generic [ref=f26e3022]: "[87]"
              - generic [ref=f26e3023]:
                - heading "Behaviour and ecology" [level=2] [ref=f26e3024]
                - generic [ref=f26e3025]:
                  - heading "Habitat and feeding" [level=3] [ref=f26e3026]
                  - generic [ref=f26e3028]:
                    - generic [ref=f26e3030]:
                      - link [ref=f26e3033] [cursor=pointer]:
                        - /url: ./File:Giraffe_feeding,_Tanzania.jpg
                        - img [ref=f26e3034]
                      - generic [ref=f26e3035]:
                        - text: A
                        - link "Masai giraffe" [ref=f26e3036] [cursor=pointer]:
                          - /url: ./Masai_giraffe
                        - text: extending its tongue to feed, in Tanzania.
                    - generic [ref=f26e3039]: A giraffe in Malawi eating leaves from a tree
                  - paragraph [ref=f26e3040]:
                    - text: Giraffes usually inhabit savannahs and open
                    - link "woodlands" [ref=f26e3041] [cursor=pointer]:
                      - /url: ./Woodland
                    - text: . They prefer areas dominated by
                    - link "Acacieae" [ref=f26e3042] [cursor=pointer]:
                      - /url: ./Acacieae
                    - text: ","
                    - link "Commiphora" [ref=f26e3044] [cursor=pointer]:
                      - /url: ./Commiphora
                    - text: ","
                    - link "Combretum" [ref=f26e3046] [cursor=pointer]:
                      - /url: ./Combretum
                    - text: and
                    - link "Terminalia" [ref=f26e3048] [cursor=pointer]:
                      - /url: ./Terminalia_(plant)
                    - text: trees over
                    - link "Brachystegia" [ref=f26e3050] [cursor=pointer]:
                      - /url: ./Brachystegia
                    - text: which are more densely spaced.
                    - superscript [ref=f26e3051]:
                      - link "[33]" [ref=f26e3052] [cursor=pointer]:
                        - /url: ./Giraffe#cite_note-Kingdon1988-33
                        - generic [ref=f26e3053]: "[33]"
                    - superscript [ref=f26e3054]:
                      - 'generic "Page / location: 322" [ref=f26e3055]': ": 322"
                    - text: The Angolan giraffe can be found in desert environments.
                    - superscript [ref=f26e3056]:
                      - link "[88]" [ref=f26e3057] [cursor=pointer]:
                        - /url: ./Giraffe#cite_note-88
                        - generic [ref=f26e3058]: "[88]"
                    - text: Giraffes browse on the twigs of trees, preferring those of the subfamily Acacieae and the genera Commiphora and Terminalia,
                    - superscript [ref=f26e3059]:
                      - link "[89]" [ref=f26e3060] [cursor=pointer]:
                        - /url: ./Giraffe#cite_note-kingdon-89
                        - generic [ref=f26e3061]: "[89]"
                    - text: which are important sources of calcium and protein to sustain the giraffe's growth rate.
                    - superscript [ref=f26e3062]:
                      - link "[6]" [ref=f26e3063] [cursor=pointer]:
                        - /url: ./Giraffe#cite_note-Mitchell20003-6
                        - generic [ref=f26e3064]: "[6]"
                    - text: They also feed on shrubs, grass and fruit.
                    - superscript [ref=f26e3065]:
                      - link "[33]" [ref=f26e3066] [cursor=pointer]:
                        - /url: ./Giraffe#cite_note-Kingdon1988-33
                        - generic [ref=f26e3067]: "[33]"
                    - superscript [ref=f26e3068]:
                      - 'generic "Page / location: 324" [ref=f26e3069]': ": 324"
                    - text: A giraffe eats around 34 kg (75 lb) of plant matter daily.
                    - superscript [ref=f26e3070]:
                      - link "[43]" [ref=f26e3071] [cursor=pointer]:
                        - /url: ./Giraffe#cite_note-estes-43
                        - generic [ref=f26e3072]: "[43]"
                    - text: When stressed, giraffes may chew on large branches, stripping them of bark.
                    - superscript [ref=f26e3073]:
                      - link "[33]" [ref=f26e3074] [cursor=pointer]:
                        - /url: ./Giraffe#cite_note-Kingdon1988-33
                        - generic [ref=f26e3075]: "[33]"
                    - superscript [ref=f26e3076]:
                      - 'generic "Page / location: 325" [ref=f26e3077]': ": 325"
                    - text: Giraffes are also recorded to
                    - link "chew old bones" [ref=f26e3078] [cursor=pointer]:
                      - /url: ./Osteophagy
                    - text: .
                    - superscript [ref=f26e3079]:
                      - link "[51]" [ref=f26e3080] [cursor=pointer]:
                        - /url: ./Giraffe#cite_note-Dagg2014-51
                        - generic [ref=f26e3081]: "[51]"
                    - superscript [ref=f26e3082]:
                      - 'generic "Page / location: 102" [ref=f26e3083]': ": 102"
                  - paragraph [ref=f26e3084]:
                    - text: During the wet season, food is abundant and giraffes are more spread out, while during the dry season, they gather around the remaining evergreen trees and bushes.
                    - superscript [ref=f26e3085]:
                      - link "[89]" [ref=f26e3086] [cursor=pointer]:
                        - /url: ./Giraffe#cite_note-kingdon-89
                        - generic [ref=f26e3087]: "[89]"
                    - text: Mothers tend to feed in open areas, presumably to make it easier to detect predators, although this may reduce their feeding efficiency.
                    - superscript [ref=f26e3088]:
                      - link "[68]" [ref=f26e3089] [cursor=pointer]:
                        - /url: ./Giraffe#cite_note-sexdiff-68
                        - generic [ref=f26e3090]: "[68]"
                    - text: As a
                    - link "ruminant" [ref=f26e3091] [cursor=pointer]:
                      - /url: ./Ruminant
                    - text: ", the giraffe first chews its food, then swallows it for processing and then visibly passes the half-digested cud up the neck and back into the mouth to chew again."
                    - superscript [ref=f26e3092]:
                      - link "[49]" [ref=f26e3093] [cursor=pointer]:
                        - /url: ./Giraffe#cite_note-anatomy-49
                        - generic [ref=f26e3094]: "[49]"
                    - superscript [ref=f26e3095]:
                      - 'generic "Page / location: 78–79" [ref=f26e3096]': ": 78–79"
                    - text: A giraffe requires less food than many other herbivores because the foliage it eats has more concentrated nutrients and it has a more efficient digestive system.
                    - superscript [ref=f26e3097]:
                      - link "[89]" [ref=f26e3098] [cursor=pointer]:
                        - /url: ./Giraffe#cite_note-kingdon-89
                        - generic [ref=f26e3099]: "[89]"
                    - text: The animal's faeces come in the form of small pellets.
                    - superscript [ref=f26e3100]:
                      - link "[17]" [ref=f26e3101] [cursor=pointer]:
                        - /url: ./Giraffe#cite_note-Dagg1971-17
                        - generic [ref=f26e3102]: "[17]"
                    - text: When it has access to water, a giraffe will go no more than three days without drinking.
                    - superscript [ref=f26e3103]:
                      - link "[43]" [ref=f26e3104] [cursor=pointer]:
                        - /url: ./Giraffe#cite_note-estes-43
                        - generic [ref=f26e3105]: "[43]"
                  - paragraph [ref=f26e3106]:
                    - text: Giraffes have a great effect on the trees that they feed on, delaying the growth of young trees for some years and giving "waistlines" to particularly tall trees. Feeding is at its highest during the first and last hours of daytime. Between these hours, giraffes mostly stand and ruminate. Rumination is the dominant activity during the night, when it is mostly done lying down.
                    - superscript [ref=f26e3107]:
                      - link "[43]" [ref=f26e3108] [cursor=pointer]:
                        - /url: ./Giraffe#cite_note-estes-43
                        - generic [ref=f26e3109]: "[43]"
                - generic [ref=f26e3110]:
                  - heading "Social life" [level=3] [ref=f26e3111]
                  - figure "Gathering of female South African giraffes in Tswalu Kalahari Reserve, South Africa. These animals commonly gather in herds." [ref=f26e3112]:
                    - link "Photograph of a gathering of four female giraffes" [ref=f26e3113] [cursor=pointer]:
                      - /url: ./File:Giraffe_(Giraffa_camelopardalis)_females.jpg
                      - img "Photograph of a gathering of four female giraffes" [ref=f26e3114]
                    - generic [ref=f26e3115]:
                      - text: Gathering of female South African giraffes in
                      - link "Tswalu Kalahari Reserve" [ref=f26e3116] [cursor=pointer]:
                        - /url: ./Tswalu_Kalahari_Reserve
                      - text: ", South Africa. These animals commonly gather in herds."
                  - paragraph [ref=f26e3117]:
                    - text: Giraffes usually form groups that vary in size and composition according to ecological, anthropogenic, temporal, and social factors.
                    - superscript [ref=f26e3118]:
                      - link "[90]" [ref=f26e3119] [cursor=pointer]:
                        - /url: ./Giraffe#cite_note-:5-90
                        - generic [ref=f26e3120]: "[90]"
                    - text: Traditionally, the composition of these groups had been described as open and ever-changing.
                    - superscript [ref=f26e3121]:
                      - link "[91]" [ref=f26e3122] [cursor=pointer]:
                        - /url: ./Giraffe#cite_note-Manyara-91
                        - generic [ref=f26e3123]: "[91]"
                    - text: For research purposes, a "group" has been defined as "a collection of individuals that are less than a kilometre apart and moving in the same general direction".
                    - superscript [ref=f26e3124]:
                      - link "[92]" [ref=f26e3125] [cursor=pointer]:
                        - /url: ./Giraffe#cite_note-Pratt_1985-92
                        - generic [ref=f26e3126]: "[92]"
                    - text: More recent studies have found that giraffes have long-lasting social groups or cliques based on kinship, sex or other factors, and these groups regularly associate with other groups in larger communities or sub-communities within a
                    - link "fission–fusion society" [ref=f26e3127] [cursor=pointer]:
                      - /url: ./Fission–fusion_society
                    - text: .
                    - superscript [ref=f26e3128]:
                      - link "[93]" [ref=f26e3129] [cursor=pointer]:
                        - /url: ./Giraffe#cite_note-:7-93
                        - generic [ref=f26e3130]: "[93]"
                    - superscript [ref=f26e3131]:
                      - link "[94]" [ref=f26e3132] [cursor=pointer]:
                        - /url: ./Giraffe#cite_note-Bercovitch_2013-94
                        - generic [ref=f26e3133]: "[94]"
                    - superscript [ref=f26e3134]:
                      - link "[95]" [ref=f26e3135] [cursor=pointer]:
                        - /url: ./Giraffe#cite_note-Carter-95
                        - generic [ref=f26e3136]: "[95]"
                    - superscript [ref=f26e3137]:
                      - link "[96]" [ref=f26e3138] [cursor=pointer]:
                        - /url: ./Giraffe#cite_note-VanderWaal-96
                        - generic [ref=f26e3139]: "[96]"
                    - text: Proximity to humans can disrupt social arrangements.
                    - superscript [ref=f26e3140]:
                      - link "[93]" [ref=f26e3141] [cursor=pointer]:
                        - /url: ./Giraffe#cite_note-:7-93
                        - generic [ref=f26e3142]: "[93]"
                    - text: Masai giraffes in Tanzania sort themselves into different subpopulations of 60–90 adult females with overlapping ranges, each of which differ in reproductive rates and calf mortality.
                    - superscript [ref=f26e3143]:
                      - link "[97]" [ref=f26e3144] [cursor=pointer]:
                        - /url: ./Giraffe#cite_note-:9-97
                        - generic [ref=f26e3145]: "[97]"
                    - link "Dispersal" [ref=f26e3146] [cursor=pointer]:
                      - /url: ./Biological_dispersal
                    - text: is male biased, and can include spatial and/or social dispersal.
                    - superscript [ref=f26e3147]:
                      - link "[98]" [ref=f26e3148] [cursor=pointer]:
                        - /url: ./Giraffe#cite_note-98
                        - generic [ref=f26e3149]: "[98]"
                    - text: Adult female subpopulations are connected by males into super communities of around 300 animals.
                    - superscript [ref=f26e3150]:
                      - link "[99]" [ref=f26e3151] [cursor=pointer]:
                        - /url: ./Giraffe#cite_note-99
                        - generic [ref=f26e3152]: "[99]"
                  - paragraph [ref=f26e3153]:
                    - text: The number of giraffes in a group can range from one up to 66 individuals.
                    - superscript [ref=f26e3154]:
                      - link "[90]" [ref=f26e3155] [cursor=pointer]:
                        - /url: ./Giraffe#cite_note-:5-90
                        - generic [ref=f26e3156]: "[90]"
                    - superscript [ref=f26e3157]:
                      - link "[96]" [ref=f26e3158] [cursor=pointer]:
                        - /url: ./Giraffe#cite_note-VanderWaal-96
                        - generic [ref=f26e3159]: "[96]"
                    - text: Giraffe groups tend to be sex-segregated
                    - superscript [ref=f26e3160]:
                      - link "[96]" [ref=f26e3161] [cursor=pointer]:
                        - /url: ./Giraffe#cite_note-VanderWaal-96
                        - generic [ref=f26e3162]: "[96]"
                    - text: although mixed-sex groups made of adult females and young males also occur.
                    - superscript [ref=f26e3163]:
                      - link "[92]" [ref=f26e3164] [cursor=pointer]:
                        - /url: ./Giraffe#cite_note-Pratt_1985-92
                        - generic [ref=f26e3165]: "[92]"
                    - text: Female groups may be
                    - link "matrilineally" [ref=f26e3166] [cursor=pointer]:
                      - /url: ./Matrilineally
                    - text: related.
                    - superscript [ref=f26e3167]:
                      - link "[96]" [ref=f26e3168] [cursor=pointer]:
                        - /url: ./Giraffe#cite_note-VanderWaal-96
                        - generic [ref=f26e3169]: "[96]"
                    - text: Generally, females are more selective than males when deciding which individuals of the same sex they associate with.
                    - superscript [ref=f26e3170]:
                      - link "[95]" [ref=f26e3171] [cursor=pointer]:
                        - /url: ./Giraffe#cite_note-Carter-95
                        - generic [ref=f26e3172]: "[95]"
                    - text: Particularly stable giraffe groups are those made of mothers and their young,
                    - superscript [ref=f26e3173]:
                      - link "[92]" [ref=f26e3174] [cursor=pointer]:
                        - /url: ./Giraffe#cite_note-Pratt_1985-92
                        - generic [ref=f26e3175]: "[92]"
                    - text: which can last weeks or months.
                    - superscript [ref=f26e3176]:
                      - link "[100]" [ref=f26e3177] [cursor=pointer]:
                        - /url: ./Giraffe#cite_note-Leuthold_1979-100
                        - generic [ref=f26e3178]: "[100]"
                    - text: Young males also form groups and will engage in playfights. However, as they get older, males become more solitary but may also associate in pairs or with female groups.
                    - superscript [ref=f26e3179]:
                      - link "[96]" [ref=f26e3180] [cursor=pointer]:
                        - /url: ./Giraffe#cite_note-VanderWaal-96
                        - generic [ref=f26e3181]: "[96]"
                    - superscript [ref=f26e3182]:
                      - link "[100]" [ref=f26e3183] [cursor=pointer]:
                        - /url: ./Giraffe#cite_note-Leuthold_1979-100
                        - generic [ref=f26e3184]: "[100]"
                    - text: Giraffes are not
                    - link "territorial" [ref=f26e3185] [cursor=pointer]:
                      - /url: ./Territory_(animal)
                    - text: ","
                    - superscript [ref=f26e3186]:
                      - link "[17]" [ref=f26e3187] [cursor=pointer]:
                        - /url: ./Giraffe#cite_note-Dagg1971-17
                        - generic [ref=f26e3188]: "[17]"
                    - text: but they have
                    - link "home ranges" [ref=f26e3189] [cursor=pointer]:
                      - /url: ./Home_range
                    - text: that vary according to rainfall and proximity to human settlements.
                    - superscript [ref=f26e3190]:
                      - link "[101]" [ref=f26e3191] [cursor=pointer]:
                        - /url: ./Giraffe#cite_note-101
                        - generic [ref=f26e3192]: "[101]"
                    - text: Male giraffes occasionally roam far from areas that they normally frequent.
                    - superscript [ref=f26e3193]:
                      - link "[33]" [ref=f26e3194] [cursor=pointer]:
                        - /url: ./Giraffe#cite_note-Kingdon1988-33
                        - generic [ref=f26e3195]: "[33]"
                    - superscript [ref=f26e3196]:
                      - 'generic "Page / location: 329" [ref=f26e3197]': ": 329"
                  - paragraph [ref=f26e3198]:
                    - text: Early biologists suggested giraffes were mute and unable to create enough air flow to vibrate their
                    - link "vocal folds" [ref=f26e3199] [cursor=pointer]:
                      - /url: ./Vocal_fold
                    - text: .
                    - superscript [ref=f26e3200]:
                      - link "[102]" [ref=f26e3201] [cursor=pointer]:
                        - /url: ./Giraffe#cite_note-Kasozi-102
                        - generic [ref=f26e3202]: "[102]"
                    - text: This has been proved to the contrary; they have been recorded to
                    - link "communicate" [ref=f26e3203] [cursor=pointer]:
                      - /url: ./Animal_communication
                    - text: using snorts, sneezes, coughs, snores, hisses, bursts, moans, grunts, growls and flute-like sounds.
                    - superscript [ref=f26e3204]:
                      - link "[43]" [ref=f26e3205] [cursor=pointer]:
                        - /url: ./Giraffe#cite_note-estes-43
                        - generic [ref=f26e3206]: "[43]"
                    - superscript [ref=f26e3207]:
                      - link "[102]" [ref=f26e3208] [cursor=pointer]:
                        - /url: ./Giraffe#cite_note-Kasozi-102
                        - generic [ref=f26e3209]: "[102]"
                    - text: During courtship, males emit loud coughs. Females call their young by bellowing. Calves will emit bleats, mooing and mewing sounds.
                    - superscript [ref=f26e3210]:
                      - link "[43]" [ref=f26e3211] [cursor=pointer]:
                        - /url: ./Giraffe#cite_note-estes-43
                        - generic [ref=f26e3212]: "[43]"
                    - text: Snorting and hissing is associated with vigilance.
                    - superscript [ref=f26e3213]:
                      - link "[103]" [ref=f26e3214] [cursor=pointer]:
                        - /url: ./Giraffe#cite_note-103
                        - generic [ref=f26e3215]: "[103]"
                    - text: During nighttime, giraffes appear to
                    - link "hum" [ref=f26e3216] [cursor=pointer]:
                      - /url: ./Humming
                    - text: to each other.
                    - superscript [ref=f26e3217]:
                      - link "[104]" [ref=f26e3218] [cursor=pointer]:
                        - /url: ./Giraffe#cite_note-hum-104
                        - generic [ref=f26e3219]: "[104]"
                    - text: There is some evidence that giraffes use
                    - link "Helmholtz resonance" [ref=f26e3220] [cursor=pointer]:
                      - /url: ./Helmholtz_resonance
                    - text: to create
                    - link "infrasound" [ref=f26e3221] [cursor=pointer]:
                      - /url: ./Infrasound
                    - text: .
                    - superscript [ref=f26e3222]:
                      - link "[105]" [ref=f26e3223] [cursor=pointer]:
                        - /url: ./Giraffe#cite_note-105
                        - generic [ref=f26e3224]: "[105]"
                    - text: They also communicate with body language.
                    - link "Dominant" [ref=f26e3225] [cursor=pointer]:
                      - /url: ./Dominance_hierarchy
                    - text: males display to other males with an erect posture; holding the chin and head up while walking stiffly and displaying their side. The less dominant show submissiveness by dropping the head and ears, lowering the chin and fleeing.
                    - superscript [ref=f26e3226]:
                      - link "[43]" [ref=f26e3227] [cursor=pointer]:
                        - /url: ./Giraffe#cite_note-estes-43
                        - generic [ref=f26e3228]: "[43]"
                - generic [ref=f26e3229]:
                  - heading "Reproduction and parental care" [level=3] [ref=f26e3230]
                  - figure "Angolan giraffes mating in Namibia" [ref=f26e3231]:
                    - link "Photograph of giraffes mating" [ref=f26e3232] [cursor=pointer]:
                      - /url: ./File:Giraffa_camelopardalis_angolensis_(mating).jpg
                      - img "Photograph of giraffes mating" [ref=f26e3233]
                    - generic [ref=f26e3234]: Angolan giraffes mating in Namibia
                  - paragraph [ref=f26e3235]:
                    - text: Reproduction in giraffes is broadly
                    - link "polygamous" [ref=f26e3236] [cursor=pointer]:
                      - /url: ./Animal_sexual_behaviour#Polygamy
                    - text: ": a few older males mate with the fertile females."
                    - superscript [ref=f26e3237]:
                      - link "[92]" [ref=f26e3238] [cursor=pointer]:
                        - /url: ./Giraffe#cite_note-Pratt_1985-92
                        - generic [ref=f26e3239]: "[92]"
                    - text: Females can reproduce throughout the year and experience
                    - link "oestrus" [ref=f26e3240] [cursor=pointer]:
                      - /url: ./Oestrus
                    - text: cycling approximately every 15 days.
                    - superscript [ref=f26e3241]:
                      - link "[106]" [ref=f26e3242] [cursor=pointer]:
                        - /url: ./Giraffe#cite_note-:8-106
                        - generic [ref=f26e3243]: "[106]"
                    - superscript [ref=f26e3244]:
                      - link "[107]" [ref=f26e3245] [cursor=pointer]:
                        - /url: ./Giraffe#cite_note-107
                        - generic [ref=f26e3246]: "[107]"
                    - text: Female giraffes in oestrus are dispersed over space and time, so reproductive adult males adopt a strategy of roaming among female groups to seek mating opportunities, with periodic hormone-induced rutting behaviour approximately every two weeks.
                    - superscript [ref=f26e3247]:
                      - link "[108]" [ref=f26e3248] [cursor=pointer]:
                        - /url: ./Giraffe#cite_note-108
                        - generic [ref=f26e3249]: "[108]"
                    - text: Males prefer young adult females over juveniles and older adults.
                    - superscript [ref=f26e3250]:
                      - link "[92]" [ref=f26e3251] [cursor=pointer]:
                        - /url: ./Giraffe#cite_note-Pratt_1985-92
                        - generic [ref=f26e3252]: "[92]"
                  - paragraph [ref=f26e3253]:
                    - text: Male giraffes assess female fertility by tasting the female's urine to detect oestrus, in a multi-step process known as the
                    - link "flehmen response" [ref=f26e3254] [cursor=pointer]:
                      - /url: ./Flehmen_response
                    - text: .
                    - superscript [ref=f26e3255]:
                      - link "[92]" [ref=f26e3256] [cursor=pointer]:
                        - /url: ./Giraffe#cite_note-Pratt_1985-92
                        - generic [ref=f26e3257]: "[92]"
                    - superscript [ref=f26e3258]:
                      - link "[100]" [ref=f26e3259] [cursor=pointer]:
                        - /url: ./Giraffe#cite_note-Leuthold_1979-100
                        - generic [ref=f26e3260]: "[100]"
                    - text: Once an oestrous female is detected, the male will attempt to court her. When courting, dominant males will keep subordinate ones at bay.
                    - superscript [ref=f26e3261]:
                      - link "[100]" [ref=f26e3262] [cursor=pointer]:
                        - /url: ./Giraffe#cite_note-Leuthold_1979-100
                        - generic [ref=f26e3263]: "[100]"
                    - text: A courting male may lick a female's tail, lay his head and neck on her body or nudge her with his ossicones. During copulation, the male stands on his hind legs with his head held up and his front legs resting on the female's sides.
                    - superscript [ref=f26e3264]:
                      - link "[43]" [ref=f26e3265] [cursor=pointer]:
                        - /url: ./Giraffe#cite_note-estes-43
                        - generic [ref=f26e3266]: "[43]"
                  - paragraph [ref=f26e3267]:
                    - text: Giraffe
                    - link "gestation" [ref=f26e3268] [cursor=pointer]:
                      - /url: ./Pregnancy_(mammals)
                    - text: lasts 400–460 days, after which a single calf is normally born, although twins occur on rare occasions.
                    - superscript [ref=f26e3269]:
                      - link "[106]" [ref=f26e3270] [cursor=pointer]:
                        - /url: ./Giraffe#cite_note-:8-106
                        - generic [ref=f26e3271]: "[106]"
                    - text: The mother gives birth standing up. The calf emerges head and front legs first, having broken through the
                    - link "fetal membranes" [ref=f26e3272] [cursor=pointer]:
                      - /url: ./Fetal_membrane
                    - text: ", and falls to the ground, severing the"
                    - link "umbilical cord" [ref=f26e3273] [cursor=pointer]:
                      - /url: ./Umbilical_cord
                    - text: .
                    - superscript [ref=f26e3274]:
                      - link "[17]" [ref=f26e3275] [cursor=pointer]:
                        - /url: ./Giraffe#cite_note-Dagg1971-17
                        - generic [ref=f26e3276]: "[17]"
                    - text: A newborn giraffe is 1.7–2 m (5 ft 7 in – 6 ft 7 in) tall.
                    - superscript [ref=f26e3277]:
                      - link "[47]" [ref=f26e3278] [cursor=pointer]:
                        - /url: ./Giraffe#cite_note-Nowak1999-47
                        - generic [ref=f26e3279]: "[47]"
                    - text: Within a few hours of birth, the calf can run around and is almost indistinguishable from a one-week-old. However, for the first one to three weeks, it spends most of its time hiding,
                    - superscript [ref=f26e3280]:
                      - link "[109]" [ref=f26e3281] [cursor=pointer]:
                        - /url: ./Giraffe#cite_note-Langman_1977-109
                        - generic [ref=f26e3282]: "[109]"
                    - text: its coat pattern providing camouflage. The ossicones, which have lain flat in the womb, raise up in a few days.
                    - superscript [ref=f26e3283]:
                      - link "[43]" [ref=f26e3284] [cursor=pointer]:
                        - /url: ./Giraffe#cite_note-estes-43
                        - generic [ref=f26e3285]: "[43]"
                  - figure "Female Angolan giraffe with calf" [ref=f26e3286]:
                    - link "A female giraffe with her calf" [ref=f26e3287] [cursor=pointer]:
                      - /url: ./File:Angolan_giraffe_(Giraffa_camelopardalis_angolensis)_female_with_young_2_months.jpg
                      - img "A female giraffe with her calf" [ref=f26e3288]
                    - generic [ref=f26e3289]: Female Angolan giraffe with calf
                  - paragraph [ref=f26e3290]:
                    - text: Mothers with calves will gather in nursery herds, moving or browsing together. Mothers in such a group may sometimes leave their calves with one female while they forage and drink elsewhere. This is known as a "
                    - link "calving pool" [ref=f26e3291] [cursor=pointer]:
                      - /url: ./Crèche_(zoology)
                    - text: "\"."
                    - superscript [ref=f26e3292]:
                      - link "[109]" [ref=f26e3293] [cursor=pointer]:
                        - /url: ./Giraffe#cite_note-Langman_1977-109
                        - generic [ref=f26e3294]: "[109]"
                    - text: Calves are at risk of predation, and a mother giraffe will stand over them and kick at an approaching predator.
                    - superscript [ref=f26e3295]:
                      - link "[43]" [ref=f26e3296] [cursor=pointer]:
                        - /url: ./Giraffe#cite_note-estes-43
                        - generic [ref=f26e3297]: "[43]"
                    - text: Females watching calving pools will only alert their own young if they detect a disturbance, although the others will take notice and follow.
                    - superscript [ref=f26e3298]:
                      - link "[109]" [ref=f26e3299] [cursor=pointer]:
                        - /url: ./Giraffe#cite_note-Langman_1977-109
                        - generic [ref=f26e3300]: "[109]"
                    - text: Allo-sucking, where a calf will suckle a female other than its mother, has been recorded in both wild and captive giraffes.
                    - superscript [ref=f26e3301]:
                      - link "[110]" [ref=f26e3302] [cursor=pointer]:
                        - /url: ./Giraffe#cite_note-110
                        - generic [ref=f26e3303]: "[110]"
                    - superscript [ref=f26e3304]:
                      - link "[111]" [ref=f26e3305] [cursor=pointer]:
                        - /url: ./Giraffe#cite_note-111
                        - generic [ref=f26e3306]: "[111]"
                    - text: Calves first ruminate at four to six months and stop
                    - link "nursing" [ref=f26e3307] [cursor=pointer]:
                      - /url: ./Lactation
                    - text: at six to eight months. Young may not reach independence until they are 14 months old.
                    - superscript [ref=f26e3308]:
                      - link "[51]" [ref=f26e3309] [cursor=pointer]:
                        - /url: ./Giraffe#cite_note-Dagg2014-51
                        - generic [ref=f26e3310]: "[51]"
                    - superscript [ref=f26e3311]:
                      - 'generic "Page / location: 49" [ref=f26e3312]': ": 49"
                    - text: Females are able to reproduce at four years of age,
                    - superscript [ref=f26e3313]:
                      - link "[43]" [ref=f26e3314] [cursor=pointer]:
                        - /url: ./Giraffe#cite_note-estes-43
                        - generic [ref=f26e3315]: "[43]"
                    - text: while
                    - link "spermatogenesis" [ref=f26e3316] [cursor=pointer]:
                      - /url: ./Spermatogenesis
                    - text: in males begins at three to four years of age.
                    - superscript [ref=f26e3317]:
                      - link "[112]" [ref=f26e3318] [cursor=pointer]:
                        - /url: ./Giraffe#cite_note-112
                        - generic [ref=f26e3319]: "[112]"
                    - text: Males must wait until they are at least seven years old to gain the opportunity to mate.
                    - superscript [ref=f26e3320]:
                      - link "[43]" [ref=f26e3321] [cursor=pointer]:
                        - /url: ./Giraffe#cite_note-estes-43
                        - generic [ref=f26e3322]: "[43]"
                - generic [ref=f26e3323]:
                  - heading "Necking" [level=3] [ref=f26e3324]
                  - figure "Here, male South African giraffes engage in low intensity necking to establish dominance, in Ithala Game Reserve, Kwa-Zulu-Natal, South Africa." [ref=f26e3325]:
                    - link "Photograph of two male giraffes necking to establish dominance" [ref=f26e3326] [cursor=pointer]:
                      - /url: ./File:Giraffe_Ithala_KZN_South_Africa_Luca_Galuzzi_2004.JPG
                      - img "Photograph of two male giraffes necking to establish dominance" [ref=f26e3327]
                    - generic [ref=f26e3328]:
                      - text: Here, male South African giraffes engage in low intensity necking to establish dominance, in
                      - link "Ithala Game Reserve" [ref=f26e3329] [cursor=pointer]:
                        - /url: ./Ithala_Game_Reserve
                      - text: ","
                      - link "Kwa-Zulu-Natal" [ref=f26e3330] [cursor=pointer]:
                        - /url: ./KwaZulu-Natal
                      - text: ", South Africa."
                  - paragraph [ref=f26e3331]:
                    - text: Male giraffes use their necks as
                    - link "weapons" [ref=f26e3332] [cursor=pointer]:
                      - /url: ./Weapon_(biology)
                    - text: in combat, a behaviour known as "necking". Necking is used to establish dominance, and males that win necking bouts have greater
                    - link "reproductive success" [ref=f26e3333] [cursor=pointer]:
                      - /url: ./Reproductive_success
                    - text: .
                    - superscript [ref=f26e3334]:
                      - link "[10]" [ref=f26e3335] [cursor=pointer]:
                        - /url: ./Giraffe#cite_note-sim1996-10
                        - generic [ref=f26e3336]: "[10]"
                    - text: This behaviour occurs at low or high intensity. In low-intensity necking, the combatants rub and lean on each other. The male that can keep itself more upright wins the bout. In high-intensity necking, the combatants will spread their front legs and swing their necks at each other, attempting to land blows with their ossicones. The contestants will try to dodge each other's blows and then prepare to counter. The power of a blow depends on the weight of the skull and the arc of the swing.
                    - superscript [ref=f26e3337]:
                      - link "[43]" [ref=f26e3338] [cursor=pointer]:
                        - /url: ./Giraffe#cite_note-estes-43
                        - generic [ref=f26e3339]: "[43]"
                    - text: A necking duel can last more than half an hour, depending on how well matched the combatants are.
                    - superscript [ref=f26e3340]:
                      - link "[33]" [ref=f26e3341] [cursor=pointer]:
                        - /url: ./Giraffe#cite_note-Kingdon1988-33
                        - generic [ref=f26e3342]: "[33]"
                    - superscript [ref=f26e3343]:
                      - 'generic "Page / location: 331" [ref=f26e3344]': ": 331"
                    - text: Although most fights do not lead to serious injury, there have been records of broken jaws, broken necks, and even deaths.
                    - superscript [ref=f26e3345]:
                      - link "[10]" [ref=f26e3346] [cursor=pointer]:
                        - /url: ./Giraffe#cite_note-sim1996-10
                        - generic [ref=f26e3347]: "[10]"
                  - paragraph [ref=f26e3348]:
                    - text: After a duel, it is common for two male giraffes to caress and court each other. Such interactions between males have been found to be more frequent than heterosexual coupling.
                    - superscript [ref=f26e3349]:
                      - link "[113]" [ref=f26e3350] [cursor=pointer]:
                        - /url: ./Giraffe#cite_note-113
                        - generic [ref=f26e3351]: "[113]"
                    - text: In one study, up to 94 percent of observed mounting incidents took place between males. The proportion of
                    - link "same-sex activities" [ref=f26e3352] [cursor=pointer]:
                      - /url: ./Homosexual_behavior_in_animals
                    - text: varied from 30 to 75 percent. Only one percent of same-sex mounting incidents occurred between females.
                    - superscript [ref=f26e3353]:
                      - link "[114]" [ref=f26e3354] [cursor=pointer]:
                        - /url: ./Giraffe#cite_note-114
                        - generic [ref=f26e3355]: "[114]"
                - generic [ref=f26e3356]:
                  - heading "Mortality and health" [level=3] [ref=f26e3357]
                  - figure "Lioness seen with an adult Masai giraffe kill" [ref=f26e3358]:
                    - link "Photograph of a lioness with at an adult giraffe kill" [ref=f26e3359] [cursor=pointer]:
                      - /url: ./File:Lioness_with_giraffe_kill,_jackal_lurking,_kenya,_august_9th_2012.jpg
                      - img "Photograph of a lioness with at an adult giraffe kill" [ref=f26e3360]
                    - generic [ref=f26e3361]:
                      - link "Lioness" [ref=f26e3362] [cursor=pointer]:
                        - /url: ./Lion
                      - text: seen with an adult
                      - link "Masai giraffe" [ref=f26e3363] [cursor=pointer]:
                        - /url: ./Masai_giraffe
                      - text: kill
                  - paragraph [ref=f26e3364]:
                    - text: Giraffes have high adult survival probability,
                    - superscript [ref=f26e3365]:
                      - link "[115]" [ref=f26e3366] [cursor=pointer]:
                        - /url: ./Giraffe#cite_note-:0-115
                        - generic [ref=f26e3367]: "[115]"
                    - text: and an unusually long lifespan compared to other ruminants, up to 38 years.
                    - superscript [ref=f26e3368]:
                      - link "[116]" [ref=f26e3369] [cursor=pointer]:
                        - /url: ./Giraffe#cite_note-116
                        - generic [ref=f26e3370]: "[116]"
                    - text: Adult female survival is significantly correlated with the number of social associations.
                    - superscript [ref=f26e3371]:
                      - link "[117]" [ref=f26e3372] [cursor=pointer]:
                        - /url: ./Giraffe#cite_note-117
                        - generic [ref=f26e3373]: "[117]"
                    - text: Because of their size, eyesight and powerful kicks, adult giraffes are mostly safe from predation,
                    - superscript [ref=f26e3374]:
                      - link "[43]" [ref=f26e3375] [cursor=pointer]:
                        - /url: ./Giraffe#cite_note-estes-43
                        - generic [ref=f26e3376]: "[43]"
                    - text: with
                    - link "lions" [ref=f26e3377] [cursor=pointer]:
                      - /url: ./Lion
                    - text: being their only major threats.
                    - superscript [ref=f26e3378]:
                      - link "[51]" [ref=f26e3379] [cursor=pointer]:
                        - /url: ./Giraffe#cite_note-Dagg2014-51
                        - generic [ref=f26e3380]: "[51]"
                    - superscript [ref=f26e3381]:
                      - 'generic "Page / location: 55" [ref=f26e3382]': ": 55"
                    - text: Calves are much more vulnerable than adults and are also preyed on by
                    - link "leopards" [ref=f26e3383] [cursor=pointer]:
                      - /url: ./Leopard
                    - text: ","
                    - link "spotted hyenas" [ref=f26e3384] [cursor=pointer]:
                      - /url: ./Spotted_hyena
                    - text: and
                    - link "wild dogs" [ref=f26e3385] [cursor=pointer]:
                      - /url: ./African_wild_dog
                    - text: .
                    - superscript [ref=f26e3386]:
                      - link "[52]" [ref=f26e3387] [cursor=pointer]:
                        - /url: ./Giraffe#cite_note-Prothero_2003-52
                        - generic [ref=f26e3388]: "[52]"
                    - text: A quarter to a half of giraffe calves reach adulthood.
                    - superscript [ref=f26e3389]:
                      - link "[115]" [ref=f26e3390] [cursor=pointer]:
                        - /url: ./Giraffe#cite_note-:0-115
                        - generic [ref=f26e3391]: "[115]"
                    - superscript [ref=f26e3392]:
                      - link "[118]" [ref=f26e3393] [cursor=pointer]:
                        - /url: ./Giraffe#cite_note-118
                        - generic [ref=f26e3394]: "[118]"
                    - text: Calf survival varies according to the season of birth, with calves born during the
                    - link "dry season" [ref=f26e3395] [cursor=pointer]:
                      - /url: ./Dry_season
                    - text: having higher survival rates.
                    - superscript [ref=f26e3396]:
                      - link "[119]" [ref=f26e3397] [cursor=pointer]:
                        - /url: ./Giraffe#cite_note-119
                        - generic [ref=f26e3398]: "[119]"
                  - paragraph [ref=f26e3399]:
                    - text: The local, seasonal presence of large herds of migratory
                    - link "wildebeests" [ref=f26e3400] [cursor=pointer]:
                      - /url: ./Wildebeest
                    - text: and
                    - link "zebras" [ref=f26e3401] [cursor=pointer]:
                      - /url: ./Zebra
                    - text: reduces predation pressure on giraffe calves and increases their survival probability.
                    - superscript [ref=f26e3402]:
                      - link "[120]" [ref=f26e3403] [cursor=pointer]:
                        - /url: ./Giraffe#cite_note-120
                        - generic [ref=f26e3404]: "[120]"
                    - text: In turn, it has been suggested that other ungulates may benefit from associating with giraffes, as their height allows them to spot predators from further away. Zebras were found to assess predation risk by watching giraffes and spend less time looking around when giraffes are present.
                    - superscript [ref=f26e3405]:
                      - link "[121]" [ref=f26e3406] [cursor=pointer]:
                        - /url: ./Giraffe#cite_note-121
                        - generic [ref=f26e3407]: "[121]"
                  - figure "Red-billed oxpeckers on a giraffe, Zambia" [ref=f26e3408]:
                    - link [ref=f26e3409] [cursor=pointer]:
                      - /url: ./File:Giraffe_Oxpeckers_Lupande_Zambia_Jul23_A7R_06194.jpg
                      - img [ref=f26e3410]
                    - generic [ref=f26e3411]: Red-billed oxpeckers on a giraffe, Zambia
                  - paragraph [ref=f26e3412]:
                    - text: Some parasites feed on giraffes. They are often
                    - link "hosts" [ref=f26e3413] [cursor=pointer]:
                      - /url: ./Host_(biology)
                    - text: for
                    - link "ticks" [ref=f26e3414] [cursor=pointer]:
                      - /url: ./Tick
                    - text: ", especially in the area around the genitals, which have thinner skin than other areas. Tick species that commonly feed on giraffes are those of genera"
                    - link "Hyalomma" [ref=f26e3416] [cursor=pointer]:
                      - /url: ./Hyalomma
                    - text: ","
                    - link "Amblyomma" [ref=f26e3418] [cursor=pointer]:
                      - /url: ./Amblyomma
                    - text: and
                    - link "Rhipicephalus" [ref=f26e3420] [cursor=pointer]:
                      - /url: ./Rhipicephalus
                    - text: .
                    - link "Red-billed" [ref=f26e3421] [cursor=pointer]:
                      - /url: ./Red-billed_Oxpecker
                    - text: and
                    - link "yellow-billed oxpeckers" [ref=f26e3422] [cursor=pointer]:
                      - /url: ./Yellow-billed_oxpecker
                    - text: clean giraffes of ticks and alert them to danger. Giraffes host numerous species of internal parasites and are susceptible to various diseases. They were victims of the (now eradicated) viral illness
                    - link "rinderpest" [ref=f26e3423] [cursor=pointer]:
                      - /url: ./Rinderpest
                    - text: .
                    - superscript [ref=f26e3424]:
                      - link "[17]" [ref=f26e3425] [cursor=pointer]:
                        - /url: ./Giraffe#cite_note-Dagg1971-17
                        - generic [ref=f26e3426]: "[17]"
                    - text: Giraffes can also suffer from a skin disorder, which comes in the form of wrinkles,
                    - link "lesions" [ref=f26e3427] [cursor=pointer]:
                      - /url: ./Cutaneous_condition#Lesions
                    - text: or raw
                    - link "fissures" [ref=f26e3428] [cursor=pointer]:
                      - /url: ./Skin_fissure
                    - text: . As much as 79% of giraffes have symptoms of the disease in
                    - link "Ruaha National Park" [ref=f26e3429] [cursor=pointer]:
                      - /url: ./Ruaha_National_Park
                    - text: ", but it did not cause mortality in"
                    - link "Tarangire" [ref=f26e3430] [cursor=pointer]:
                      - /url: ./Tarangire_National_Park
                    - text: and is less prevalent in areas with fertile soils.
                    - superscript [ref=f26e3431]:
                      - link "[122]" [ref=f26e3432] [cursor=pointer]:
                        - /url: ./Giraffe#cite_note-122
                        - generic [ref=f26e3433]: "[122]"
                    - superscript [ref=f26e3434]:
                      - link "[123]" [ref=f26e3435] [cursor=pointer]:
                        - /url: ./Giraffe#cite_note-123
                        - generic [ref=f26e3436]: "[123]"
                    - superscript [ref=f26e3437]:
                      - link "[124]" [ref=f26e3438] [cursor=pointer]:
                        - /url: ./Giraffe#cite_note-124
                        - generic [ref=f26e3439]: "[124]"
              - generic [ref=f26e3440]:
                - heading "Human relations" [level=2] [ref=f26e3441]
                - generic [ref=f26e3442]:
                  - heading "Cultural significance" [level=3] [ref=f26e3443]
                  - paragraph [ref=f26e3444]:
                    - text: With its lanky build and spotted coat, the giraffe has been a source of fascination throughout human history, and its image is widespread in culture. It has represented flexibility, far-sightedness, femininity, fragility, passivity, grace, beauty and the continent of Africa itself.
                    - superscript [ref=f26e3445]:
                      - link "[125]" [ref=f26e3446] [cursor=pointer]:
                        - /url: ./Giraffe#cite_note-Williams-125
                        - generic [ref=f26e3447]: "[125]"
                    - superscript [ref=f26e3448]:
                      - 'generic "Page / location: 7, 116" [ref=f26e3449]': ": 7, 116"
                  - figure "San rock art in Namibia depicting a giraffe" [ref=f26e3450]:
                    - link "Photograph of a giraffe painted on a rock face" [ref=f26e3451] [cursor=pointer]:
                      - /url: ./File:Giraffe_cave_art.jpg
                      - img "Photograph of a giraffe painted on a rock face" [ref=f26e3452]
                    - generic [ref=f26e3453]:
                      - link "San rock art" [ref=f26e3454] [cursor=pointer]:
                        - /url: ./San_rock_art
                      - text: in Namibia depicting a giraffe
                  - paragraph [ref=f26e3455]:
                    - text: Giraffes were depicted in art throughout the African continent.
                    - superscript [ref=f26e3456]:
                      - link "[125]" [ref=f26e3457] [cursor=pointer]:
                        - /url: ./Giraffe#cite_note-Williams-125
                        - generic [ref=f26e3458]: "[125]"
                    - superscript [ref=f26e3459]:
                      - 'generic "Page / location: 45–47" [ref=f26e3460]': ": 45–47"
                    - text: The
                    - link "Kiffians" [ref=f26e3461] [cursor=pointer]:
                      - /url: ./Kiffian_culture
                    - text: were responsible for a life-size rock engraving of two giraffes, dated 8,000 years ago, that has been called the "world's largest rock art petroglyph".
                    - superscript [ref=f26e3462]:
                      - link "[125]" [ref=f26e3463] [cursor=pointer]:
                        - /url: ./Giraffe#cite_note-Williams-125
                        - generic [ref=f26e3464]: "[125]"
                    - superscript [ref=f26e3465]:
                      - 'generic "Page / location: 45" [ref=f26e3466]': ": 45"
                    - superscript [ref=f26e3467]:
                      - link "[126]" [ref=f26e3468] [cursor=pointer]:
                        - /url: ./Giraffe#cite_note-126
                        - generic [ref=f26e3469]: "[126]"
                    - text: Judging from evidence including incised clay pots, archaeologists now believe that, in the ancient
                    - link "Kushite" [ref=f26e3470] [cursor=pointer]:
                      - /url: ./Kingdom_of_Kush
                    - text: societies located in
                    - link "Nubia" [ref=f26e3471] [cursor=pointer]:
                      - /url: ./Nubia
                    - text: ", or what is now northern Sudan, giraffes may have featured in popular religion and women's religion, though not in elite or royal religion, and may have also had a connection to beliefs about the sun."
                    - superscript [ref=f26e3472]:
                      - link "[127]" [ref=f26e3473] [cursor=pointer]:
                        - /url: ./Giraffe#cite_note-127
                        - generic [ref=f26e3474]: "[127]"
                    - text: The
                    - link "Tugen people" [ref=f26e3475] [cursor=pointer]:
                      - /url: ./Tugen_people
                    - text: of modern Kenya used the giraffe to depict their god Mda.
                    - superscript [ref=f26e3476]:
                      - link "[128]" [ref=f26e3477] [cursor=pointer]:
                        - /url: ./Giraffe#cite_note-128
                        - generic [ref=f26e3478]: "[128]"
                    - text: The
                    - link "Egyptians" [ref=f26e3479] [cursor=pointer]:
                      - /url: ./Ancient_Egypt
                    - text: gave the giraffe its own
                    - link "hieroglyph" [ref=f26e3480] [cursor=pointer]:
                      - /url: ./Egyptian_hieroglyphs
                    - text: ; 'sr' in
                    - link "Old Egyptian" [ref=f26e3481] [cursor=pointer]:
                      - /url: ./Old_Egyptian_language
                    - text: and 'mmy' in later periods.
                    - superscript [ref=f26e3482]:
                      - link "[125]" [ref=f26e3483] [cursor=pointer]:
                        - /url: ./Giraffe#cite_note-Williams-125
                        - generic [ref=f26e3484]: "[125]"
                    - superscript [ref=f26e3485]:
                      - 'generic "Page / location: 49" [ref=f26e3486]': ": 49"
                    - text: How the giraffe got its height has been the subject of various
                    - link "African folktales" [ref=f26e3487] [cursor=pointer]:
                      - /url: ./Culture_of_Africa#Folklore_and_religion
                    - text: .
                    - superscript [ref=f26e3488]:
                      - link "[10]" [ref=f26e3489] [cursor=pointer]:
                        - /url: ./Giraffe#cite_note-sim1996-10
                        - generic [ref=f26e3490]: "[10]"
                  - paragraph [ref=f26e3491]:
                    - text: Giraffes have a presence in modern
                    - link "Western culture" [ref=f26e3492] [cursor=pointer]:
                      - /url: ./Western_culture
                    - text: .
                    - link "Salvador Dalí" [ref=f26e3493] [cursor=pointer]:
                      - /url: ./Salvador_Dalí
                    - text: depicted them with burning manes in some surrealist paintings. Dali considered the giraffe to be a masculine symbol. A flaming giraffe was meant to be a "masculine cosmic apocalyptic monster".
                    - superscript [ref=f26e3494]:
                      - link "[125]" [ref=f26e3495] [cursor=pointer]:
                        - /url: ./Giraffe#cite_note-Williams-125
                        - generic [ref=f26e3496]: "[125]"
                    - superscript [ref=f26e3497]:
                      - 'generic "Page / location: 123" [ref=f26e3498]': ": 123"
                    - text: Several children's books feature the giraffe, including David A. Ufer's The Giraffe Who Was Afraid of Heights,
                    - link "Giles Andreae" [ref=f26e3499] [cursor=pointer]:
                      - /url: ./Giles_Andreae
                    - text: "'s Giraffes Can't Dance and"
                    - link "Roald Dahl" [ref=f26e3500] [cursor=pointer]:
                      - /url: ./Roald_Dahl
                    - text: "'s"
                    - link "The Giraffe and the Pelly and Me" [ref=f26e3502] [cursor=pointer]:
                      - /url: ./The_Giraffe_and_the_Pelly_and_Me
                    - text: . Giraffes have appeared in animated films as minor characters in
                    - link "Disney" [ref=f26e3503] [cursor=pointer]:
                      - /url: ./Disney
                    - text: "'s"
                    - link "Dumbo" [ref=f26e3505] [cursor=pointer]:
                      - /url: ./Dumbo
                    - text: and
                    - link "The Lion King" [ref=f26e3507] [cursor=pointer]:
                      - /url: ./The_Lion_King
                    - text: ", and in more prominent roles in"
                    - link "The Wild" [ref=f26e3509] [cursor=pointer]:
                      - /url: ./The_Wild
                    - text: and the
                    - link "Madagascar" [ref=f26e3511] [cursor=pointer]:
                      - /url: ./Madagascar_(franchise)
                    - text: films.
                    - link "Sophie the Giraffe" [ref=f26e3512] [cursor=pointer]:
                      - /url: ./Sophie_the_Giraffe
                    - text: has been a popular
                    - link "teether" [ref=f26e3513] [cursor=pointer]:
                      - /url: ./Teether
                    - text: since 1961. Another famous fictional giraffe is the Toys "R" Us mascot
                    - link "Geoffrey the Giraffe" [ref=f26e3514] [cursor=pointer]:
                      - /url: ./Geoffrey_the_Giraffe
                    - text: .
                    - superscript [ref=f26e3515]:
                      - link "[125]" [ref=f26e3516] [cursor=pointer]:
                        - /url: ./Giraffe#cite_note-Williams-125
                        - generic [ref=f26e3517]: "[125]"
                    - superscript [ref=f26e3518]:
                      - 'generic "Page / location: 127" [ref=f26e3519]': ": 127"
                  - paragraph [ref=f26e3520]:
                    - text: The giraffe has also been used for some scientific experiments and discoveries. Scientists have used the properties of giraffe skin as a model for
                    - link "astronaut" [ref=f26e3521] [cursor=pointer]:
                      - /url: ./Space_suit
                    - text: and
                    - link "fighter pilot suits" [ref=f26e3522] [cursor=pointer]:
                      - /url: ./Flight_suit
                    - text: because the people in these professions are in danger of passing out if blood rushes to their legs.
                    - superscript [ref=f26e3523]:
                      - link "[49]" [ref=f26e3524] [cursor=pointer]:
                        - /url: ./Giraffe#cite_note-anatomy-49
                        - generic [ref=f26e3525]: "[49]"
                    - superscript [ref=f26e3526]:
                      - 'generic "Page / location: 76" [ref=f26e3527]': ": 76"
                    - text: Computer scientists have modeled the coat patterns of several subspecies using
                    - link "reaction–diffusion" [ref=f26e3528] [cursor=pointer]:
                      - /url: ./Reaction–diffusion
                    - text: mechanisms.
                    - superscript [ref=f26e3529]:
                      - link "[129]" [ref=f26e3530] [cursor=pointer]:
                        - /url: ./Giraffe#cite_note-129
                        - generic [ref=f26e3531]: "[129]"
                    - text: The
                    - link "constellation" [ref=f26e3532] [cursor=pointer]:
                      - /url: ./Constellation
                    - text: of
                    - link "Camelopardalis" [ref=f26e3533] [cursor=pointer]:
                      - /url: ./Camelopardalis
                    - text: ", introduced in the 17th century, depicts a giraffe."
                    - superscript [ref=f26e3534]:
                      - link "[125]" [ref=f26e3535] [cursor=pointer]:
                        - /url: ./Giraffe#cite_note-Williams-125
                        - generic [ref=f26e3536]: "[125]"
                    - superscript [ref=f26e3537]:
                      - 'generic "Page / location: 119–20" [ref=f26e3538]': ": 119–20"
                    - text: The
                    - link "Tswana people" [ref=f26e3539] [cursor=pointer]:
                      - /url: ./Tswana_people
                    - text: of Botswana traditionally see the constellation
                    - link "Crux" [ref=f26e3540] [cursor=pointer]:
                      - /url: ./Crux
                    - text: as two giraffes—
                    - link "Acrux" [ref=f26e3541] [cursor=pointer]:
                      - /url: ./Acrux
                    - text: and
                    - link "Mimosa" [ref=f26e3542] [cursor=pointer]:
                      - /url: ./Beta_Crucis
                    - text: forming a male, and
                    - link "Gacrux" [ref=f26e3543] [cursor=pointer]:
                      - /url: ./Gacrux
                    - text: and
                    - link "Delta Crucis" [ref=f26e3544] [cursor=pointer]:
                      - /url: ./Delta_Crucis
                    - text: forming the female.
                    - superscript [ref=f26e3545]:
                      - link "[130]" [ref=f26e3546] [cursor=pointer]:
                        - /url: ./Giraffe#cite_note-130
                        - generic [ref=f26e3547]: "[130]"
                  - figure "Painting of a giraffe imported to China during the Ming dynasty, in which it was identified with the mythological Qilin" [ref=f26e3548]:
                    - link "Photograph of a painting of a giraffe and a man holding its leash" [ref=f26e3549] [cursor=pointer]:
                      - /url: ./File:Tribute_Giraffe_with_Attendant.jpg
                      - img "Photograph of a painting of a giraffe and a man holding its leash" [ref=f26e3550]
                    - generic [ref=f26e3551]:
                      - text: Painting of a giraffe imported to China during the
                      - link "Ming dynasty" [ref=f26e3552] [cursor=pointer]:
                        - /url: ./Ming_dynasty
                      - text: ", in which it was identified with the mythological"
                      - link "Qilin" [ref=f26e3553] [cursor=pointer]:
                        - /url: ./Qilin
                - generic [ref=f26e3554]:
                  - heading "Captivity" [level=3] [ref=f26e3555]
                  - paragraph [ref=f26e3556]:
                    - text: The Egyptians were among the earliest people to keep giraffes in captivity and shipped them around the Mediterranean.
                    - superscript [ref=f26e3557]:
                      - link "[125]" [ref=f26e3558] [cursor=pointer]:
                        - /url: ./Giraffe#cite_note-Williams-125
                        - generic [ref=f26e3559]: "[125]"
                    - superscript [ref=f26e3560]:
                      - 'generic "Page / location: 48–49" [ref=f26e3561]': ": 48–49"
                    - text: The giraffe was among the many animals collected and
                    - link "displayed" [ref=f26e3562] [cursor=pointer]:
                      - /url: ./Mosaic_Fragment_with_Man_Leading_a_Giraffe_(Art_Institute_of_Chicago)
                    - text: by the Romans. The first one in Rome was brought in by
                    - link "Julius Caesar" [ref=f26e3563] [cursor=pointer]:
                      - /url: ./Julius_Caesar
                    - text: in 46 BC.
                    - superscript [ref=f26e3564]:
                      - link "[125]" [ref=f26e3565] [cursor=pointer]:
                        - /url: ./Giraffe#cite_note-Williams-125
                        - generic [ref=f26e3566]: "[125]"
                    - superscript [ref=f26e3567]:
                      - 'generic "Page / location: 52" [ref=f26e3568]': ": 52"
                    - text: With the
                    - link "fall of the Western Roman Empire" [ref=f26e3569] [cursor=pointer]:
                      - /url: ./Fall_of_the_Western_Roman_Empire
                    - text: ", the housing of giraffes in Europe declined."
                    - superscript [ref=f26e3570]:
                      - link "[125]" [ref=f26e3571] [cursor=pointer]:
                        - /url: ./Giraffe#cite_note-Williams-125
                        - generic [ref=f26e3572]: "[125]"
                    - superscript [ref=f26e3573]:
                      - 'generic "Page / location: 54" [ref=f26e3574]': ": 54"
                    - text: During the
                    - link "Middle Ages" [ref=f26e3575] [cursor=pointer]:
                      - /url: ./Middle_Ages
                    - text: ", giraffes were known to Europeans through contact with the Arabs, who revered the giraffe for its peculiar appearance."
                    - superscript [ref=f26e3576]:
                      - link "[52]" [ref=f26e3577] [cursor=pointer]:
                        - /url: ./Giraffe#cite_note-Prothero_2003-52
                        - generic [ref=f26e3578]: "[52]"
                  - paragraph [ref=f26e3579]:
                    - text: Individual captive giraffes were given celebrity status throughout history. In 1414, a giraffe from
                    - link "Malindi" [ref=f26e3580] [cursor=pointer]:
                      - /url: ./Malindi
                    - text: was
                    - link "taken to China" [ref=f26e3581] [cursor=pointer]:
                      - /url: ./Treasure_voyages
                    - text: by explorer
                    - link "Zheng He" [ref=f26e3582] [cursor=pointer]:
                      - /url: ./Zheng_He
                    - text: and placed in a
                    - link "Ming dynasty" [ref=f26e3583] [cursor=pointer]:
                      - /url: ./Ming_dynasty
                    - text: zoo. The animal was a source of fascination for the Chinese people, who associated it with the mythical
                    - link "Qilin" [ref=f26e3584] [cursor=pointer]:
                      - /url: ./Qilin
                    - text: .
                    - superscript [ref=f26e3585]:
                      - link "[125]" [ref=f26e3586] [cursor=pointer]:
                        - /url: ./Giraffe#cite_note-Williams-125
                        - generic [ref=f26e3587]: "[125]"
                    - superscript [ref=f26e3588]:
                      - 'generic "Page / location: 56" [ref=f26e3589]': ": 56"
                    - text: The
                    - link "Medici giraffe" [ref=f26e3590] [cursor=pointer]:
                      - /url: ./Medici_giraffe
                    - text: was a giraffe presented to
                    - link "Lorenzo de' Medici" [ref=f26e3591] [cursor=pointer]:
                      - /url: ./Lorenzo_de'_Medici
                    - text: in 1486. It caused a great stir on its arrival in
                    - link "Florence" [ref=f26e3592] [cursor=pointer]:
                      - /url: ./Florence
                    - text: .
                    - superscript [ref=f26e3593]:
                      - link "[131]" [ref=f26e3594] [cursor=pointer]:
                        - /url: ./Giraffe#cite_note-131
                        - generic [ref=f26e3595]: "[131]"
                    - link "Zarafa" [ref=f26e3596] [cursor=pointer]:
                      - /url: ./Zarafa_(giraffe)
                    - text: ", another famous giraffe, was brought from"
                    - link "Egypt" [ref=f26e3597] [cursor=pointer]:
                      - /url: ./History_of_Egypt_under_the_Muhammad_Ali_dynasty
                    - text: to Paris in the early 19th century as a gift for
                    - link "Charles X of France" [ref=f26e3598] [cursor=pointer]:
                      - /url: ./Charles_X_of_France
                    - text: . A sensation, the giraffe was the subject of numerous memorabilia or "giraffanalia".
                    - superscript [ref=f26e3599]:
                      - link "[125]" [ref=f26e3600] [cursor=pointer]:
                        - /url: ./Giraffe#cite_note-Williams-125
                        - generic [ref=f26e3601]: "[125]"
                    - superscript [ref=f26e3602]:
                      - 'generic "Page / location: 81" [ref=f26e3603]': ": 81"
                  - paragraph [ref=f26e3604]:
                    - text: Giraffes have become popular attractions in modern
                    - link "zoos" [ref=f26e3605] [cursor=pointer]:
                      - /url: ./Zoo
                    - text: ", though keeping them is difficult as they prefer large areas and need to eat large amounts of browse. Captive giraffes in North America and Europe appear to have a higher mortality rate than in the wild, the most common causes being poor husbandry, nutrition, and management."
                    - superscript [ref=f26e3606]:
                      - link "[51]" [ref=f26e3607] [cursor=pointer]:
                        - /url: ./Giraffe#cite_note-Dagg2014-51
                        - generic [ref=f26e3608]: "[51]"
                    - superscript [ref=f26e3609]:
                      - 'generic "Page / location: 153" [ref=f26e3610]': ": 153"
                    - text: Giraffes in zoos display
                    - link "stereotypical behaviours" [ref=f26e3611] [cursor=pointer]:
                      - /url: ./Stereotypy_(non-human)
                    - text: ", particularly the licking of inanimate objects and pacing."
                    - superscript [ref=f26e3612]:
                      - link "[51]" [ref=f26e3613] [cursor=pointer]:
                        - /url: ./Giraffe#cite_note-Dagg2014-51
                        - generic [ref=f26e3614]: "[51]"
                    - superscript [ref=f26e3615]:
                      - 'generic "Page / location: 164" [ref=f26e3616]': ": 164"
                    - text: Zookeepers may offer various activities to stimulate giraffes, including training them to take food from visitors.
                    - superscript [ref=f26e3617]:
                      - link "[51]" [ref=f26e3618] [cursor=pointer]:
                        - /url: ./Giraffe#cite_note-Dagg2014-51
                        - generic [ref=f26e3619]: "[51]"
                    - superscript [ref=f26e3620]:
                      - 'generic "Page / location: 167, 176" [ref=f26e3621]': ": 167, 176"
                    - link "Stables" [ref=f26e3622] [cursor=pointer]:
                      - /url: ./Stable
                    - text: for giraffes are built particularly high to accommodate their height.
                    - superscript [ref=f26e3623]:
                      - link "[51]" [ref=f26e3624] [cursor=pointer]:
                        - /url: ./Giraffe#cite_note-Dagg2014-51
                        - generic [ref=f26e3625]: "[51]"
                    - superscript [ref=f26e3626]:
                      - 'generic "Page / location: 183" [ref=f26e3627]': ": 183"
                - generic [ref=f26e3628]:
                  - heading "Exploitation" [level=3] [ref=f26e3629]
                  - paragraph [ref=f26e3630]:
                    - text: Giraffes were probably common targets for hunters throughout Africa.
                    - superscript [ref=f26e3631]:
                      - link "[33]" [ref=f26e3632] [cursor=pointer]:
                        - /url: ./Giraffe#cite_note-Kingdon1988-33
                        - generic [ref=f26e3633]: "[33]"
                    - superscript [ref=f26e3634]:
                      - 'generic "Page / location: 337" [ref=f26e3635]': ": 337"
                    - text: Different parts of their bodies were used for different purposes.
                    - superscript [ref=f26e3636]:
                      - link "[17]" [ref=f26e3637] [cursor=pointer]:
                        - /url: ./Giraffe#cite_note-Dagg1971-17
                        - generic [ref=f26e3638]: "[17]"
                    - text: Their meat was used for food. The tail hairs were
                    - link "flyswatters" [ref=f26e3639] [cursor=pointer]:
                      - /url: ./Flyswatter
                    - text: ", bracelets, necklaces, and threads. Shields, sandals, and drums were made using the skin, and the strings of musical instruments were from the tendons."
                    - superscript [ref=f26e3640]:
                      - link "[17]" [ref=f26e3641] [cursor=pointer]:
                        - /url: ./Giraffe#cite_note-Dagg1971-17
                        - generic [ref=f26e3642]: "[17]"
                    - superscript [ref=f26e3643]:
                      - link "[33]" [ref=f26e3644] [cursor=pointer]:
                        - /url: ./Giraffe#cite_note-Kingdon1988-33
                        - generic [ref=f26e3645]: "[33]"
                    - superscript [ref=f26e3646]:
                      - 'generic "Page / location: 337" [ref=f26e3647]': ": 337"
                    - text: In
                    - link "Buganda" [ref=f26e3648] [cursor=pointer]:
                      - /url: ./Buganda
                    - text: ", the smoke of burning giraffe skin was traditionally used to treat nosebleeds."
                    - superscript [ref=f26e3649]:
                      - link "[33]" [ref=f26e3650] [cursor=pointer]:
                        - /url: ./Giraffe#cite_note-Kingdon1988-33
                        - generic [ref=f26e3651]: "[33]"
                    - superscript [ref=f26e3652]:
                      - 'generic "Page / location: 337" [ref=f26e3653]': ": 337"
                    - text: The
                    - link "Humr" [ref=f26e3654] [cursor=pointer]:
                      - /url: ./Humur
                    - text: people of
                    - link "Kordofan" [ref=f26e3655] [cursor=pointer]:
                      - /url: ./Kordofan
                    - text: consume the drink Umm Nyolokh, which is prepared from the
                    - link "liver" [ref=f26e3656] [cursor=pointer]:
                      - /url: ./Liver
                    - text: and
                    - link "bone marrow" [ref=f26e3657] [cursor=pointer]:
                      - /url: ./Bone_marrow
                    - text: of giraffes.
                    - link "Richard Rudgley" [ref=f26e3658] [cursor=pointer]:
                      - /url: ./Richard_Rudgley
                    - text: hypothesised that Umm Nyolokh might contain
                    - link "DMT" [ref=f26e3659] [cursor=pointer]:
                      - /url: ./Dimethyltryptamine
                    - text: .
                    - superscript [ref=f26e3660]:
                      - link "[132]" [ref=f26e3661] [cursor=pointer]:
                        - /url: ./Giraffe#cite_note-132
                        - generic [ref=f26e3662]: "[132]"
                    - text: The drink is said to cause hallucinations of giraffes, believed to be the giraffes' ghosts, by the
                    - link "Humr" [ref=f26e3663] [cursor=pointer]:
                      - /url: ./Humr
                    - text: .
                    - superscript [ref=f26e3664]:
                      - link "[133]" [ref=f26e3665] [cursor=pointer]:
                        - /url: ./Giraffe#cite_note-133
                        - generic [ref=f26e3666]: "[133]"
              - generic [ref=f26e3667]:
                - heading "Conservation status" [level=2] [ref=f26e3668]
                - paragraph [ref=f26e3669]:
                  - text: In 2016, giraffes were assessed as
                  - link "Vulnerable" [ref=f26e3670] [cursor=pointer]:
                    - /url: ./Vulnerable_species
                  - text: from a conservation perspective by the
                  - link "International Union for Conservation of Nature" [ref=f26e3671] [cursor=pointer]:
                    - /url: ./International_Union_for_Conservation_of_Nature
                  - text: (IUCN).
                  - superscript [ref=f26e3672]:
                    - link "[1]" [ref=f26e3673] [cursor=pointer]:
                      - /url: ./Giraffe#cite_note-iucn-1
                      - generic [ref=f26e3674]: "[1]"
                  - text: In 1985, it was estimated there were 155,000 giraffes in the wild. This declined to over 140,000 in 1999.
                  - superscript [ref=f26e3675]:
                    - link "[134]" [ref=f26e3676] [cursor=pointer]:
                      - /url: ./Giraffe#cite_note-wildstatus-134
                      - generic [ref=f26e3677]: "[134]"
                  - text: Estimates as of 2016 indicate there are approximately 97,500 members of Giraffa in the wild.
                  - superscript [ref=f26e3678]:
                    - link "[135]" [ref=f26e3679] [cursor=pointer]:
                      - /url: ./Giraffe#cite_note-135
                      - generic [ref=f26e3680]: "[135]"
                  - superscript [ref=f26e3681]:
                    - link "[136]" [ref=f26e3682] [cursor=pointer]:
                      - /url: ./Giraffe#cite_note-136
                      - generic [ref=f26e3683]: "[136]"
                  - text: The Masai and reticulated subspecies are
                  - link "endangered" [ref=f26e3684] [cursor=pointer]:
                    - /url: ./Endangered_species
                  - text: ","
                  - superscript [ref=f26e3685]:
                    - link "[137]" [ref=f26e3686] [cursor=pointer]:
                      - /url: ./Giraffe#cite_note-137
                      - generic [ref=f26e3687]: "[137]"
                  - superscript [ref=f26e3688]:
                    - link "[138]" [ref=f26e3689] [cursor=pointer]:
                      - /url: ./Giraffe#cite_note-138
                      - generic [ref=f26e3690]: "[138]"
                  - text: and the Rothschild subspecies is
                  - link "near threatened" [ref=f26e3691] [cursor=pointer]:
                    - /url: ./Near-threatened_species
                  - text: .
                  - superscript [ref=f26e3692]:
                    - link "[32]" [ref=f26e3693] [cursor=pointer]:
                      - /url: ./Giraffe#cite_note-IUCNrothschildi-32
                      - generic [ref=f26e3694]: "[32]"
                  - text: The Nubian subspecies is
                  - link "critically endangered" [ref=f26e3695] [cursor=pointer]:
                    - /url: ./Critically_endangered
                  - text: .
                  - superscript [ref=f26e3696]:
                    - link "[139]" [ref=f26e3697] [cursor=pointer]:
                      - /url: ./Giraffe#cite_note-IUCNnubian-139
                      - generic [ref=f26e3698]: "[139]"
                  - text: In 2025, the IUCN accepted four species of giraffe with seven subspecies.
                  - superscript [ref=f26e3699]:
                    - link "[1]" [ref=f26e3700] [cursor=pointer]:
                      - /url: ./Giraffe#cite_note-iucn-1
                      - generic [ref=f26e3701]: "[1]"
                  - superscript [ref=f26e3702]:
                    - link "[140]" [ref=f26e3703] [cursor=pointer]:
                      - /url: ./Giraffe#cite_note-140
                      - generic [ref=f26e3704]: "[140]"
                - figure "Endangered West African giraffe near Koure, Niger" [ref=f26e3705]:
                  - link "Photograph of an endangered West African giraffe" [ref=f26e3706] [cursor=pointer]:
                    - /url: ./File:Giraffe_koure_niger_2006.jpg
                    - img "Photograph of an endangered West African giraffe" [ref=f26e3707]
                  - generic [ref=f26e3708]:
                    - text: Endangered
                    - link "West African giraffe" [ref=f26e3709] [cursor=pointer]:
                      - /url: ./West_African_giraffe
                    - text: near
                    - link "Koure" [ref=f26e3710] [cursor=pointer]:
                      - /url: ./Kouré
                    - text: ", Niger"
                - paragraph [ref=f26e3711]:
                  - text: The primary causes for giraffe population declines are
                  - link "habitat loss" [ref=f26e3712] [cursor=pointer]:
                    - /url: ./Habitat_destruction
                  - text: and direct killing for
                  - link "bushmeat" [ref=f26e3713] [cursor=pointer]:
                    - /url: ./Bushmeat
                  - text: markets. Giraffes have been
                  - link "extirpated" [ref=f26e3714] [cursor=pointer]:
                    - /url: ./Local_extinction
                  - text: from much of their historic range, including
                  - link "Eritrea" [ref=f26e3715] [cursor=pointer]:
                    - /url: ./Eritrea
                  - text: ","
                  - link "Guinea" [ref=f26e3716] [cursor=pointer]:
                    - /url: ./Guinea
                  - text: ","
                  - link "Mauritania" [ref=f26e3717] [cursor=pointer]:
                    - /url: ./Mauritania
                  - text: and
                  - link "Senegal" [ref=f26e3718] [cursor=pointer]:
                    - /url: ./Senegal
                  - text: .
                  - superscript [ref=f26e3719]:
                    - link "[1]" [ref=f26e3720] [cursor=pointer]:
                      - /url: ./Giraffe#cite_note-iucn-1
                      - generic [ref=f26e3721]: "[1]"
                  - text: They may also have disappeared from
                  - link "Angola" [ref=f26e3722] [cursor=pointer]:
                    - /url: ./Angola
                  - text: ","
                  - link "Mali" [ref=f26e3723] [cursor=pointer]:
                    - /url: ./Mali
                  - text: ", and"
                  - link "Nigeria" [ref=f26e3724] [cursor=pointer]:
                    - /url: ./Nigeria
                  - text: ", but have been introduced to"
                  - link "Rwanda" [ref=f26e3725] [cursor=pointer]:
                    - /url: ./Rwanda
                  - text: and
                  - link "Eswatini" [ref=f26e3726] [cursor=pointer]:
                    - /url: ./Eswatini
                  - text: .
                  - superscript [ref=f26e3727]:
                    - link "[1]" [ref=f26e3728] [cursor=pointer]:
                      - /url: ./Giraffe#cite_note-iucn-1
                      - generic [ref=f26e3729]: "[1]"
                  - superscript [ref=f26e3730]:
                    - link "[139]" [ref=f26e3731] [cursor=pointer]:
                      - /url: ./Giraffe#cite_note-IUCNnubian-139
                      - generic [ref=f26e3732]: "[139]"
                  - text: As of 2010 ↗
                  - text: ", there were more than 1,600 in captivity at"
                  - link "Species360" [ref=f26e3733] [cursor=pointer]:
                    - /url: ./Species360
                  - text: "-registered zoos."
                  - superscript [ref=f26e3734]:
                    - link "[28]" [ref=f26e3735] [cursor=pointer]:
                      - /url: ./Giraffe#cite_note-ISIS-28
                      - generic [ref=f26e3736]: "[28]"
                  - text: Habitat destruction has hurt the giraffe. In the
                  - link "Sahel" [ref=f26e3737] [cursor=pointer]:
                    - /url: ./Sahel
                  - text: ", the need for firewood and grazing room for livestock has led to"
                  - link "deforestation" [ref=f26e3738] [cursor=pointer]:
                    - /url: ./Deforestation
                  - text: . Normally, giraffes can coexist with livestock, since they avoid direct competition by feeding above them.
                  - superscript [ref=f26e3739]:
                    - link "[36]" [ref=f26e3740] [cursor=pointer]:
                      - /url: ./Giraffe#cite_note-MacDonald-36
                      - generic [ref=f26e3741]: "[36]"
                  - text: In 2017, severe droughts in northern Kenya led to increased tensions over land and the killing of wildlife by herders, with giraffe populations being particularly hit.
                  - superscript [ref=f26e3742]:
                    - link "[141]" [ref=f26e3743] [cursor=pointer]:
                      - /url: ./Giraffe#cite_note-141
                      - generic [ref=f26e3744]: "[141]"
                - paragraph [ref=f26e3745]:
                  - text: Protected areas like national parks provide important habitat and anti-
                  - link "poaching" [ref=f26e3746] [cursor=pointer]:
                    - /url: ./Poaching
                  - text: protection to giraffe populations.
                  - superscript [ref=f26e3747]:
                    - link "[1]" [ref=f26e3748] [cursor=pointer]:
                      - /url: ./Giraffe#cite_note-iucn-1
                      - generic [ref=f26e3749]: "[1]"
                  - text: Community-based conservation efforts outside national parks are also effective at protecting giraffes and their habitats.
                  - superscript [ref=f26e3750]:
                    - link "[142]" [ref=f26e3751] [cursor=pointer]:
                      - /url: ./Giraffe#cite_note-142
                      - generic [ref=f26e3752]: "[142]"
                  - superscript [ref=f26e3753]:
                    - link "[143]" [ref=f26e3754] [cursor=pointer]:
                      - /url: ./Giraffe#cite_note-143
                      - generic [ref=f26e3755]: "[143]"
                  - text: Private game reserves have contributed to the preservation of giraffe populations in eastern and southern Africa.
                  - superscript [ref=f26e3756]:
                    - link "[36]" [ref=f26e3757] [cursor=pointer]:
                      - /url: ./Giraffe#cite_note-MacDonald-36
                      - generic [ref=f26e3758]: "[36]"
                  - text: The giraffe is a protected species in most of its range. It is the
                  - link "national animal" [ref=f26e3759] [cursor=pointer]:
                    - /url: ./National_animal
                  - text: of Tanzania,
                  - superscript [ref=f26e3760]:
                    - link "[144]" [ref=f26e3761] [cursor=pointer]:
                      - /url: ./Giraffe#cite_note-144
                      - generic [ref=f26e3762]: "[144]"
                  - text: and is protected by law,
                  - superscript [ref=f26e3763]:
                    - link "[145]" [ref=f26e3764] [cursor=pointer]:
                      - /url: ./Giraffe#cite_note-FoleyFoley2014-145
                      - generic [ref=f26e3765]: "[145]"
                  - text: and unauthorised killing can result in imprisonment.
                  - superscript [ref=f26e3766]:
                    - link "[146]" [ref=f26e3767] [cursor=pointer]:
                      - /url: ./Giraffe#cite_note-146
                      - generic [ref=f26e3768]: "[146]"
                  - text: The UN-backed Convention of Migratory Species selected giraffes for protection in 2017.
                  - superscript [ref=f26e3769]:
                    - link "[147]" [ref=f26e3770] [cursor=pointer]:
                      - /url: ./Giraffe#cite_note-147
                      - generic [ref=f26e3771]: "[147]"
                  - text: In 2019, giraffes were listed under Appendix II of the Convention on International Trade in Endangered Species (
                  - link "CITES" [ref=f26e3772] [cursor=pointer]:
                    - /url: ./CITES
                  - text: ), which means international trade including in parts/derivatives is regulated.
                  - superscript [ref=f26e3773]:
                    - link "[148]" [ref=f26e3774] [cursor=pointer]:
                      - /url: ./Giraffe#cite_note-148
                      - generic [ref=f26e3775]: "[148]"
                - paragraph [ref=f26e3776]:
                  - link "Translocations" [ref=f26e3777] [cursor=pointer]:
                    - /url: ./Translocation_(Wildlife_conservation)
                  - text: are sometimes used to augment or re-establish diminished or extirpated populations, but these activities are risky and difficult to undertake using the best practices of extensive pre- and post-translocation studies and ensuring a viable founding population.
                  - superscript [ref=f26e3778]:
                    - link "[149]" [ref=f26e3779] [cursor=pointer]:
                      - /url: ./Giraffe#cite_note-149
                      - generic [ref=f26e3780]: "[149]"
                  - superscript [ref=f26e3781]:
                    - link "[150]" [ref=f26e3782] [cursor=pointer]:
                      - /url: ./Giraffe#cite_note-150
                      - generic [ref=f26e3783]: "[150]"
                  - text: Aerial survey is the most common method of monitoring giraffe population trends in the vast roadless tracts of African landscapes, but aerial methods are known to undercount giraffes. Ground-based survey methods are more accurate and can be used in conjunction with aerial surveys to make accurate estimates of population sizes and trends.
                  - superscript [ref=f26e3784]:
                    - link "[151]" [ref=f26e3785] [cursor=pointer]:
                      - /url: ./Giraffe#cite_note-:4-151
                      - generic [ref=f26e3786]: "[151]"
